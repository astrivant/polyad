[project]
name = "polyad-schemas"
version = "0.0.1a15"
description = "Generated JSON Schemas for Polyad models, Kubernetes resources, events and Helm values"
authors = [{name = "Emma Doyle"}]
license = "GPL-3.0-only"
license-files = ["LICENSE", "polyad_schemas/resources/*-LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11,<4"
keywords = ["polyad", "jsonschema", "kubernetes", "helm", "validation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/astrivant/polyad"
Documentation = "https://github.com/astrivant/polyad/blob/main/docs/apis/json-schemas.md"
Repository = "https://github.com/astrivant/polyad"
Issues = "https://github.com/astrivant/polyad/issues"
Changelog = "https://github.com/astrivant/polyad/releases"

[tool.poetry]
packages = [{include = "polyad_schemas"}]
include = [
    {path = "polyad_schemas/**/*.json", format = ["sdist", "wheel"]},
    {path = "polyad_schemas/resources/*-LICENSE", format = ["sdist", "wheel"]},
]

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"
