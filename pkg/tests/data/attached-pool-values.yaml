# yaml-language-server: $schema=../../../charts/polyad/values.reference.schema.json
## @param rootControlPlane [object] Settings for rootControlPlane.
rootControlPlane:
  ## @param rootControlPlane.pools [array] Root-owned OperatorPools; existingDeployment attaches a Helm-owned worker with explicit Root or Local scaling authority.
  pools:
    ## @param rootControlPlane.pools[].name [string] Settings for rootControlPlane.pools[].name.
    - name: west-workers
      ## @param rootControlPlane.pools[].cluster [string] Settings for rootControlPlane.pools[].cluster.
      cluster: west
      ## @param rootControlPlane.pools[].replicas [integer] Settings for rootControlPlane.pools[].replicas.
      replicas: 2
      ## @param rootControlPlane.pools[].existingDeployment [string] Existing Helm-owned Deployment in the registered namespace. The root observes it and only scales it when both sides grant Root authority.
      existingDeployment: west-polyad
      ## @param rootControlPlane.pools[].scalingAuthority [string] Root applies requested replicas; Local only observes an existingDeployment and leaves scaling to its administrator.
      scalingAuthority: Root
