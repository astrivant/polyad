[project]
name = "polyad-benchmarks"
version = "0.0.1a15"
description = "Repeatable Polyad load studies with API-driven plans, bounded traffic generation, activation measurements and run-correlated results"
authors = [{name = "Emma Doyle"}]
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4"
keywords = ["polyad", "kubernetes", "load-testing", "graphs"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=3.6,<4",
    "numpy>=2.2,<3",
    "polyad-sdk==0.0.1a15",
    "polyad-types==0.0.1a15",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10,<4"]
reachability = ["hj-reachability>=0.7,<0.8", "matplotlib>=3.10,<4"]
soul = ["matplotlib>=3.10,<4"]
nature = ["matplotlib>=3.10,<4"]
process-studies = ["matplotlib>=3.10,<4"]

[project.urls]
Repository = "https://github.com/astrivant/polyad"
Documentation = "https://github.com/astrivant/polyad/tree/main/studies/load"
Issues = "https://github.com/astrivant/polyad/issues"

[project.scripts]
polyad-benchmarks = "polyad_benchmarks.runner:main"
polyad-benchmarks-fixture = "polyad_benchmarks.fixture:main"
polyad-benchmarks-refresh = "polyad_benchmarks.refresh:main"
polyad-benchmarks-plan = "polyad_benchmarks.plan:main"

[tool.poetry]
packages = [{include = "polyad_benchmarks"}]
include = [{path = "polyad_benchmarks/*.json", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
polyad-sdk = {path = "../polyad-sdk"}
polyad-types = {path = "../polyad-types"}

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10"
PyYAML = ">=6,<7"
jsonschema = ">=4.26,<5"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"
