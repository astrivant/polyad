default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--config=pyproject.toml]
        files: ^(pkg|scripts|examples)/.*\.py$
        exclude: ^pkg/tests/
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.6.6
    hooks:
      - id: pydoclint
        args: [--config=pyproject.toml]
        files: ^(pkg|scripts|examples)/.*\.py$
        exclude: ^pkg/tests/
  - repo: https://github.com/bitnami/readme-generator-for-helm
    rev: 4d29f59abac6aeed6fbc2467e24fc17560057bcb # 3.0.1
    hooks:
      - id: helm-readme-generator
        entry: bash scripts/tooling/project-python.sh scripts/schemas/generate-helm-readme.py
        files: ^(charts/polyad/|scripts/schemas/generate-helm-readme\.py$|\.pre-commit-config\.yaml$)
        language_version: 24.14.0
        args:
          - --readme=charts/polyad/README.md
          - --values=charts/polyad/values.yaml
        pass_filenames: false
  - repo: local
    hooks:
      - id: helm-values-types
        name: Helm values types and schema coverage
        entry: bash scripts/tooling/project-python.sh scripts/validation/check-values.py
        language: system
        pass_filenames: false
        files: '^(charts/polyad/values.*\.(yaml|json)|examples/.*\.yaml|examples/postgresql/operator-values\.schema\.json|pkg/tests/data/.*values\.yaml|terraform/.*values.*\.(yaml|json)|scripts/validation/check-values\.py|\.pre-commit-config\.yaml)$'
      - id: status-schemas
        name: Generated graph status schemas
        entry: bash scripts/tooling/project-python.sh scripts/schemas/generate-status-schemas.py --check
        language: system
        pass_filenames: false
        files: '^(pkg/polyad/compiler/|pkg/polyad-types/|charts/polyad/crds/|scripts/schemas/generate-status-schemas\.py$|\.pre-commit-config\.yaml$)'
      - id: event-schemas
        name: Generated public event schemas
        entry: bash scripts/tooling/project-python.sh scripts/schemas/generate-event-schemas.py --check
        language: system
        pass_filenames: false
        files: '^(pkg/polyad-types/|scripts/schemas/generate-event-schemas\.py$|\.pre-commit-config\.yaml$)'
      - id: packaged-json-schemas
        name: Generated importable JSON schemas
        entry: bash scripts/tooling/project-python.sh scripts/schemas/generate-json-schemas.py --check
        language: system
        pass_filenames: false
        files: '^(pkg/polyad-types/|charts/polyad/(crds/|values.*\.json)|scripts/schemas/|\.pre-commit-config\.yaml$)'
      - id: reference-schema
        name: Generated Helm overlay editor schema
        entry: bash scripts/tooling/project-python.sh scripts/schemas/generate-reference-schema.py --check
        language: system
        pass_filenames: false
        files: '^(charts/polyad/values.*\.json|scripts/schemas/generate-reference-schema\.py|\.pre-commit-config\.yaml)$'
      - id: network-schemas
        name: Generated graph network and capacity schemas
        entry: bash scripts/tooling/project-python.sh scripts/schemas/generate-network-schemas.py --check
        language: system
        pass_filenames: false
        files: '^(pkg/polyad/(graph|compiler)/|pkg/polyad-types/|charts/polyad/crds/|scripts/schemas/generate-network-schemas\.py$|\.pre-commit-config\.yaml$)'
      - id: docstring-layout
        name: Multiline docstring layout
        entry: bash scripts/tooling/project-python.sh scripts/validation/check-docstrings.py
        language: system
        types: [python]
      - id: mermaid-check
        name: Validate Mermaid diagrams
        entry: bash scripts/validation/check-mermaid.sh
        language: system
        pass_filenames: false
        require_serial: true
        files: '(?i)(\.(md|markdown|mmd|mermaid)$|^scripts/validation/mermaid/|^scripts/validation/check-mermaid\.sh$|^\.pre-commit-config\.yaml$)'
      - id: shellcheck
        name: ShellCheck and shfmt
        entry: bash scripts/validation/check-shell.sh
        language: system
        types: [shell]
      - id: ruff-check
        name: Ruff lint
        entry: bash scripts/tooling/project-python.sh -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: bash scripts/tooling/project-python.sh -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: bash scripts/tooling/project-python.sh -m mypy
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
