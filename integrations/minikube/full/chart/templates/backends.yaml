{{- $backends := list
  (dict "name" "prometheus" "image" "quay.io/prometheus/prometheus:v3.14.0" "port" 9090 "args" (list "--config.file=/config/config.yaml" "--storage.tsdb.path=/data/prometheus" "--storage.tsdb.retention.time=24h" "--web.enable-remote-write-receiver"))
  (dict "name" "loki" "image" "docker.io/grafana/loki:3.7.8" "port" 3100 "args" (list "-config.file=/config/config.yaml"))
  (dict "name" "tempo" "image" "docker.io/grafana/tempo:2.10.8" "port" 3200 "args" (list "-config.file=/config/config.yaml")) -}}
{{- range $backends }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: polyad-lab-{{ .name }}
data:
  config.yaml: |
{{ $.Files.Get (printf "files/%s.yaml" .name) | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polyad-lab-{{ .name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: polyad-lab-{{ .name }}
spec:
  selector:
    app: polyad-lab-{{ .name }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: {{ .port }}
    {{- if eq .name "tempo" }}
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polyad-lab-{{ .name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: polyad-lab-{{ .name }}
  template:
    metadata:
      labels:
        app: polyad-lab-{{ .name }}
      annotations:
        checksum/config: {{ $.Files.Get (printf "files/%s.yaml" .name) | sha256sum }}
    spec:
      nodeSelector:
        minikube-autoscaler.astrivant.com/pool: base
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          args: {{ .args | toJson }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: {{ ternary "/-/ready" "/ready" (eq .name "prometheus") }}
              port: {{ .port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: polyad-lab-{{ .name }}
        - name: data
          persistentVolumeClaim:
            claimName: polyad-lab-{{ .name }}
{{- end }}
