      ## @param kedaOperator.resources.operator.limits [object] Settings for kedaOperator.resources.operator.limits.
      ## @param kedaOperator.resources.operator.limits.cpu [string] Settings for kedaOperator.resources.operator.limits.cpu.
      ## @param kedaOperator.resources.operator.limits.memory [string] Settings for kedaOperator.resources.operator.limits.memory.
      limits: {cpu: 500m, memory: 512Mi}
    ## @param kedaOperator.resources.metricServer [object] Settings for kedaOperator.resources.metricServer.
    metricServer:
      ## @param kedaOperator.resources.metricServer.requests [object] Settings for kedaOperator.resources.metricServer.requests.
      ## @param kedaOperator.resources.metricServer.requests.cpu [string] Settings for kedaOperator.resources.metricServer.requests.cpu.
      ## @param kedaOperator.resources.metricServer.requests.memory [string] Settings for kedaOperator.resources.metricServer.requests.memory.
      requests: {cpu: 50m, memory: 100Mi}
      ## @param kedaOperator.resources.metricServer.limits [object] Settings for kedaOperator.resources.metricServer.limits.
      ## @param kedaOperator.resources.metricServer.limits.cpu [string] Settings for kedaOperator.resources.metricServer.limits.cpu.
      ## @param kedaOperator.resources.metricServer.limits.memory [string] Settings for kedaOperator.resources.metricServer.limits.memory.
      limits: {cpu: 500m, memory: 512Mi}
    ## @param kedaOperator.resources.webhooks [object] Settings for kedaOperator.resources.webhooks.
    webhooks:
      ## @param kedaOperator.resources.webhooks.requests [object] Settings for kedaOperator.resources.webhooks.requests.
      ## @param kedaOperator.resources.webhooks.requests.cpu [string] Settings for kedaOperator.resources.webhooks.requests.cpu.
      ## @param kedaOperator.resources.webhooks.requests.memory [string] Settings for kedaOperator.resources.webhooks.requests.memory.
      requests: {cpu: 50m, memory: 100Mi}
      ## @param kedaOperator.resources.webhooks.limits [object] Settings for kedaOperator.resources.webhooks.limits.
      ## @param kedaOperator.resources.webhooks.limits.cpu [string] Settings for kedaOperator.resources.webhooks.limits.cpu.
