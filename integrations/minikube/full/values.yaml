# yaml-language-server: $schema=values.schema.json
# Bounded single-cluster HA lab. External accounts and remote clusters stay opt-in.
## @param ha [boolean] Settings for ha.
ha: true
## @param architecture [object] Settings for architecture.
architecture:
  ## @param architecture.mode [string] Settings for architecture.mode.
  mode: Dense
  ## @param architecture.autoscaling [boolean] Settings for architecture.autoscaling.
  autoscaling: false
## @param rootControlPlane [object] Settings for rootControlPlane.
rootControlPlane:
  ## @param rootControlPlane.enabled [boolean] Settings for rootControlPlane.enabled.
  enabled: true
  ## @param rootControlPlane.mode [string] Settings for rootControlPlane.mode.
  mode: Local
## @param global [object] Settings for global.
global:
  ## @param global.istioNamespace [string] Settings for global.istioNamespace.
  istioNamespace: polyad
  ## @param global.multiCluster [object] Settings for global.multiCluster.
  multiCluster:
    ## @param global.multiCluster.clusterName [string] Settings for global.multiCluster.clusterName.
    clusterName: polyad
## @param operator [object] Settings for operator.
operator:
  ## @param operator.nodeSelector [object] Settings for operator.nodeSelector.
  ## @param operator.nodeSelector.polyad.astrivant.com/minikube-pool [string] Settings for operator.nodeSelector.polyad.astrivant.com/minikube-pool.
  ## @param operator.nodeSelector.polyad.astrivant.com/minikube-worker [string] Settings for operator.nodeSelector.polyad.astrivant.com/minikube-worker.
  nodeSelector: {polyad.astrivant.com/minikube-pool: base, polyad.astrivant.com/minikube-worker: 'true'}
  ## @param operator.replicaCount [integer] Settings for operator.replicaCount.
  replicaCount: 2
  ## @param operator.terminationGracePeriodSeconds [integer] Settings for operator.terminationGracePeriodSeconds.
  terminationGracePeriodSeconds: 90
  # The full atlas validates more dependencies than the standalone three-branch
  # graph. Allow independent writes to progress on these resource-limited VMs.
  ## @param operator.writeQueue [object] Settings for operator.writeQueue.
  writeQueue:
    ## @param operator.writeQueue.maxInFlight [integer] Settings for operator.writeQueue.maxInFlight.
    maxInFlight: 2
    ## @param operator.writeQueue.maxPending [integer] Settings for operator.writeQueue.maxPending.
    maxPending: 4
    ## @param operator.writeQueue.plannerParallelism [integer] Settings for operator.writeQueue.plannerParallelism.
    plannerParallelism: 2
    ## @param operator.writeQueue.validationWorkers [integer] Settings for operator.writeQueue.validationWorkers.
    validationWorkers: 2
    ## @param operator.writeQueue.reconciliationWorkers [integer] Settings for operator.writeQueue.reconciliationWorkers.
    reconciliationWorkers: 2
    ## @param operator.writeQueue.validationWindowSeconds [integer] Settings for operator.writeQueue.validationWindowSeconds.
    validationWindowSeconds: 15
  ## @param operator.resources [object] Settings for operator.resources.
  resources:
    ## @param operator.resources.requests [object] Settings for operator.resources.requests.
    ## @param operator.resources.requests.cpu [string] Settings for operator.resources.requests.cpu.
    ## @param operator.resources.requests.memory [string] Settings for operator.resources.requests.memory.
    requests: {cpu: 250m, memory: 512Mi}
    ## @param operator.resources.limits [object] Settings for operator.resources.limits.
    ## @param operator.resources.limits.cpu [string] Settings for operator.resources.limits.cpu.
    ## @param operator.resources.limits.memory [string] Settings for operator.resources.limits.memory.
    limits: {cpu: '1', memory: 1Gi}
  ## @param operator.autoscaling [object] Settings for operator.autoscaling.
  autoscaling:
    ## @param operator.autoscaling.enabled [boolean] Settings for operator.autoscaling.enabled.
    enabled: true
    ## @param operator.autoscaling.minReplicas [integer] Settings for operator.autoscaling.minReplicas.
    minReplicas: 2
    ## @param operator.autoscaling.maxReplicas [integer] Settings for operator.autoscaling.maxReplicas.
    maxReplicas: 3
    ## @param operator.autoscaling.connections [object] Settings for operator.autoscaling.connections.
    connections:
      ## @param operator.autoscaling.connections.enabled [boolean] Settings for operator.autoscaling.connections.enabled.
      enabled: true
  ## @param operator.cheeger [object] Settings for operator.cheeger.
  cheeger:
    ## @param operator.cheeger.reduction [object] Settings for operator.cheeger.reduction.
    reduction:
      ## @param operator.cheeger.reduction.enabled [boolean] Settings for operator.cheeger.reduction.enabled.
      enabled: true
      ## @param operator.cheeger.reduction.strategy [string] Settings for operator.cheeger.reduction.strategy.
      strategy: AdaptivePID
      ## @param operator.cheeger.reduction.feedback [string] Settings for operator.cheeger.reduction.feedback.
      feedback: CertificateGap
## @param dragonfly [object] Settings for dragonfly.
dragonfly:
  ## @param dragonfly.nodeSelector [object] Settings for dragonfly.nodeSelector.
  ## @param dragonfly.nodeSelector.polyad.astrivant.com/minikube-pool [string] Settings for dragonfly.nodeSelector.polyad.astrivant.com/minikube-pool.
  nodeSelector: {polyad.astrivant.com/minikube-pool: base}
  ## @param dragonfly.ha [object] Settings for dragonfly.ha.
  ha:
    ## @param dragonfly.ha.enabled [boolean] Settings for dragonfly.ha.enabled.
    enabled: true
    ## @param dragonfly.ha.replicas [integer] Settings for dragonfly.ha.replicas.
    replicas: 2
  ## @param dragonfly.autoscaling [object] Settings for dragonfly.autoscaling.
  autoscaling:
    ## @param dragonfly.autoscaling.enabled [boolean] Settings for dragonfly.autoscaling.enabled.
    enabled: true
    ## @param dragonfly.autoscaling.minReplicas [integer] Settings for dragonfly.autoscaling.minReplicas.
    minReplicas: 2
    ## @param dragonfly.autoscaling.maxReplicas [integer] Settings for dragonfly.autoscaling.maxReplicas.
    maxReplicas: 3
  ## @param dragonfly.persistence [object] Settings for dragonfly.persistence.
  persistence:
    ## @param dragonfly.persistence.enabled [boolean] Settings for dragonfly.persistence.enabled.
    enabled: true
    ## @param dragonfly.persistence.size [string] Settings for dragonfly.persistence.size.
    size: 1Gi
    ## @param dragonfly.persistence.storageClass [string] Settings for dragonfly.persistence.storageClass.
    storageClass: local-path
## @param dragonflyOperator [object] Settings for dragonflyOperator.
dragonflyOperator:
  ## @param dragonflyOperator.nodeSelector [object] Settings for dragonflyOperator.nodeSelector.
  ## @param dragonflyOperator.nodeSelector.polyad.astrivant.com/minikube-pool [string] Settings for dragonflyOperator.nodeSelector.polyad.astrivant.com/minikube-pool.
  nodeSelector: {polyad.astrivant.com/minikube-pool: base}
  ## @param dragonflyOperator.replicaCount [integer] Settings for dragonflyOperator.replicaCount.
  replicaCount: 2
