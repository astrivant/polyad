## @param authentication [object] Settings for authentication.
authentication:
  ## @param authentication.mode [string] Settings for authentication.mode.
  mode: Required
  ## @param authentication.storage [object] Settings for authentication.storage.
  storage:
    ## @param authentication.storage.enabled [boolean] Settings for authentication.storage.enabled.
    enabled: true
    ## @param authentication.storage.separateDatabase [boolean] Settings for authentication.storage.separateDatabase.
    separateDatabase: false
  ## @param authentication.operators [array] Settings for authentication.operators.
  operators:
    ## @param authentication.operators[].name [string] Settings for authentication.operators[].name.
    - name: local-metrics
      ## @param authentication.operators[].direction [string] Settings for authentication.operators[].direction.
      direction: Inbound
      ## @param authentication.operators[].existingSecret [string] Settings for authentication.operators[].existingSecret.
      existingSecret: polyad-metrics
      ## @param authentication.operators[].secretKey [string] Settings for authentication.operators[].secretKey.
      secretKey: token
      ## @param authentication.operators[].endpoints [array] Settings for authentication.operators[].endpoints.
      endpoints: [metrics]
      ## @param authentication.operators[].requestsPerMinute [integer] Settings for authentication.operators[].requestsPerMinute.
      requestsPerMinute: 1200
      ## @param authentication.operators[].maxConcurrentRequests [integer] Settings for authentication.operators[].maxConcurrentRequests.
      maxConcurrentRequests: 32
