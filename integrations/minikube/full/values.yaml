## @param kedaOperator [object] Settings for kedaOperator.
kedaOperator:
  ## @param kedaOperator.nodeSelector [object] Settings for kedaOperator.nodeSelector.
  ## @param kedaOperator.nodeSelector.polyad.astrivant.com/minikube-pool [string] Settings for kedaOperator.nodeSelector.polyad.astrivant.com/minikube-pool.
  nodeSelector: {polyad.astrivant.com/minikube-pool: base}
  # CRDs are applied before installation by full.sh, with one stable field owner.
  ## @param kedaOperator.crds [object] Settings for kedaOperator.crds.
  crds:
