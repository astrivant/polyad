      sidecar.istio.io/nativeSidecar: 'true'
      ## @param kedaOperator.podAnnotations.keda.proxy.istio.io/config [string] Settings for kedaOperator.podAnnotations.keda.proxy.istio.io/config.
      proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
  ## @param kedaOperator.resources [object] Settings for kedaOperator.resources.
  resources:
