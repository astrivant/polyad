    install: false
  ## @param kedaOperator.podLabels [object] Settings for kedaOperator.podLabels.
  podLabels:
    ## @param kedaOperator.podLabels.keda [object] Settings for kedaOperator.podLabels.keda.
    keda:
      ## @param kedaOperator.podLabels.keda.sidecar.istio.io/inject [string] Settings for kedaOperator.podLabels.keda.sidecar.istio.io/inject.
      sidecar.istio.io/inject: 'true'
  ## @param kedaOperator.podAnnotations [object] Settings for kedaOperator.podAnnotations.
  podAnnotations:
    ## @param kedaOperator.podAnnotations.keda [object] Settings for kedaOperator.podAnnotations.keda.
    keda:
      ## @param kedaOperator.podAnnotations.keda.sidecar.istio.io/inject [string] Settings for kedaOperator.podAnnotations.keda.sidecar.istio.io/inject.
      sidecar.istio.io/inject: 'true'
