{{- if .Values.dragonfly.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dragonfly
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: dragonfly
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-dragonfly
spec:
  serviceName: {{ .Release.Name }}-dragonfly
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: dragonfly
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: dragonfly
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: dragonfly
          image: {{ .Values.dragonfly.image | quote }}
          args:
            - --logtostderr
            - --proactor_threads=1
            - --maxmemory=256mb
            - --cache_mode=false
            - --dir=/data
            - --dbfilename=dump
            - --snapshot_cron=*/5 * * * *
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: redis
          livenessProbe:
            tcpSocket:
              port: redis
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.dragonfly.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.dragonfly.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.dragonfly.persistence.storageClass }}
        storageClassName: {{ .Values.dragonfly.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.dragonfly.persistence.size }}
  {{- end }}
{{- end }}
