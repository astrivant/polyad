{{- if and .Values.api.gateway.enabled .Values.api.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-polyad-api
spec:
  gatewayClassName: {{ .Values.api.gateway.className | quote }}
  listeners:
    - name: {{ .Values.api.gateway.sectionName | quote }}
      {{- if .Values.api.gateway.tlsSecret }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.api.gateway.tlsSecret | quote }}
      {{- else }}
      protocol: HTTP
      port: 80
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
{{- end }}
