apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: polyad
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}-polyad
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --namespace={{ .Release.Namespace }}
            - --liveness=http://0.0.0.0:8080/healthz
          env:
            - name: POLYAD_CACHE_URL
              {{- if .Values.dragonfly.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dragonfly.existingSecret | quote }}
                  key: url
              {{- else if .Values.dragonfly.enabled }}
              value: {{ printf "redis://%s-queue:6379/0" .Release.Name | quote }}
              {{- else }}
              value: {{ required "dragonfly.externalUrl or dragonfly.existingSecret is required when the bundled cache is disabled" .Values.dragonfly.externalUrl | quote }}
              {{- end }}
            {{- if .Values.api.enabled }}
            - name: POLYAD_API_ENABLED
              value: "true"
            - name: POLYAD_API_RATE_LIMIT_ENABLED
              value: {{ .Values.api.rateLimit.enabled | quote }}
            - name: POLYAD_API_REQUESTS_PER_MINUTE
              value: {{ .Values.api.rateLimit.requestsPerMinute | quote }}
            - name: POLYAD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret | quote }}
                  key: token
            {{- end }}
          ports:
            {{- if .Values.api.enabled }}
            - name: composition
              containerPort: 8090
            {{- end }}
            - name: health
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import json,urllib.request; s=json.load(urllib.request.urlopen('http://localhost:8080/healthz',timeout=2))['scheduler']; assert s['initialized'] and s['worker'] and s['apiFresh'] and s['cacheFresh']"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
