{{- if .Values.externalSecrets.enabled }}
{{- $names := dict }}
{{- range .Values.externalSecrets.secrets }}
{{- $secretName := .name }}
{{- if hasKey $names .name }}{{ fail "ExternalSecret target names must be unique" }}{{ end }}
{{- $_ := set $names .name true }}
{{- $keys := dict }}
{{- range .data }}
{{- if hasKey $keys .secretKey }}{{ fail "ExternalSecret data keys must be unique within each target Secret" }}{{ end }}
{{- $_ := set $keys .secretKey true }}
{{- end }}
{{- range $endpoint := list "api" "events" }}
{{- $config := index $.Values $endpoint }}
{{- if and $config.enabled $config.key (eq (printf "%s-polyad-%s" $.Release.Name $endpoint) $secretName) }}{{ fail "ExternalSecret cannot also be managed by an inline credential" }}{{ end }}
{{- end }}
{{- if and $.Values.metrics.enabled $.Values.metrics.authentication.enabled $.Values.metrics.authentication.key (eq .name (printf "%s-polyad-metrics" $.Release.Name)) }}{{ fail "ExternalSecret cannot also be managed by an inline metrics credential" }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" $.Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .name | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- toYaml .data | nindent 4 }}
{{- end }}
{{- end }}
