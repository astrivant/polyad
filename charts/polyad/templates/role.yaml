apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-polyad
rules:
  - apiGroups: [polyad.astrivant.com]
    resources: [graphs, polygraphs, ephemeralgraphs, workloads, daemons, ephemerals, resources, gates, shutdownpolicies, feedbacks, rewrites, compositions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [polyad.astrivant.com]
    resources: [graphs/status, polygraphs/status, ephemeralgraphs/status, feedbacks/status, rewrites/status, compositions/status]
    verbs: [get, patch]
  - apiGroups: [polyad.astrivant.com]
    resources: [graphs/finalizers, polygraphs/finalizers, ephemeralgraphs/finalizers, feedbacks/finalizers, rewrites/finalizers, compositions/finalizers]
    verbs: [update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, create, update, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [services, configmaps, persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [polyad.astrivant.com]
    resources: [graphrules]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, delete]
  {{- if .Values.mesh.enabled }}
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies, peerauthentications]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [create]
  {{- end }}
