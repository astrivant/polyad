{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-polyad
rules:
  - apiGroups: [polyad.astrivant.com]
    resources: [graphs, polygraphs, workloads, daemons, resources, gates, shutdownpolicies, rewrites, compositions, activations, replicagroups, temporaryconnections]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [polyad.astrivant.com]
    resources: [graphs/status, polygraphs/status, rewrites/status, compositions/status, activations/status, replicagroups/status, temporaryconnections/status]
    verbs: [get, patch]
  - apiGroups: [polyad.astrivant.com]
    resources: [graphs/finalizers, polygraphs/finalizers, rewrites/finalizers, compositions/finalizers, replicagroups/finalizers, temporaryconnections/finalizers]
    verbs: [update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, create, update, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [services, configmaps, persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [polyad.astrivant.com]
    resources: [graphrules]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, delete]
  {{- if .Values.mesh.enabled }}
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies, peerauthentications]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [create]
  {{- end }}

  {{- if .Values.capacity.enabled }}
  - apiGroups: [autoscaling.x-k8s.io]
    resources: [provisioningrequests]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [podtemplates, pods]
    verbs: [get, list, create, delete]
  {{- end }}

  {{- if .Values.rootControlPlane.enabled }}
  - apiGroups: [polyad.astrivant.com]
    resources: [operatorpools, remotescales]
    verbs: [get, list, watch, patch]
  - apiGroups: [polyad.astrivant.com]
    resources: [operatorpools/status, remotescales/status, operatorpools/finalizers]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get]
  {{- end }}
{{- end -}}
