{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if .Values.mesh.install }}
{{- if ne .Values.global.istioNamespace .Release.Namespace }}{{ fail "mesh.install requires global.istioNamespace to equal the release namespace" }}{{ end }}
{{- end }}
{{- if .Values.mesh.operator.enabled }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  mtls:
    mode: STRICT
  portLevelMtls:
    '8080':
      mode: DISABLE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ['8080']
    {{- with .Values.mesh.operator.compositionPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8090"]
            methods: [GET, POST]
            paths: [/v1/compositions, /v1/compositions/*, /v1/activations, /v1/activations/*, /v1/throughput, /openapi.json]
    {{- end }}
    {{- if .Values.metrics.enabled }}
    {{- with .Values.mesh.operator.metricsPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8092"]
            methods: [GET]
            paths: [/metrics, /v1/metrics, /v1/workloads/*, /v1/components/*, /v1/postgresql/connections, /v1/dragonfly/connections, /openapi.json]
    {{- end }}
    {{- end }}
    {{- with .Values.mesh.operator.eventPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8091"]
            methods: [GET]
            paths: [/v1/events, /v1/events/config, /v1/events/schema, {{ if $.Values.events.rebalance.enabled }}/v1/events/endpoints, {{ end }}{{ if $.Values.events.websockets.enabled }}/v1/events/ws, {{ end }}/v1/discovery, /v1/graphs/*, /openapi.json]
    {{- end }}
    {{- if .Values.connections.enabled }}
    {{- with .Values.mesh.operator.connectionPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8093"]
            methods: [GET, POST, DELETE]
            paths: [/v1/connections, /v1/connections/*, /openapi.json]
    {{- end }}
    {{- end }}
{{- end }}
{{- end -}}
