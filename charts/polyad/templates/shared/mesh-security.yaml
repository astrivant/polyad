{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if .Values.mesh.install }}
{{- if ne .Values.global.istioNamespace .Release.Namespace }}{{ fail "mesh.install requires global.istioNamespace to equal the release namespace" }}{{ end }}
{{- end }}
{{- if .Values.mesh.operator.enabled }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  mtls:
    mode: STRICT
  portLevelMtls:
    '8080':
      mode: DISABLE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ['8080']
    {{- with .Values.mesh.operator.compositionPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8090"]
            methods: [GET, POST]
            paths: [/v1/compositions, /v1/compositions/*, /v1/activations, /v1/activations/*, /v1/throughput, /openapi.json]
    {{- end }}
    {{- if .Values.metrics.enabled }}
    {{- if .Values.telemetry.enabled }}
    - from:
        - source:
            principals: [{{ printf "%s/ns/%s/sa/%s-telemetry" (dig "meshConfig" "trustDomain" "cluster.local" .Values.istiod) .Release.Namespace .Release.Name | quote }}]
      to:
        - operation:
            ports: ['8092']
            methods: [GET]
            paths: [/metrics]
    {{- end }}
    {{- with .Values.mesh.operator.metricsPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8092"]
            methods: [GET]
            paths: [/metrics, /v1/metrics, /v1/workloads/*, /v1/components/*, /v1/postgresql/connections, /v1/dragonfly/connections, /openapi.json]
    {{- end }}
    {{- end }}
    {{- with .Values.mesh.operator.eventPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8091"]
            methods: [GET]
            paths: [/v1/events, /v1/events/config, /v1/events/schema, {{ if $.Values.events.rebalance.enabled }}/v1/events/endpoints, {{ end }}{{ if $.Values.events.websockets.enabled }}/v1/events/ws, {{ end }}/v1/discovery, /v1/graphs/*, /openapi.json]
    {{- end }}
    {{- if .Values.connections.enabled }}
    {{- with .Values.mesh.operator.connectionPrincipals }}
    - from:
        - source:
            principals:
              {{- toYaml . | nindent 14 }}
      to:
        - operation:
            ports: ["8093"]
            methods: [GET, POST, DELETE]
            paths: [/v1/connections, /v1/connections/*, /openapi.json]
    {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.mesh.authorization.audit.enabled }}
{{- if not .Values.mesh.operator.enabled }}{{ fail "authorization audit requires mesh.operator.enabled" }}{{ end }}
{{- if not .Values.mesh.authorization.audit.paths }}{{ fail "authorization audit requires at least one path" }}{{ end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-polyad-audit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  action: AUDIT
  rules:
    - to:
        - operation:
            {{- with .Values.mesh.authorization.audit.methods }}
            methods: {{ toJson . }}
            {{- end }}
            paths: {{ toJson .Values.mesh.authorization.audit.paths }}
{{- end }}
{{- if .Values.mesh.authorization.dryRunDeny.enabled }}
{{- if not .Values.mesh.operator.enabled }}{{ fail "authorization dry-run requires mesh.operator.enabled" }}{{ end }}
{{- if not .Values.mesh.authorization.dryRunDeny.paths }}{{ fail "authorization dry-run requires at least one path" }}{{ end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-polyad-dry-run-deny
  annotations:
    istio.io/dry-run: 'true'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  action: DENY
  rules:
    - to:
        - operation:
            {{- with .Values.mesh.authorization.dryRunDeny.methods }}
            methods: {{ toJson . }}
            {{- end }}
            paths: {{ toJson .Values.mesh.authorization.dryRunDeny.paths }}
{{- end }}
{{- if .Values.mesh.ingress.jwt.enabled }}
{{- if not (or .Values.mesh.ingress.enabled .Values.mesh.ingress.gatewayAPI.enabled) }}{{ fail "ingress JWT requires a managed mesh ingress" }}{{ end }}
{{- if not .Values.mesh.ingress.jwt.issuer }}{{ fail "ingress JWT requires an issuer" }}{{ end }}
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: {{ .Release.Name }}-polyad-ingress
spec:
  {{- if .Values.mesh.ingress.gatewayAPI.enabled }}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-polyad
  {{- else }}
  selector:
    matchLabels:
      istio: polyad-ingress
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- end }}
  jwtRules:
    - issuer: {{ .Values.mesh.ingress.jwt.issuer | quote }}
      {{- with .Values.mesh.ingress.jwt.audiences }}
      audiences: {{ toJson . }}
      {{- end }}
      {{- with .Values.mesh.ingress.jwt.jwksUri }}
      jwksUri: {{ . | quote }}
      {{- end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-polyad-ingress-jwt
spec:
  {{- if .Values.mesh.ingress.gatewayAPI.enabled }}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-polyad
  {{- else }}
  selector:
    matchLabels:
      istio: polyad-ingress
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- end }}
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals: ['*']
{{- end }}
{{- end -}}
