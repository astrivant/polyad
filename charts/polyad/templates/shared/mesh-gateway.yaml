{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if or .Values.mesh.ingress.enabled .Values.mesh.ingress.gatewayAPI.enabled }}
{{- if not .Values.mesh.enabled }}{{ fail "managed Istio ingress requires mesh.enabled" }}{{ end }}
{{- if or (not .Values.mesh.ingress.hosts) (not .Values.mesh.ingress.tlsSecret) }}{{ fail "managed Istio ingress requires hosts and tlsSecret" }}{{ end }}
{{- if .Values.mesh.ingress.gatewayAPI.enabled }}
{{- if .Values.mesh.ingress.enabled }}{{ fail "enable either legacy mesh ingress or Gateway API ingress, not both" }}{{ end }}
{{- if .Values.api.gateway.enabled }}{{ fail "mesh.ingress GatewayAPI mode replaces api.gateway; enable only one managed ingress" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  gatewayClassName: {{ .Values.mesh.ingress.gatewayAPI.className | quote }}
  listeners:
    {{- range $index, $host := .Values.mesh.ingress.hosts }}
    - name: {{ printf "https-%d" $index }}
      protocol: HTTPS
      port: 443
      hostname: {{ $host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.mesh.ingress.tlsSecret | quote }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  parentRefs:
    - name: {{ .Release.Name }}-polyad
  hostnames:
    {{- toYaml .Values.mesh.ingress.hosts | nindent 4 }}
  rules:
    {{- if .Values.events.enabled }}
    - matches:
        - path: {type: Exact, value: /v1/events}
        - path: {type: Exact, value: /v1/events/config}
        - path: {type: Exact, value: /v1/events/schema}
        {{- if .Values.events.rebalance.enabled }}
        - path: {type: Exact, value: /v1/events/endpoints}
        {{- end }}
        {{- if .Values.events.websockets.enabled }}
        - path: {type: Exact, value: /v1/events/ws}
        {{- end }}
        - path: {type: Exact, value: /v1/discovery}
        - path: {type: PathPrefix, value: /v1/graphs/}
      backendRefs:
        - name: {{ .Release.Name }}-polyad-events
          port: 8091
    {{- end }}
    {{- if .Values.api.enabled }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ .Release.Name }}-polyad-api
          port: 8090
    {{- end }}
{{- else }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  selector:
    istio: polyad-ingress
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        {{- toYaml .Values.mesh.ingress.hosts | nindent 8 }}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.mesh.ingress.tlsSecret | quote }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  hosts:
    {{- toYaml .Values.mesh.ingress.hosts | nindent 4 }}
  gateways: [{{ printf "%s-polyad" .Release.Name | quote }}]
  http:
    {{- if .Values.events.enabled }}
    - match:
        - uri:
            exact: /v1/events
        - uri:
            exact: /v1/events/config
        - uri:
            exact: /v1/events/schema
        {{- if .Values.events.rebalance.enabled }}
        - uri:
            exact: /v1/events/endpoints
        {{- end }}
        {{- if .Values.events.websockets.enabled }}
        - uri:
            exact: /v1/events/ws
        {{- end }}
        - uri:
            exact: /v1/discovery
        - uri:
            prefix: /v1/graphs/
        - uri:
            exact: /events/openapi.json
      rewrite:
        uriRegexRewrite:
          match: ^/events/openapi.json$
          rewrite: /openapi.json
      route:
        - destination:
            host: {{ .Release.Name }}-polyad-events
            port:
              number: 8091
    {{- end }}
    {{- if .Values.api.enabled }}
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Release.Name }}-polyad-api
            port:
              number: 8090
    {{- end }}
{{- end }}
{{- end }}
{{- end -}}
