apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: operatorpools.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: OperatorPool
    plural: operatorpools
    singular: operatorpool
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
        labelSelectorPath: .status.labelSelector
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - cluster
            - replicas
            properties:
              cluster:
                type: string
                minLength: 1
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: cluster is immutable
              replicas:
                type: integer
                minimum: 0
                maximum: 32
                default: 1
              resources:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              nodeSelector:
                type: object
                additionalProperties:
                  type: string
              tolerations:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 0
              readyReplicas:
                type: integer
                minimum: 0
              labelSelector:
                type: string
              observedGeneration:
                type: integer
              phase:
                type: string
              message:
                type: string
              observedAt:
                type: string
                format: date-time
