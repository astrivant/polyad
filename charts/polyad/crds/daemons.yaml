apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: daemons.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: Daemon
    plural: daemons
    singular: daemon
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: 'API group and version of this custom resource: polyad.astrivant.com/v1alpha1.'
          kind:
            type: string
            description: 'Custom resource kind: Daemon.'
          metadata:
            type: object
            properties: {}
          spec:
            type: object
            properties:
              activation:
                type: object
                description: Control how repeated requests start a downstream workload or graph.
                properties:
                  mode:
                    type: string
                    enum:
                    - Queue
                    - Reject
                    - Coalesce
                    - Parallel
                    description: Busy-target admission policy.
                  maxConcurrent:
                    type: integer
                    description: Maximum selected or running executions for parallel mode.
                    minimum: 1
                    maximum: 64
                  maxPending:
                    type: integer
                    description: Maximum retained pending requests admitted to the queue.
                    minimum: 1
                    maximum: 1024
                  replicasPerActivation:
                    type: integer
                    description: Deployment or StatefulSet replicas in each daemon activation.
                    minimum: 1
                    maximum: 1024
                  maxReplicas:
                    type: integer
                    description: Upper bound on the total daemon replicas reserved by concurrent pulses.
                    minimum: 1
                    maximum: 1024
                  minIntervalSeconds:
                    type: integer
                    description: Minimum time between execution admissions.
                    minimum: 0
                    maximum: 86400
                  maxIntervalSeconds:
                    type: integer
                    nullable: true
                    description: Maximum expected time between admissions.
                    minimum: 1
                    maximum: 604800
                  onDeadline:
                    type: string
                    enum:
                    - Report
                    - Activate
                    description: Report overdue admission or submit a timer pulse.
              template:
                type: object
                properties:
                  metadata:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    description: Pod metadata, including application labels, annotations and externally managed
                      cleanup finalizers.
                  spec:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    required:
                    - containers
                    description: Native Kubernetes Pod spec. Include containers and any resource requests, volumes,
                      probes or lifecycle hooks. Daemon containers require startup, readiness and liveness probes;
                      inherited graph placement also applies.
                required:
                - spec
                description: Kubernetes Pod template for graph-owned execution. Container commands, resource requests,
                  volumes and probes are application-defined; the operator sets restart policy and inherited placement.
              controller:
                type: string
                enum: [Deployment, StatefulSet]
                default: Deployment
                description: Native controller for this persistent workload.
              statefulSet:
                type: object
                description: StatefulSet identity, storage and rollout options; requires controller StatefulSet.
                required: [serviceName]
                properties:
                  serviceName:
                    type: string
                    minLength: 1
                    description: Existing governing headless Service; supports graph resource-name references.
                  volumeClaimTemplates:
                    type: array
                    description: Native per-replica PVC templates. Mount each template by name in the Pod template.
                    items:
                      type: object
                      required: [metadata, spec]
                      properties:
                        metadata:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          required: [name]
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 63
                        spec:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          description: Native PVC spec including storageClassName, accessModes, resources, volumeMode and data sources.
                  podManagementPolicy:
                    type: string
                    enum: [OrderedReady, Parallel]
                    default: OrderedReady
                  updateStrategy:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [RollingUpdate, OnDelete]
                      rollingUpdate:
                        type: object
                        properties:
                          partition:
                            type: integer
                            minimum: 0
                          maxUnavailable:
                            x-kubernetes-int-or-string: true
                            anyOf:
                            - type: integer
                            - type: string
                  persistentVolumeClaimRetentionPolicy:
                    type: object
                    description: PVC retention after set deletion and native replica reduction; both default to Retain.
                    properties:
                      whenDeleted:
                        type: string
                        enum: [Retain, Delete]
                      whenScaled:
                        type: string
                        enum: [Retain, Delete]
                  minReadySeconds:
                    type: integer
                    minimum: 0
                    default: 0
                  revisionHistoryLimit:
                    type: integer
                    minimum: 0
                    default: 10
                  ordinals:
                    type: object
                    properties:
                      start:
                        type: integer
                        minimum: 0
              replicas:
                type: integer
                minimum: 1
                default: 1
                description: Desired number of daemon replicas. Readiness requires the selected controller to observe its current generation and requested rollout.
              placement:
                type: object
                properties:
                  nodeSelector:
                    type: object
                    additionalProperties:
                      type: string
                      description: Value for an individual key in nodeSelector.
                    description: Exact Kubernetes node-label matches, all of which must hold. Use labels for node
                      groups or resource slices; cloud tags must first be exposed as node labels. Conflicting inherited
                      values are rejected.
                  nodeAffinity:
                    type: object
                    properties:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        type: object
                        properties:
                          nodeSelectorTerms:
                            type: array
                            items:
                              type: object
                              properties:
                                matchExpressions:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      key:
                                        type: string
                                        description: Node label or node field tested by this requirement.
                                      operator:
                                        type: string
                                        enum:
                                        - In
                                        - NotIn
                                        - Exists
                                        - DoesNotExist
                                        - Gt
                                        - Lt
                                        description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                          Gt or Lt.'
                                      values:
                                        type: array
                                        items:
                                          type: string
                                          description: One entry in values.
                                        description: Comparison values for this requirement. In and NotIn use a
                                          nonempty set; Exists and DoesNotExist use no values; Gt and Lt use one
                                          integer encoded as a string.
                                    required:
                                    - key
                                    - operator
                                    description: One entry in matchExpressions.
                                  description: Node-label requirements combined with AND within this term.
                                matchFields:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      key:
                                        type: string
                                        description: Node label or node field tested by this requirement.
                                      operator:
                                        type: string
                                        enum:
                                        - In
                                        - NotIn
                                        - Exists
                                        - DoesNotExist
                                        - Gt
                                        - Lt
                                        description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                          Gt or Lt.'
                                      values:
                                        type: array
                                        items:
                                          type: string
                                          description: One entry in values.
                                        description: Comparison values for this requirement. In and NotIn use a
                                          nonempty set; Exists and DoesNotExist use no values; Gt and Lt use one
                                          integer encoded as a string.
                                    required:
                                    - key
                                    - operator
                                    description: One entry in matchFields.
                                  description: Node-field requirements combined with AND within this term.
                              description: One entry in nodeSelectorTerms.
                            description: Alternative node-selection terms combined with OR. Expressions within one
                              term are combined with AND. An empty term selects no nodes.
                        required:
                        - nodeSelectorTerms
                        description: Hard node eligibility rules evaluated when scheduling. Changes to node labels
                          after scheduling do not by themselves evict a running pod.
                      preferredDuringSchedulingIgnoredDuringExecution:
                        type: array
                        items:
                          type: object
                          properties:
                            weight:
                              type: integer
                              minimum: 1
                              maximum: 100
                              description: Preference weight from 1 to 100. Matching preferred rules contribute
                                to the node scheduling score.
                            preference:
                              type: object
                              properties:
                                matchExpressions:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      key:
                                        type: string
                                        description: Node label or node field tested by this requirement.
                                      operator:
                                        type: string
                                        enum:
                                        - In
                                        - NotIn
                                        - Exists
                                        - DoesNotExist
                                        - Gt
                                        - Lt
                                        description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                          Gt or Lt.'
                                      values:
                                        type: array
                                        items:
                                          type: string
                                          description: One entry in values.
                                        description: Comparison values for this requirement. In and NotIn use a
                                          nonempty set; Exists and DoesNotExist use no values; Gt and Lt use one
                                          integer encoded as a string.
                                    required:
                                    - key
                                    - operator
                                    description: One entry in matchExpressions.
                                  description: Node-label requirements combined with AND within this term.
                                matchFields:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      key:
                                        type: string
                                        description: Node label or node field tested by this requirement.
                                      operator:
                                        type: string
                                        enum:
                                        - In
                                        - NotIn
                                        - Exists
                                        - DoesNotExist
                                        - Gt
                                        - Lt
                                        description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                          Gt or Lt.'
                                      values:
                                        type: array
                                        items:
                                          type: string
                                          description: One entry in values.
                                        description: Comparison values for this requirement. In and NotIn use a
                                          nonempty set; Exists and DoesNotExist use no values; Gt and Lt use one
                                          integer encoded as a string.
                                    required:
                                    - key
                                    - operator
                                    description: One entry in matchFields.
                                  description: Node-field requirements combined with AND within this term.
                              description: Node-selection term whose match contributes the associated weight.
                          required:
                          - weight
                          - preference
                          description: One entry in preferredDuringSchedulingIgnoredDuringExecution.
                        description: Weighted node preferences applied after hard eligibility checks. Unmatched
                          preferences do not prevent scheduling.
                    description: Required and preferred Kubernetes node-selection rules. Required rules intersect
                      across graph, definition and pod scopes; preferences are combined.
                  tolerations:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: Taint key to match. An empty key requires operator Exists and matches all
                            keys.
                        operator:
                          type: string
                          enum:
                          - Exists
                          - Equal
                          description: 'Taint comparison: Equal matches key and value; Exists matches the key regardless
                            of value. Kubernetes defaults an omitted operator to Equal.'
                        value:
                          type: string
                          description: Taint value to match when operator is Equal. Omit or leave empty when operator
                            is Exists.
                        effect:
                          type: string
                          enum:
                          - ''
                          - NoSchedule
                          - PreferNoSchedule
                          - NoExecute
                          description: 'Taint effect to match. An empty effect matches all effects: NoSchedule,
                            PreferNoSchedule and NoExecute.'
                        tolerationSeconds:
                          type: integer
                          format: int64
                          minimum: 0
                          description: Seconds a pod may remain bound after a matching NoExecute taint. Omission
                            tolerates that taint indefinitely; zero requests immediate eviction.
                      description: One entry in tolerations.
                    description: Kubernetes taints tolerated by descendant pods, deduplicated across scopes. Tolerations
                      allow placement on tainted nodes; they do not select or guarantee a node.
                  enforce:
                    type: boolean
                    default: true
                    description: Keep these constraints in every descendant pod. False allows a more specific workload
                      or graph placement to replace these defaults; an enforced ancestor cannot be relaxed.
                description: Placement defaults or enforced constraints copied to descendant pod templates. Tolerations
                  permit matching taints; selectors and required affinity restrict eligible nodes. This does not
                  reserve capacity.
              persistence:
                type: object
                description: Optional persistent storage contract. Storage does not checkpoint or resume application
                  execution; use non-spot capacity.
                properties:
                  enabled:
                    type: boolean
                    default: false
                    description: Require an explicitly selected existing persistent volume claim.
                  storageClass:
                    type: string
                    minLength: 1
                    description: Required StorageClass name when enabled; must match the PVC storageClassName. The
                      operator does not create StorageClasses.
                  claimName:
                    type: string
                    minLength: 1
                    description: Existing PVC in the workload namespace. External claims survive graph suspension,
                      replacement and deletion.
                  mountPath:
                    type: string
                    pattern: ^/[^/].*
                    default: /var/lib/polyad
                    description: Absolute non-root path mounted in application and init containers.
                x-kubernetes-validations:
                - rule: '!self.enabled || (has(self.storageClass) && has(self.claimName))'
                  message: enabled persistence requires storageClass and claimName
            required:
            - template
            x-kubernetes-validations:
            - rule: "!has(self.controller) || self.controller != 'StatefulSet' || has(self.statefulSet)"
              message: controller StatefulSet requires statefulSet options and serviceName.
            - rule: "!has(self.statefulSet) || (has(self.controller) && self.controller == 'StatefulSet')"
              message: statefulSet options require controller StatefulSet.
            description: Desired configuration for this Daemon resource. Define a reusable persistent capability,
              instantiated by a graph as a Deployment or StatefulSet. Containers must provide startup, readiness and liveness probes.
              Daemons become ready and stop explicitly; they do not complete.
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            description: Reserved operator observation subresource. This reusable definition does not execute independently
              or currently publish lifecycle status.
        required:
        - spec
        description: Define a reusable persistent capability, instantiated by a graph as a Deployment or StatefulSet. Containers
          must provide startup, readiness and liveness probes. Daemons become ready and stop explicitly; they do
          not complete.
