apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: temporaryconnections.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: TemporaryConnection
    plural: temporaryconnections
    singular: temporaryconnection
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Graph
          type: string
          jsonPath: .spec.graph
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Request an immutable, expiring connection within a persisted graph boundary.
              properties:
                requestId:
                  type: string
                  description: Client idempotency key retained with the receipt.
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_.:-]+$
                namespace:
                  type: string
                  description: Namespace of the target graph and receipt.
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                kind:
                  type: string
                  enum:
                  - Graph
                  - PolyGraph
                  - ReplicaGroup
                  description: Target boundary kind.
                graph:
                  type: string
                  description: Persisted instance name, not a reusable template name.
                  minLength: 1
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                graphUid:
                  type: string
                  description: Expected graph incarnation.
                  minLength: 1
                  maxLength: 128
                source:
                  type: string
                  description: Sending logical node or replica ordinal.
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                target:
                  type: string
                  description: Receiving logical node or replica ordinal.
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                ttlSeconds:
                  type: integer
                  description: Lifetime measured from Kubernetes receipt creation.
                  minimum: 1
                  maximum: 86400
                ports:
                  type: array
                  items:
                    type: object
                    description: Select a transport port on the destination workload.
                    properties:
                      port:
                        type: integer
                        description: Destination transport port.
                        minimum: 1
                        maximum: 65535
                      protocol:
                        type: string
                        enum:
                        - TCP
                        - UDP
                        - SCTP
                        description: Transport protocol.
                    required:
                    - port
                  description: Destination grants, empty for topology only.
                  maxItems: 32
                bidirectional:
                  type: boolean
                  description: Whether to add the reverse connection with the same ports.
                requester:
                  type: object
                  required:
                  - username
                  - uid
                  properties:
                    username:
                      type: string
                      maxLength: 320
                      pattern: ^system:serviceaccount:[a-z0-9-]+:[a-z0-9.-]+$
                    uid:
                      type: string
                      minLength: 1
                      maxLength: 128
              required:
              - requestId
              - namespace
              - kind
              - graph
              - graphUid
              - source
              - target
              - ttlSeconds
              - requester
              x-kubernetes-validations:
              - rule: self == oldSelf
                message: Connection intent is immutable; a new requestId creates a new deadline.
              - rule: self.source != self.target
                message: Temporary connections require distinct endpoints.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
