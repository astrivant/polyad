apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rewrites.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: Rewrite
    plural: rewrites
    singular: rewrite
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: 'API group and version of this custom resource: polyad.astrivant.com/v1alpha1.'
          kind:
            type: string
            description: 'Custom resource kind: Rewrite.'
          metadata:
            type: object
            properties: {}
          spec:
            type: object
            properties:
              graph:
                type: string
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                maxLength: 63
                minLength: 1
                description: Name of the target graph in the same namespace.
              kind:
                type: string
                enum:
                - Graph
                - PolyGraph
                - EphemeralGraph
                default: Graph
                description: Kind of the graph targeted by this rewrite.
              expectedGeneration:
                type: integer
                minimum: 1
                description: Required metadata.generation of the target graph before applying the rewrite. A mismatch
                  rejects the change unless this rewrite already has a committed receipt.
              topology:
                type: object
                properties:
                  capacity:
                    type: object
                    description: Forecast missing execution nodes before their admission dependencies finish.
                    properties:
                      backend:
                        type: string
                        enum:
                        - Auto
                        - ProvisioningRequest
                        - Placeholders
                        description: Preferred capacity mechanism.
                      lookaheadStages:
                        type: integer
                        description: Number of uncreated dependency layers to forecast at each boundary.
                        minimum: 1
                        maximum: 32
                      maxPods:
                        type: integer
                        description: Maximum forecast Pods held by this boundary at once.
                        minimum: 1
                        maximum: 1024
                      timeoutSeconds:
                        type: integer
                        description: Maximum time to hold an unconsumed request, including gate waits.
                        minimum: 10
                        maximum: 86400
                      provisioningClassName:
                        type: string
                        description: Autoscaler provisioning class; empty uses the operator default.
                      parameters:
                        type: object
                        additionalProperties:
                          type: string
                          maxLength: 255
                        description: Provider-specific ProvisioningRequest parameters.
                        maxProperties: 100
                      retryToken:
                        type: string
                        description: Change this value to retry a failed or expired plan.
                  network:
                    type: object
                    description: Isolate a graph subtree and intersect its exceptions with inherited constraints.
                    properties:
                      scope:
                        type: string
                        enum:
                        - Boundary
                        - Subtree
                        description: Apply to direct workloads or propagate to all descendant workloads.
                      ingress:
                        type: array
                        items:
                          type: object
                          description: Allow one peer on selected ports, with optional inbound mesh authorization.
                          properties:
                            peer:
                              type: object
                              description: Select peers in an explicit namespace, optionally by graph or pod labels.
                              properties:
                                namespace:
                                  type: string
                                  nullable: true
                                  description: Peer namespace; omitted means this graph's namespace.
                                graph:
                                  type: string
                                  nullable: true
                                  description: Named graph instance; omitted with node selects a node in this boundary.
                                kind:
                                  type: string
                                  enum:
                                  - Graph
                                  - PolyGraph
                                  - EphemeralGraph
                                  - Feedback
                                  - ReplicaGroup
                                  description: Kind of the referenced graph instance.
                                node:
                                  type: string
                                  nullable: true
                                  description: Node and its descendants inside the selected graph.
                                podLabels:
                                  type: object
                                  additionalProperties:
                                    type: string
                                  description: Additional exact pod-label matches, combined with graph selection.
                            ports:
                              type: array
                              items:
                                type: object
                                description: Select a transport port on the destination workload.
                                properties:
                                  port:
                                    type: integer
                                    description: Destination transport port.
                                    minimum: 1
                                    maximum: 65535
                                  protocol:
                                    type: string
                                    enum:
                                    - TCP
                                    - UDP
                                    - SCTP
                                    description: Transport protocol.
                                required:
                                - port
                              description: Destination ports; empty means every transport port.
                            node:
                              type: string
                              nullable: true
                              description: Local node subtree to which this rule applies; omitted selects every local node.
                            principals:
                              type: array
                              items:
                                type: string
                              description: Exact Istio source identities such as cluster.local/ns/team/sa/client.
                            methods:
                              type: array
                              items:
                                type: string
                              description: Allowed inbound HTTP methods; empty leaves methods unconstrained.
                            paths:
                              type: array
                              items:
                                type: string
                              description: Exact inbound HTTP paths; empty leaves paths unconstrained.
                          required:
                          - peer
                        description: Additional allowed inbound traffic.
                      egress:
                        type: array
                        items:
                          type: object
                          description: Allow one peer on selected ports, with optional inbound mesh authorization.
                          properties:
                            peer:
                              type: object
                              description: Select peers in an explicit namespace, optionally by graph or pod labels.
                              properties:
                                namespace:
                                  type: string
                                  nullable: true
                                  description: Peer namespace; omitted means this graph's namespace.
                                graph:
                                  type: string
                                  nullable: true
                                  description: Named graph instance; omitted with node selects a node in this boundary.
                                kind:
                                  type: string
                                  enum:
                                  - Graph
                                  - PolyGraph
                                  - EphemeralGraph
                                  - Feedback
                                  - ReplicaGroup
                                  description: Kind of the referenced graph instance.
                                node:
                                  type: string
                                  nullable: true
                                  description: Node and its descendants inside the selected graph.
                                podLabels:
                                  type: object
                                  additionalProperties:
                                    type: string
                                  description: Additional exact pod-label matches, combined with graph selection.
                            ports:
                              type: array
                              items:
                                type: object
                                description: Select a transport port on the destination workload.
                                properties:
                                  port:
                                    type: integer
                                    description: Destination transport port.
                                    minimum: 1
                                    maximum: 65535
                                  protocol:
                                    type: string
                                    enum:
                                    - TCP
                                    - UDP
                                    - SCTP
                                    description: Transport protocol.
                                required:
                                - port
                              description: Destination ports; empty means every transport port.
                            node:
                              type: string
                              nullable: true
                              description: Local node subtree to which this rule applies; omitted selects every local node.
                            principals:
                              type: array
                              items:
                                type: string
                              description: Exact Istio source identities such as cluster.local/ns/team/sa/client.
                            methods:
                              type: array
                              items:
                                type: string
                              description: Allowed inbound HTTP methods; empty leaves methods unconstrained.
                            paths:
                              type: array
                              items:
                                type: string
                              description: Exact inbound HTTP paths; empty leaves paths unconstrained.
                          required:
                          - peer
                        description: Additional allowed outbound traffic.
                      isolateIngress:
                        type: boolean
                        description: Restrict incoming connections.
                      isolateEgress:
                        type: boolean
                        description: Restrict outgoing connections.
                      allowWithin:
                        type: boolean
                        description: Allow traffic between all workloads inside this boundary.
                      allowDNS:
                        type: boolean
                        description: Allow TCP/UDP 53 to kube-system pods labeled k8s-app=kube-dns.
                      mesh:
                        type: boolean
                        description: Require Istio injection, strict mutual TLS and inbound authorization.
                  rules:
                    type: array
                    description: Additional GraphRule names in this namespace, inherited by descendants. Namespace-wide
                      rules always apply.
                    maxItems: 32
                    x-kubernetes-list-type: set
                    items:
                      type: string
                      description: GraphRule name.
                      maxLength: 253
                      minLength: 1
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Optional request-local node identity retained on generated manifests for
                            auditing.
                          minLength: 1
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                        name:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Unique name of this node within its graph. Used by dependencies, connections
                            and lifecycle signals.
                        kind:
                          type: string
                          enum:
                          - Workload
                          - Daemon
                          - Ephemeral
                          - Resource
                          - Graph
                          - PolyGraph
                          - EphemeralGraph
                          - Feedback
                          - ReplicaGroup
                          description: Kind of the definition referenced by this node; determines whether execution
                            uses a Job, Deployment, resource or nested graph boundary.
                        ref:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Name of the reusable definition in the same namespace. Nested Graph, PolyGraph, EphemeralGraph
                            and Feedback definitions must set templateOnly to true.
                        requires:
                          type: array
                          items:
                            type: object
                            properties:
                              node:
                                type: string
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                maxLength: 63
                                minLength: 1
                                description: Name of the upstream node within this graph.
                              condition:
                                type: string
                                enum:
                                - started
                                - ready
                                - completed
                                default: completed
                                description: 'Observation required before admission: started means the execution
                                  resource exists; ready means it exposes readiness; completed means finite execution
                                  succeeded. Daemons and resources cannot satisfy completed. Readiness loss does
                                  not cancel already-admitted consumers.'
                            required:
                            - node
                            description: One entry in requires.
                          description: Lifecycle prerequisites that must all hold before initial admission. Admission
                            dependencies must be acyclic; use connections for cyclic data flow.
                        gate:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Name of a Gate definition in the same namespace. Admission requires its expression
                            to evaluate to true; false or unknown blocks admission.
                        slots:
                          type: integer
                          minimum: 1
                          default: 1
                          description: Admission slots reserved by this node until finite work completes or execution
                            is removed. Must fit the containing graph; this is not a CPU request.
                      required:
                      - name
                      - kind
                      - ref
                      description: One entry in nodes.
                    x-kubernetes-list-type: map
                    x-kubernetes-list-map-keys:
                    - name
                    description: Graph membership in deterministic admission order. Names are unique within this
                      boundary; definitions are resolved in the same namespace.
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        ports:
                          type: array
                          description: Destination transport grants; omitted connections remain data-flow declarations.
                          items:
                            type: object
                            description: Select a transport port on the destination workload.
                            properties:
                              port:
                                type: integer
                                description: Destination transport port.
                                minimum: 1
                                maximum: 65535
                              protocol:
                                type: string
                                enum:
                                - TCP
                                - UDP
                                - SCTP
                                description: Transport protocol.
                            required:
                            - port
                        source:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Name of the source node for this data-flow connection.
                        target:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Name of the destination node for this data-flow connection.
                      required:
                      - source
                      - target
                      description: One entry in connections.
                    description: Declarative data-flow edges, including cycles and self-loops. These edges neither
                      block admission nor configure network transport.
                  mode:
                    type: string
                    enum:
                    - finite
                    - persistent
                    default: finite
                    description: Finite graphs report completion when finite work completes and resource nodes are
                      ready. Persistent graphs remain active until stopped or deleted. Graphs containing daemons
                      must be persistent.
                  slots:
                    type: integer
                    minimum: 1
                    default: 64
                    description: Total admission-slot capacity for this boundary. Node reservations govern admission;
                      Kubernetes independently schedules actual CPU, memory and device requests.
                  shutdownPolicy:
                    type: string
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    maxLength: 63
                    minLength: 1
                    description: Name of a ShutdownPolicy in the same namespace, specifying a runtime limit and
                      termination grace period.
                  suspend:
                    type: boolean
                    default: false
                    description: Stop admitting work and drain owned execution while true. Clearing suspension permits
                      fresh execution; this is not an application checkpoint request.
                  templateOnly:
                    type: boolean
                    default: false
                    description: Keep this boundary as an inert reusable definition. A parent graph creates an owned
                      executable copy with this flag cleared.
                  placement:
                    type: object
                    properties:
                      nodeSelector:
                        type: object
                        additionalProperties:
                          type: string
                          description: Value for an individual key in nodeSelector.
                        description: Exact Kubernetes node-label matches, all of which must hold. Use labels for
                          node groups or resource slices; cloud tags must first be exposed as node labels. Conflicting
                          inherited values are rejected.
                      nodeAffinity:
                        type: object
                        properties:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            type: object
                            properties:
                              nodeSelectorTerms:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    matchExpressions:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          key:
                                            type: string
                                            description: Node label or node field tested by this requirement.
                                          operator:
                                            type: string
                                            enum:
                                            - In
                                            - NotIn
                                            - Exists
                                            - DoesNotExist
                                            - Gt
                                            - Lt
                                            description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                              Gt or Lt.'
                                          values:
                                            type: array
                                            items:
                                              type: string
                                              description: One entry in values.
                                            description: Comparison values for this requirement. In and NotIn use
                                              a nonempty set; Exists and DoesNotExist use no values; Gt and Lt use
                                              one integer encoded as a string.
                                        required:
                                        - key
                                        - operator
                                        description: One entry in matchExpressions.
                                      description: Node-label requirements combined with AND within this term.
                                    matchFields:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          key:
                                            type: string
                                            description: Node label or node field tested by this requirement.
                                          operator:
                                            type: string
                                            enum:
                                            - In
                                            - NotIn
                                            - Exists
                                            - DoesNotExist
                                            - Gt
                                            - Lt
                                            description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                              Gt or Lt.'
                                          values:
                                            type: array
                                            items:
                                              type: string
                                              description: One entry in values.
                                            description: Comparison values for this requirement. In and NotIn use
                                              a nonempty set; Exists and DoesNotExist use no values; Gt and Lt use
                                              one integer encoded as a string.
                                        required:
                                        - key
                                        - operator
                                        description: One entry in matchFields.
                                      description: Node-field requirements combined with AND within this term.
                                  description: One entry in nodeSelectorTerms.
                                description: Alternative node-selection terms combined with OR. Expressions within
                                  one term are combined with AND. An empty term selects no nodes.
                            required:
                            - nodeSelectorTerms
                            description: Hard node eligibility rules evaluated when scheduling. Changes to node
                              labels after scheduling do not by themselves evict a running pod.
                          preferredDuringSchedulingIgnoredDuringExecution:
                            type: array
                            items:
                              type: object
                              properties:
                                weight:
                                  type: integer
                                  minimum: 1
                                  maximum: 100
                                  description: Preference weight from 1 to 100. Matching preferred rules contribute
                                    to the node scheduling score.
                                preference:
                                  type: object
                                  properties:
                                    matchExpressions:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          key:
                                            type: string
                                            description: Node label or node field tested by this requirement.
                                          operator:
                                            type: string
                                            enum:
                                            - In
                                            - NotIn
                                            - Exists
                                            - DoesNotExist
                                            - Gt
                                            - Lt
                                            description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                              Gt or Lt.'
                                          values:
                                            type: array
                                            items:
                                              type: string
                                              description: One entry in values.
                                            description: Comparison values for this requirement. In and NotIn use
                                              a nonempty set; Exists and DoesNotExist use no values; Gt and Lt use
                                              one integer encoded as a string.
                                        required:
                                        - key
                                        - operator
                                        description: One entry in matchExpressions.
                                      description: Node-label requirements combined with AND within this term.
                                    matchFields:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          key:
                                            type: string
                                            description: Node label or node field tested by this requirement.
                                          operator:
                                            type: string
                                            enum:
                                            - In
                                            - NotIn
                                            - Exists
                                            - DoesNotExist
                                            - Gt
                                            - Lt
                                            description: 'Selector comparison operator: In, NotIn, Exists, DoesNotExist,
                                              Gt or Lt.'
                                          values:
                                            type: array
                                            items:
                                              type: string
                                              description: One entry in values.
                                            description: Comparison values for this requirement. In and NotIn use
                                              a nonempty set; Exists and DoesNotExist use no values; Gt and Lt use
                                              one integer encoded as a string.
                                        required:
                                        - key
                                        - operator
                                        description: One entry in matchFields.
                                      description: Node-field requirements combined with AND within this term.
                                  description: Node-selection term whose match contributes the associated weight.
                              required:
                              - weight
                              - preference
                              description: One entry in preferredDuringSchedulingIgnoredDuringExecution.
                            description: Weighted node preferences applied after hard eligibility checks. Unmatched
                              preferences do not prevent scheduling.
                        description: Required and preferred Kubernetes node-selection rules. Required rules intersect
                          across graph, definition and pod scopes; preferences are combined.
                      tolerations:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Taint key to match. An empty key requires operator Exists and matches
                                all keys.
                            operator:
                              type: string
                              enum:
                              - Exists
                              - Equal
                              description: 'Taint comparison: Equal matches key and value; Exists matches the key
                                regardless of value. Kubernetes defaults an omitted operator to Equal.'
                            value:
                              type: string
                              description: Taint value to match when operator is Equal. Omit or leave empty when
                                operator is Exists.
                            effect:
                              type: string
                              enum:
                              - ''
                              - NoSchedule
                              - PreferNoSchedule
                              - NoExecute
                              description: 'Taint effect to match. An empty effect matches all effects: NoSchedule,
                                PreferNoSchedule and NoExecute.'
                            tolerationSeconds:
                              type: integer
                              format: int64
                              minimum: 0
                              description: Seconds a pod may remain bound after a matching NoExecute taint. Omission
                                tolerates that taint indefinitely; zero requests immediate eviction.
                          description: One entry in tolerations.
                        description: Kubernetes taints tolerated by descendant pods, deduplicated across scopes.
                          Tolerations allow placement on tainted nodes; they do not select or guarantee a node.
                      enforce:
                        type: boolean
                        default: true
                        description: Keep these constraints in every descendant pod. False allows a more specific
                          workload or graph placement to replace these defaults; an enforced ancestor cannot be
                          relaxed.
                    description: Placement defaults or enforced constraints copied to descendant pod templates.
                      Tolerations permit matching taints; selectors and required affinity restrict eligible nodes.
                      This does not reserve capacity.
                required:
                - nodes
                description: Complete replacement graph spec, including nodes, placement and lifecycle settings.
                  Omitted optional fields are removed rather than merged with the previous spec.
            required:
            - graph
            - expectedGeneration
            - topology
            description: Desired configuration for this Rewrite resource. Apply a one-shot replacement of a graph
              specification at an expected generation. The operator records a receipt with the spec change so retries
              do not apply the same rewrite twice.
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            description: Operator receipt and validation state, including applied and observedGeneration. A committed
              rewrite is not reapplied.
        required:
        - spec
        description: Apply a one-shot replacement of a graph specification at an expected generation. The operator
          records a receipt with the spec change so retries do not apply the same rewrite twice.
