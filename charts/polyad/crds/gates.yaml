apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gates.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: Gate
    plural: gates
    singular: gate
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: 'API group and version of this custom resource: polyad.astrivant.com/v1alpha1.'
          kind:
            type: string
            description: 'Custom resource kind: Gate.'
          metadata:
            type: object
            properties: {}
          spec:
            type: object
            properties:
              expression:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                required:
                - operator
                description: Serialized Gate expression with operator, optional operands and signal name. Operators
                  are signal, and, or, not, xor and nxor. Signals use NODE.started, NODE.ready, NODE.completed or
                  NODE.failed; absent observations remain unknown.
              delaySeconds:
                type: number
                minimum: 0
                maximum: 315360000
                description: Standalone admission delay after dependencies are observed. Each graph instance persists
                  its own deadline in status; waits do not occupy workers or slots.
            description: Reusable Boolean expression or delay gate controlling admission to the next vertex.
            x-kubernetes-validations:
            - rule: has(self.expression) != has(self.delaySeconds)
              message: Gate requires exactly one of expression or delaySeconds
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            description: Reserved operator observation subresource. This reusable definition does not execute independently
              or currently publish lifecycle status.
        required:
        - spec
        description: Define a Boolean or delay gate. Instances keep delay observations on their containing graph.
