# yaml-language-server: $schema=values.reference.schema.json
# Alternative metrics-only collector. Do not install two collectors for the same release targets.
## @param telemetry [object] Optional namespace-scoped metrics, log and trace collectors with explicit backend destinations.
telemetry:
  ## @param telemetry.enabled [boolean] Install a release-scoped collector; backends are supplied separately.
  enabled: true
  ## @param telemetry.mode [string] Alloy collects metrics, container logs and traces; PrometheusAgent collects metrics only.
  mode: PrometheusAgent
  ## @param telemetry.replicas [integer] Alloy distributes scrape and log targets across these replicas; PrometheusAgent requires one.
  replicas: 1
  ## @param telemetry.remoteWrite [object] Prometheus-compatible metric destination and authentication.
  remoteWrite:
    ## @param telemetry.remoteWrite.url [string] Prometheus-compatible remote-write URL, including its write path.
    url: http://benchmarks-monitoring-prometheus.monitoring.svc:9090/api/v1/write
  ## @param telemetry.logs [object] Optional Alloy container-log collection and Loki destination.
  logs:
    ## @param telemetry.logs.enabled [boolean] Alloy tails selected containers through the Kubernetes API without host mounts.
    enabled: false
  ## @param telemetry.traces [object] Optional Alloy trace receiver and OTLP/HTTP destination.
  traces:
    ## @param telemetry.traces.enabled [boolean] Alloy accepts OTLP/gRPC and OTLP/HTTP traces on Pod IPs and forwards them over OTLP/HTTP.
    enabled: false
    ## @param telemetry.traces.routeOperator [boolean] Route Helm-installed operator and observer traces through local Alloy; tracing.enabled must also be true. Use false for root-provisioned cross-cluster workers requiring a shared endpoint.
    routeOperator: false
## @param kedaOperator [object] Upstream KEDA overrides for the optional dependency. Rendered names are used for root observations.
kedaOperator:
  ## @param kedaOperator.prometheus [object] Settings for kedaOperator.prometheus.
  prometheus:
    ## @param kedaOperator.prometheus.operator [object] Settings for kedaOperator.prometheus.operator.
    operator:
      ## @param kedaOperator.prometheus.operator.enabled [boolean] Expose this bundled KEDA component metrics for collection.
      enabled: true
    ## @param kedaOperator.prometheus.metricServer [object] Settings for kedaOperator.prometheus.metricServer.
    metricServer:
      ## @param kedaOperator.prometheus.metricServer.enabled [boolean] Expose this bundled KEDA component metrics for collection.
      enabled: true
    ## @param kedaOperator.prometheus.webhooks [object] Settings for kedaOperator.prometheus.webhooks.
    webhooks:
      ## @param kedaOperator.prometheus.webhooks.enabled [boolean] Expose this bundled KEDA component metrics for collection.
      enabled: true
