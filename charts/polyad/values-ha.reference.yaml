# yaml-language-server: $schema=values.reference.schema.json
# Replicated dense operators in one Helm release cluster and namespace.
# Usage: helm upgrade --install polyad charts/polyad -n polyad --create-namespace \
#          -f charts/polyad/values-ha.reference.yaml
# Guide: ../../docs/deployment/deployment-profiles.md#ha-in-one-cluster
# These are reference overrides; values.yaml contains all defaults.
## @param ha [boolean] Run at least two operator replicas and permit split components or remote workers; false runs one dense operator
ha: true

## @param operator [object] Settings for operator; configure the fields below.
operator:
  ## @param operator.logLevel [string] INFO keeps normal operational logs; DEBUG traces Polyad reconciliation and API timings, including observers. Choices: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  logLevel: INFO
  ## @param operator.replicaCount [integer, nullable] Operator replicas; null selects 1 for singular or 2 for ha At least two; replicas share queues and mutation leases. Minimum: 1. Maximum: 32.
  replicaCount: 2 # At least two; replicas share queues and mutation leases.
  ## @param operator.nodeSelector [object] Node labels selecting the operator node group, independent of workload graph placement
  nodeSelector: {}
  ## @param operator.tolerations [array] Taints tolerated by the operator replicas
  tolerations: []
  ## @param operator.autoscaling [object] Settings for operator.autoscaling; configure the fields below.
  autoscaling:
    ## @param operator.autoscaling.enabled [boolean] Enable operator HPA using CPU and optional memory utilization CPU/memory HPA; requires a working resource metrics API.
    enabled: false # CPU/memory HPA; requires a working resource metrics API.
    ## @param operator.autoscaling.minReplicas [integer] Minimum operator replicas HA may not scale below two operator replicas. Minimum: 1. Maximum: 32.
    minReplicas: 2 # HA may not scale below two operator replicas.
    ## @param operator.autoscaling.maxReplicas [integer] Maximum operator replicas, at least minReplicas and at most 32 Minimum: 1. Maximum: 32.
    maxReplicas: 8
    ## @param operator.autoscaling.targetCPUUtilizationPercentage [integer] Target operator CPU utilization relative to requested CPU Minimum: 1. Maximum: 100.
    targetCPUUtilizationPercentage: 70
    ## @param operator.autoscaling.targetMemoryUtilizationPercentage [integer, nullable] Optional target memory utilization relative to requested memory (1-100); null disables the memory metric Percent of requested memory; null disables. Minimum: 1. Maximum: 100.
    targetMemoryUtilizationPercentage: 80 # Percent of requested memory; null disables.
  ## @param operator.resources [object] Settings for operator.resources; configure the fields below.
  resources:
    ## @param operator.resources.requests [object] Settings for operator.resources.requests; configure the fields below.
    requests:
      ## @param operator.resources.requests.cpu [string] Requested operator CPU, required for CPU autoscaling CPU requests are needed when enabling the CPU HPA.
      cpu: 100m # CPU requests are needed when enabling the CPU HPA.
      ## @param operator.resources.requests.memory [string] Requested operator memory, required when the HPA memory metric is enabled Required for the memory metric; its target is not based on limits.
      memory: 128Mi # Required for the memory metric; its target is not based on limits.
    ## @param operator.resources.limits [object] Settings for operator.resources.limits; configure the fields below.
    limits:
      ## @param operator.resources.limits.memory [string] Operator memory limit
      memory: 512Mi

## @param architecture [object] Settings for architecture; configure the fields below.
architecture:
  ## @param architecture.mode [string] Dense combines responsibilities; Distributed manages gateway, executor and telemetry ReplicaGroups inside a Graph; requires ha Add values-components.reference.yaml last for split components. Choices: Dense, Distributed.
  mode: Dense # Add values-components.reference.yaml last for split components.
  ## @param architecture.autoscaling [boolean] Enable KEDA scaling of all component ReplicaGroup definitions
  autoscaling: false

# Cache HA is a separate opt-in. Unlike chart defaults, this reference enables
# KEDA-managed primary plus replicas; install KEDA and provide eligible nodes
# and storage for up to maxReplicas instances. Metrics are enabled automatically.
## @param dragonfly [object] Settings for dragonfly; configure the fields below.
dragonfly:
  ## @param dragonfly.enabled [boolean] Deploy Dragonfly through the upstream operator Helm dependency
  enabled: true
  ## @param dragonfly.ha [object] Settings for dragonfly.ha; configure the fields below.
  ha:
    ## @param dragonfly.ha.enabled [boolean] Enable primary/replica replication and automatic failover
    enabled: true
    ## @param dragonfly.ha.replicas [integer] Initial Dragonfly instances in HA mode, including the primary; fixed when autoscaling is disabled Minimum: 2. Maximum: 9.
    replicas: 2
    ## @param dragonfly.ha.topologyKey [string] Place HA instances on distinct values of this node label
    topologyKey: kubernetes.io/hostname
  ## @param dragonfly.autoscaling [object] Settings for dragonfly.autoscaling; configure the fields below.
  autoscaling:
    ## @param dragonfly.autoscaling.enabled [boolean] Use KEDA for bundled HA Dragonfly and enable Polyad metrics; inactive outside bundled HA Set false for the fixed ha.replicas count without KEDA.
    enabled: true # Set false for the fixed ha.replicas count without KEDA.
    ## @param dragonfly.autoscaling.minReplicas [integer] Minimum total cache instances, including the primary; never below two Minimum: 2. Maximum: 9.
    minReplicas: 2
    ## @param dragonfly.autoscaling.maxReplicas [integer] Maximum total cache instances; requires sufficient eligible nodes and storage Minimum: 2. Maximum: 9.
    maxReplicas: 5
    ## @param dragonfly.autoscaling.connectionsPerReplica [integer] Primary connected clients per desired cache instance; scales failover copies, not write capacity Failover copies; does not increase primary capacity. Minimum: 1.
    connectionsPerReplica: 50 # Failover copies; does not increase primary capacity.
  ## @param dragonfly.persistence [object] Settings for dragonfly.persistence; configure the fields below.
  persistence:
    ## @param dragonfly.persistence.enabled [boolean] Persist bundled Dragonfly snapshots on a PVC
    enabled: true
    ## @param dragonfly.persistence.size [string] Snapshot volume capacity
    size: 1Gi
    ## @param dragonfly.persistence.storageClass [string] Snapshot volume storage class; empty uses the cluster default
    storageClass: ''
