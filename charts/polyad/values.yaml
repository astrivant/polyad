## @section Named operator API credentials
## @param authentication [object] Settings for authentication.
authentication:
  ## @param authentication.mode [string] String. Required enforces endpoint credentials; Disabled opts into an unauthenticated demo without HTTP request quotas
  mode: Required
  ## @param authentication.backend [string] String. Builtin uses Polyad's Flask hooks; FlaskHTTPAuth loads the adapter included in official operator images
  backend: Builtin
  ## @param authentication.storage [object] Settings for authentication.storage.
  storage:
    ## @param authentication.storage.enabled [boolean] Boolean. Persist one-way key verifiers and policy records in PostgreSQL and enforce database revocation; raw tokens stay in Kubernetes Secrets
    enabled: false
    ## @param authentication.storage.separateDatabase [boolean] Boolean. Use an isolated authentication database; false reuses the state database and its role, requiring postgresql.enabled
    separateDatabase: true
    ## @param authentication.storage.managed [boolean] Boolean. Provision a separate CloudNativePG Cluster; false uses the DSN from existingSecret
    managed: true
    ## @param authentication.storage.existingSecret [string] String. Externally managed authentication database connection Secret; used with separateDatabase=true and managed=false
    existingSecret: ''
    ## @param authentication.storage.secretKey [string] String. DSN key in the external authentication database Secret
    secretKey: uri
    ## @param authentication.storage.database [string] String. Database name for a new managed authentication cluster
    database: polyad-authentication
    ## @param authentication.storage.username [string] String. Sole application login owning the managed authentication database; PostgreSQL administrators retain administrative access
    username: polyad_authentication
    ## @param authentication.storage.size [string] String. Persistent storage per managed authentication database instance
    size: 1Gi
    ## @param authentication.storage.storageClass [string] Authentication database storage class; empty uses the cluster default unless postgresql.encryptionAtRest selects a class; conflicting explicit classes are rejected
    storageClass: ''
  ## @param authentication.services [array] Service API keys with direction, Secret reference, endpoint scopes, outbound baseUrl and individual rate/concurrency limits
  services: []
  ## @param authentication.operators [array] Peer operator API keys; Inbound, Outbound or Bidirectional, with HA-wide per-key lanes
  operators: []

