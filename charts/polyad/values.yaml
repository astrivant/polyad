# yaml-language-server: $schema=values.schema.json
## @section Polyad resource templates
## @param polyadResources [object] Named resource maps from the polyad-crds dependency; see its values and examples for cross-resource tpl expressions and schema defaults
polyadResources:
  ## @param polyadResources.enabled [boolean] Include the independently versioned CRD and resource chart; false requires administrators to install definitions separately
  enabled: true

## @section Deployment profiles
## @param ha [boolean] Boolean. Run at least two operator replicas and permit split components or remote workers; false runs one dense operator
ha: false

## @section Helm-installed downstream operator workers
## @param worker [object] Settings for worker.
worker:
  ## @param worker.enabled [boolean] Install an execution replica connected to an existing root; disables root election and requires external root/cache credentials
  enabled: false
  ## @param worker.rootNamespace [string] Namespace of the root's queues, leases and OperatorPool; independent of this Helm release namespace
  rootNamespace: ''
  ## @param worker.rootClusterName [string] Root federation identity; global.multiCluster.clusterName identifies this worker's hosting cluster instead
  rootClusterName: ''
  ## @param worker.rootDeployment [string] Name of the existing root Deployment, used to identify the attachment authority
  rootDeployment: ''
  ## @param worker.rootGraph [string] Name of the root's reserved PolyGraph; normally ROOT_RELEASE-atlas
  rootGraph: ''
  ## @param worker.poolName [string] Name of the root-namespace OperatorPool that may attach this Deployment
  poolName: ''
  ## @param worker.scalingAuthority [string] Root lets the matching OperatorPool/KEDA control replicas; Local keeps replicas and optional HPA under this Helm release
  scalingAuthority: Root

## @section OpenTelemetry traces and logs
## @param tracing [object] Opt-in OTLP/HTTP traces and independently enabled logs for operators and observers.
tracing:
  ## @param tracing.enabled [boolean] Export operator and observer traces over OTLP/HTTP; disabled creates no exporter
  enabled: false
  ## @param tracing.endpoint [string] Full HTTP/protobuf trace URL, including /v1/traces; use a Collector reachable from every execution cluster
  endpoint: http://otel-collector:4318/v1/traces
  ## @param tracing.serviceName [string] Service identity in the trace backend; resource attributes can identify cluster and environment
  serviceName: polyad-operator
  ## @param tracing.samplingRatio [number] Fraction of new root traces to sample (number, 0-1); child spans honor their parent's sampling decision
  samplingRatio: 1
  ## @param tracing.timeoutSeconds [integer] Export request timeout in seconds; exports are batched off the reconciliation path
  timeoutSeconds: 10
  ## @param tracing.resourceAttributes [string] Comma-separated OpenTelemetry resource attributes, for example deployment.environment.name=production
  resourceAttributes: ''
  ## @param tracing.headersSecret [string] Existing Secret with a headers key containing OTLP exporter headers; empty for collectors without authentication
  headersSecret: ''
  ## @param tracing.logs [object] Settings for tracing.logs.
  logs:
    ## @param tracing.logs.enabled [boolean] Export structured operator logs independently of trace enablement and sampling; console logging remains available
    enabled: false
    ## @param tracing.logs.endpoint [string] Full HTTP/protobuf log URL, including /v1/logs; shares service identity, timeout, resource attributes and headersSecret with traces
    endpoint: http://otel-collector:4318/v1/logs

## @section Operator and shared queue parameters
## @param operator [object] Settings for operator.
operator:
  ## @param operator.serviceAccess [object] Inherited service discovery and negotiation ceilings; graph grants and consent remain mandatory
  serviceAccess:
    ## @param operator.serviceAccess.discovery [string] Disabled, SameGraph, GraphTree, Cluster or Atlas; GraphTree confines discovery to related graphs in the home cluster
    discovery: GraphTree
    ## @param operator.serviceAccess.connections [string] SameGraph by default; Atlas permits cross-cluster negotiation only when the receiving operator owns the common application boundary
    connections: SameGraph
    ## @param operator.serviceAccess.clusters [object] Child cluster modes and parent links; each child can narrow but cannot widen its parent ceiling
    clusters: {}
    ## @param operator.serviceAccess.trustDomains [object] Explicit Istio trust domain for each participating cluster; required for cross-cluster connections
    trustDomains: {}
  ## @param operator.logLevel [string] Operator and observer Python logging verbosity; INFO for normal operation, DEBUG for reconciliation diagnostics (DEBUG, INFO, WARNING, ERROR or CRITICAL)
  logLevel: INFO
  ## @param operator.replicaCount [integer, nullable] Operator replicas; null selects 1 for singular or 2 for ha, and must remain null for Root-scaled workers
  replicaCount: null
  ## @param operator.nodeSelector [object] Node labels selecting the operator node group, independent of workload graph placement
  nodeSelector: {}
  ## @param operator.tolerations [array] Taints tolerated by the operator replicas
  tolerations: []
  ## @param operator.autoscaling [object] Settings for operator.autoscaling.
  autoscaling:
    ## @param operator.autoscaling.enabled [boolean] Enable operator HPA using CPU and optional memory utilization
    enabled: false
    ## @param operator.autoscaling.minReplicas [integer] Minimum operator replicas
    minReplicas: 2
    ## @param operator.autoscaling.maxReplicas [integer] Maximum operator replicas, at least minReplicas and at most 32
    maxReplicas: 8
    ## @param operator.autoscaling.targetCPUUtilizationPercentage [integer] Target operator CPU utilization relative to requested CPU
    targetCPUUtilizationPercentage: 70
    ## @param operator.autoscaling.targetMemoryUtilizationPercentage [integer, nullable] Optional target memory utilization relative to requested memory (1-100); null disables the memory metric
    targetMemoryUtilizationPercentage: null
    ## @param operator.autoscaling.behavior [object] Settings for operator.autoscaling.behavior.
    behavior:
      ## @param operator.autoscaling.behavior.scaleUp [object] Settings for operator.autoscaling.behavior.scaleUp.
      scaleUp:
        ## @param operator.autoscaling.behavior.scaleUp.stabilizationWindowSeconds [integer] Scale-up recommendation window in seconds (0-3600)
        stabilizationWindowSeconds: 0
        ## @param operator.autoscaling.behavior.scaleUp.selectPolicy [string] Choose the largest or smallest permitted change, or disable scale-up (Max, Min, Disabled)
        selectPolicy: Max
        ## @param operator.autoscaling.behavior.scaleUp.policies [array] Rate limits (Pods or Percent); defaults to 100 percent or 4 Pods per 15 seconds; periodSeconds accepts 1-1800
        policies:
          -
            ## @param operator.autoscaling.behavior.scaleUp.policies[].type [string] Settings for operator.autoscaling.behavior.scaleUp.policies[].type.
            type: Percent
            ## @param operator.autoscaling.behavior.scaleUp.policies[].value [integer] Settings for operator.autoscaling.behavior.scaleUp.policies[].value.
            value: 100
            ## @param operator.autoscaling.behavior.scaleUp.policies[].periodSeconds [integer] Settings for operator.autoscaling.behavior.scaleUp.policies[].periodSeconds.
            periodSeconds: 15
          -
            ## @param operator.autoscaling.behavior.scaleUp.policies[].type [string] Settings for operator.autoscaling.behavior.scaleUp.policies[].type.
            type: Pods
            ## @param operator.autoscaling.behavior.scaleUp.policies[].value [integer] Settings for operator.autoscaling.behavior.scaleUp.policies[].value.
            value: 4
            ## @param operator.autoscaling.behavior.scaleUp.policies[].periodSeconds [integer] Settings for operator.autoscaling.behavior.scaleUp.policies[].periodSeconds.
            periodSeconds: 15
      ## @param operator.autoscaling.behavior.scaleDown [object] Settings for operator.autoscaling.behavior.scaleDown.
      scaleDown:
        ## @param operator.autoscaling.behavior.scaleDown.stabilizationWindowSeconds [integer] Scale-down recommendation window in seconds (0-3600)
        stabilizationWindowSeconds: 300
        ## @param operator.autoscaling.behavior.scaleDown.selectPolicy [string] Choose the largest or smallest permitted change, or disable scale-down (Max, Min, Disabled)
        selectPolicy: Max
        ## @param operator.autoscaling.behavior.scaleDown.policies [array] Rate limits (Pods or Percent); defaults to 100 percent per 15 seconds; periodSeconds accepts 1-1800
        policies:
          -
            ## @param operator.autoscaling.behavior.scaleDown.policies[].type [string] Settings for operator.autoscaling.behavior.scaleDown.policies[].type.
            type: Percent
            ## @param operator.autoscaling.behavior.scaleDown.policies[].value [integer] Settings for operator.autoscaling.behavior.scaleDown.policies[].value.
            value: 100
            ## @param operator.autoscaling.behavior.scaleDown.policies[].periodSeconds [integer] Settings for operator.autoscaling.behavior.scaleDown.policies[].periodSeconds.
            periodSeconds: 15
  # With further research in cheeger configuration, we can more efficiently scale this approach instead of leaning on composition for larger graphs.
  ## @param operator.cheeger [object] Deployment-wide ceilings for each Cheeger calculation. Policies inherit these or choose smaller budgets; prioritized search never weakens hard bounds.
  cheeger:
    ## @param operator.cheeger.maxVertices [integer] Maximum vertices per Cheeger calculation (2-4096); 20 is the default, and raising it also requires enough cut/time budget
    maxVertices: 20
    ## @param operator.cheeger.maxCuts [integer] Maximum distinct cuts per calculation (1-2147483647); 524287 covers 20 vertices, and incomplete searches block constrained actions
    maxCuts: 524287
    ## @param operator.cheeger.timeoutSeconds [number] Cooperative time ceiling per calculation (0.001-300 seconds); checked between cut batches, never converts partial results into exact constants
    timeoutSeconds: 5
  ## @param operator.writeQueue [object] Bound concrete Kubernetes writes separately from coalesced reconciliation hints.
  writeQueue:
    ## @param operator.writeQueue.reconciliationCooldownSeconds [number] Shared per-resource cooldown window before new reconciliation decisions (0-300 seconds); zero disables pacing, expiry and connection consent remain live
    reconciliationCooldownSeconds: 0
    ## @param operator.writeQueue.reconciliationBurst [integer] New decisions per resource in one cooldown window (1-128); coalesced desired-state deliveries retry after deferral
    reconciliationBurst: 1
    ## @param operator.writeQueue.plannerParallelism [integer] Maximum mutation callbacks per approved planner batch (integer 1-32); 1 keeps batches serial, higher values require independent effects and sufficient writer/admission capacity; callers can lower this ceiling only
    plannerParallelism: 1
    ## @param operator.writeQueue.maxInFlight [integer] Maximum concurrent writer slots per adapter (integer 1-32); 1 serializes transport, larger values allow only planner-approved independent writes to overlap; shared dependencies remain ordered
    maxInFlight: 1
    ## @param operator.writeQueue.maxPending [integer] Extra admitted writes beyond writer slots (integer 0-128); 1 keeps decisions fresh, larger bursts add reads and may return more drift conflicts; overflow retries from fresh state
    maxPending: 1
    ## @param operator.writeQueue.validationIntervalSeconds [number] Maximum pause between validator passes (0.01-60 seconds, no greater than validationWindowSeconds); watch notifications wake it sooner
    validationIntervalSeconds: 1
    ## @param operator.writeQueue.validationWindowSeconds [number] Maximum age of a reusable dependency validation from its start (0.01-60 seconds); shorter windows add reads, longer windows tolerate more unobserved external drift
    validationWindowSeconds: 5
    ## @param operator.writeQueue.validationBurst [integer] Maximum pending candidates examined per validator pass (integer 1-128); later items use spare time before the oldest receipts expire
    validationBurst: 8
    ## @param operator.writeQueue.validationWorkers [integer] Maximum concurrent candidate validations per adapter (integer 1-32), shared by background and dispatch checks; raise only with Kubernetes read capacity available
    validationWorkers: 1
    ## @param operator.writeQueue.reconciliationWorkers [integer] Maximum concurrent local reconciliation attempts and remote deliveries per cluster (integer 1-32); same-key follow-ups and graph-family leases remain serialized, separate families can prepare decisions together
    reconciliationWorkers: 1
  ## @param operator.tuning [object] Settings for operator.tuning.
  tuning:
    ## @param operator.tuning.rescanIntervalSeconds [number] Pause after local and root-managed remote inventory scans (1-15s); watch polyad_inventory_sample_age_seconds and polyad_cluster_inventory_sample_fresh; lower values add Kubernetes and optional state writes
    rescanIntervalSeconds: 5
    ## @param operator.tuning.consumeIntervalSeconds [number] Pause after local and remote queue consumption passes (0.1-5s); watch polyad_inbound_updates and polyad_kubernetes_writes_queued before increasing dispatch pressure
    consumeIntervalSeconds: 1
    ## @param operator.tuning.metricsIntervalSeconds [number] Pause after cached metrics publication and component/worker reporting (1-5s); also controls enabled PostgreSQL and Dragonfly connection sampling, not Prometheus scrape frequency or trace export
    metricsIntervalSeconds: 5
    ## @param operator.tuning.backlogIntervalSeconds [number] Pause after local shared-queue samples (1-5s); watch polyad_inbound_sample_age_seconds; root-managed remote backlog is sampled by rescanIntervalSeconds
    backlogIntervalSeconds: 5
  ## @param operator.image [object] Settings for operator.image.
  image:
    ## @param operator.image.repository [string] Operator image repository
    repository: ghcr.io/astrivant/polyad
    ## @param operator.image.tag [string] Operator image tag
    tag: '0.0.1-alpha3'
    ## @param operator.image.pullPolicy [string] Operator image pull policy
    pullPolicy: IfNotPresent
  ## @param operator.resources [object] Settings for operator.resources.
  resources:
    ## @param operator.resources.requests [object] Settings for operator.resources.requests.
    requests:
      ## @param operator.resources.requests.cpu [string] Requested operator CPU, required for CPU autoscaling
      cpu: 100m
      ## @param operator.resources.requests.memory [string] Requested operator memory, required when the HPA memory metric is enabled
      memory: 128Mi
    ## @param operator.resources.limits [object] Settings for operator.resources.limits.
    limits:
      ## @param operator.resources.limits.memory [string] Operator memory limit
      memory: 512Mi
  ## @param operator.terminationGracePeriodSeconds [integer] Time allowed for operator shutdown and outstanding API calls
  terminationGracePeriodSeconds: 60

## @section Optional PostgreSQL state storage
## @param postgresql [object] Settings for postgresql.
postgresql:
  ## @param postgresql.enabled [boolean] Persist graph state and tracked parameters in PostgreSQL
  enabled: false
  ## @param postgresql.managed [boolean] Create a CloudNativePG Cluster; install its operator first
  managed: true
  ## @param postgresql.existingSecret [string] External database Secret containing the connection DSN when managed is false
  existingSecret: ''
  ## @param postgresql.secretKey [string] DSN key in the external database Secret
  secretKey: uri
  ## @param postgresql.database [string] String. Application database for graph state and optional event history; set only when bootstrapping a new managed cluster
  database: polyad
  ## @param postgresql.username [string] String. Dedicated application owner; PUBLIC database access is revoked and superuser access stays disabled
  username: polyad
  ## @param postgresql.events [object] Settings for postgresql.events.
  events:
    ## @param postgresql.events.enabled [boolean] Boolean. Archive approved application events in PostgreSQL; bounded live replay still uses Dragonfly
    enabled: true
    ## @param postgresql.events.retentionDays [integer] Integer. Retain durable event history for this many days; graph snapshots retain current state independently
    retentionDays: 30
  ## @param postgresql.scope [string] State identity within the database; empty uses the release namespace and name
  scope: ''
  ## @param postgresql.image [string] PostgreSQL image for the managed cluster
  image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie
  ## @param postgresql.maxConnections [integer] Maximum connections per managed database instance, including administration
  maxConnections: 100
  ## @param postgresql.storage [object] Settings for postgresql.storage.
  storage:
    ## @param postgresql.storage.size [string] Persistent storage per PostgreSQL instance
    size: 10Gi
    ## @param postgresql.storage.storageClass [string] Storage class; empty uses the cluster default unless encryptionAtRest selects a class; conflicting explicit classes are rejected
    storageClass: ''
  ## @param postgresql.encryptionAtRest [object] Select encrypted volumes for all chart-managed state and authentication database instances; external databases retain their provider configuration
  encryptionAtRest:
    ## @param postgresql.encryptionAtRest.enabled [boolean] Require the selected encrypted class for managed database PVCs; enabling this does not migrate existing volumes
    enabled: false
    ## @param postgresql.encryptionAtRest.provider [string] ExistingStorageClass uses an administrator-verified encrypted class; GKE creates a Persistent Disk CSI class referencing a Cloud KMS key
    provider: ExistingStorageClass
    ## @param postgresql.encryptionAtRest.storageClass [string] Required existing class name for ExistingStorageClass; optional name for the new GKE class, otherwise generated from release namespace and name
    storageClass: ''
    ## @param postgresql.encryptionAtRest.kmsKeyName [string] GKE symmetric Cloud KMS CryptoKey resource name in the cluster region; key material and IAM remain outside the chart
    kmsKeyName: ''
    ## @param postgresql.encryptionAtRest.diskType [string] GKE Persistent Disk CSI type such as pd-balanced, pd-ssd or hyperdisk-balanced; choose one supported by the node machine family and CSI driver
    diskType: pd-balanced
  ## @param postgresql.recordEncryption [object] Optional encryption of database JSON payloads inside each operator before SQL writes; independent of volume encryption and usable with external databases
  recordEncryption:
    ## @param postgresql.recordEncryption.enabled [boolean] Encrypt new state, snapshot, event and authentication-policy payloads; all database writers must use the same policy; existing rows are not migrated
    enabled: false
    ## @param postgresql.recordEncryption.existingSecret [string] Existing release-namespace Secret containing PEM RSA keys; key material must stay out of Helm values
    existingSecret: ''
    ## @param postgresql.recordEncryption.publicKeyKey [string] Secret data key holding a PEM RSA public key of at least 2048 bits; used to wrap a fresh encryption key for each record
    publicKeyKey: public.pem
    ## @param postgresql.recordEncryption.privateKeyKey [string] Optional matching PEM private-key entry; empty mounts only the public key, sufficient for database writes
    privateKeyKey: ''
    ## @param postgresql.recordEncryption.privateKeyPasswordKey [string] Optional password entry for an encrypted private PEM; requires privateKeyKey; empty means an unencrypted PEM
    privateKeyPasswordKey: ''
  ## @param postgresql.ha [object] Settings for postgresql.ha.
  ha:
    ## @param postgresql.ha.enabled [boolean] Enable primary plus standby instances and synchronous replication
    enabled: false
    ## @param postgresql.ha.instances [integer] Total instances when HA is enabled and autoscaling is disabled
    instances: 3
    ## @param postgresql.ha.topologyKey [string] Failure-domain label for required database pod anti-affinity
    topologyKey: kubernetes.io/hostname
  ## @param postgresql.resources [object] Resource requests and limits for each PostgreSQL instance
  resources:
    ## @param postgresql.resources.requests [object] Settings for postgresql.resources.requests.
               ## @param postgresql.resources.requests.cpu [string] Non-negative Kubernetes resource quantity as a string; quote whole cores such as "1". Examples: 250m, 0.5, 128Mi, 1Gi.
                          ## @param postgresql.resources.requests.memory [string] Non-negative Kubernetes resource quantity as a string; quote whole cores such as "1". Examples: 250m, 0.5, 128Mi, 1Gi.
    requests: {cpu: 250m, memory: 512Mi}
    ## @param postgresql.resources.limits [object] Settings for postgresql.resources.limits.
             ## @param postgresql.resources.limits.memory [string] Non-negative Kubernetes resource quantity as a string; quote whole cores such as "1". Examples: 250m, 0.5, 128Mi, 1Gi.
    limits: {memory: 1Gi}
  ## @param postgresql.autoscaling [object] Settings for postgresql.autoscaling.
  autoscaling:
    ## @param postgresql.autoscaling.enabled [boolean] Create a KEDA ScaledObject for the managed Cluster using operator connection counts
    enabled: false
    ## @param postgresql.autoscaling.minInstances [integer] Minimum instances; at least 3 with HA, never zero
    minInstances: 3
    ## @param postgresql.autoscaling.maxInstances [integer] Maximum database instances
    maxInstances: 6
    ## @param postgresql.autoscaling.connectionsPerInstance [integer] Operator connections per desired database instance; does not add primary write capacity
    connectionsPerInstance: 20

## @section Optional HA component deployment architecture
## @param architecture [object] Settings for architecture.
architecture:
  ## @param architecture.mode [string] Dense combines responsibilities; Distributed manages gateway, executor and telemetry ReplicaGroups inside a Graph; requires ha
  mode: Dense
  ## @param architecture.cheegerMinimum [number] Minimum edge expansion of the three-component Graph; the default chain has h=1
  cheegerMinimum: 1
  ## @param architecture.cheegerMaximum [number, nullable] Optional maximum edge expansion of the component Graph; null leaves it unbounded, 1 permits the chain but excludes a fully connected triangle
  cheegerMaximum: null
  ## @param architecture.expandedNodes [integer] Maximum recursive vertices in the self-managed Graph
  expandedNodes: 27
  ## @param architecture.autoscaling [boolean] Enable KEDA scaling of all component ReplicaGroup definitions
  autoscaling: false
  ## @param architecture.components [object] Settings for architecture.components.
  components:
    ## @param architecture.components.gateway [object] Settings for architecture.components.gateway.
    gateway:
      ## @param architecture.components.gateway.replicas [integer] Initial gateway copies
      replicas: 2
      ## @param architecture.components.gateway.minReplicas [integer] Minimum gateway copies
      minReplicas: 2
      ## @param architecture.components.gateway.maxReplicas [integer] Maximum gateway copies
      maxReplicas: 8
      ## @param architecture.components.gateway.requestsPerSecond [number] Target total HTTP requests per second per copy
      requestsPerSecond: 50
      ## @param architecture.components.gateway.concurrentRequests [integer] Target open HTTP requests and event streams per copy
      concurrentRequests: 8
    ## @param architecture.components.executor [object] Settings for architecture.components.executor.
    executor:
      ## @param architecture.components.executor.replicas [integer] Initial execution copies
      replicas: 2
      ## @param architecture.components.executor.minReplicas [integer] Minimum execution copies
      minReplicas: 2
      ## @param architecture.components.executor.maxReplicas [integer] Maximum execution copies
      maxReplicas: 8
      ## @param architecture.components.executor.backlog [integer] Target outstanding graph hints per execution copy across all managed clusters
      backlog: 8
    ## @param architecture.components.telemetry [object] Settings for architecture.components.telemetry.
    telemetry:
      ## @param architecture.components.telemetry.replicas [integer] Initial metrics-serving copies
      replicas: 2
      ## @param architecture.components.telemetry.minReplicas [integer] Minimum metrics-serving copies
      minReplicas: 2
      ## @param architecture.components.telemetry.maxReplicas [integer] Maximum metrics-serving copies
      maxReplicas: 8
      ## @param architecture.components.telemetry.requestsPerSecond [number] Target total metrics requests per second per copy
      requestsPerSecond: 50
      ## @param architecture.components.telemetry.concurrentRequests [integer] Target concurrent metrics requests per copy
      concurrentRequests: 2

## @param dragonfly [object] Settings for dragonfly.
dragonfly:
  ## @param dragonfly.enabled [boolean] Deploy Dragonfly through the upstream operator Helm dependency
  enabled: true
  ## @param dragonfly.image [string] Bundled Dragonfly image
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
  ## @param dragonfly.nodeSelector [object] Node labels selecting bundled cache Pods, independently of controller placement
  nodeSelector: {}
  ## @param dragonfly.tolerations [array] Taints tolerated by bundled cache Pods; use with nodeSelector to require a dedicated pool
  tolerations: []
  ## @param dragonfly.ha [object] Settings for dragonfly.ha.
  ha:
    ## @param dragonfly.ha.enabled [boolean] Enable primary/replica replication and automatic failover
    enabled: false
    ## @param dragonfly.ha.replicas [integer] Initial Dragonfly instances in HA mode, including the primary; fixed when autoscaling is disabled
    replicas: 2
    ## @param dragonfly.ha.topologyKey [string] Place HA instances on distinct values of this node label
    topologyKey: kubernetes.io/hostname
  ## @param dragonfly.autoscaling [object] Settings for dragonfly.autoscaling.
  autoscaling:
    ## @param dragonfly.autoscaling.enabled [boolean] Use KEDA for bundled HA Dragonfly and enable Polyad metrics; inactive outside bundled HA
    enabled: true
    ## @param dragonfly.autoscaling.minReplicas [integer] Minimum total cache instances, including the primary; never below two
    minReplicas: 2
    ## @param dragonfly.autoscaling.maxReplicas [integer] Maximum total cache instances; requires sufficient eligible nodes and storage
    maxReplicas: 5
    ## @param dragonfly.autoscaling.connectionsPerReplica [integer] Primary connected clients per desired cache instance; scales failover copies, not write capacity
    connectionsPerReplica: 50
  ## @param dragonfly.externalUrl [string] External Redis-compatible URL when bundled Dragonfly is disabled
  externalUrl: redis://dragonfly:6379/0
  ## @param dragonfly.existingSecret [string] Existing Secret containing a url key for Dragonfly, taking precedence over other connection settings
  existingSecret: ''
  ## @param dragonfly.persistence [object] Settings for dragonfly.persistence.
  persistence:
    ## @param dragonfly.persistence.enabled [boolean] Persist bundled Dragonfly snapshots on a PVC
    enabled: true
    ## @param dragonfly.persistence.size [string] Snapshot volume capacity
    size: 1Gi
    ## @param dragonfly.persistence.storageClass [string] Snapshot volume storage class; empty uses the cluster default
    storageClass: ''

## @section Upstream Dragonfly operator dependency
## @param dragonflyOperator [object] Settings for dragonflyOperator.
dragonflyOperator:
  ## @param dragonflyOperator.nameOverride [string] Upstream controller resource name
  nameOverride: dragonfly-operator
  ## @param dragonflyOperator.replicaCount [integer] Leader-elected Dragonfly controller replicas
  replicaCount: 2
  ## @param dragonflyOperator.crds [object] Settings for dragonflyOperator.crds.
  crds:
    ## @param dragonflyOperator.crds.install [boolean] Must remain false; Polyad installs the pinned upstream CRD from crds before rendering instances
    install: false
  ## @param dragonflyOperator.manager [object] Settings for dragonflyOperator.manager.
  manager:
    ## @param dragonflyOperator.manager.extraArgs [array] Additional Dragonfly controller command arguments
    extraArgs: []
  ## @param dragonflyOperator.rbacProxy [object] Settings for dragonflyOperator.rbacProxy.
  rbacProxy:
    ## @param dragonflyOperator.rbacProxy.extraArgs [array] Additional metrics proxy command arguments
    extraArgs: []

## @section Composition API
## @param api [object] Settings for api.
api:
  ## @param api.enabled [boolean] Serve authenticated composition requests on port 8090 through a ClusterIP Service
  enabled: false
  ## @param api.existingSecret [string] Existing Secret with a token key authorizing namespace-scoped composition submissions and audit reads
  existingSecret: polyad-api
  ## @param api.key [string] Inline composition token; creates a managed Secret and requires existingSecret to be empty
  key: ''
  ## @param api.rateLimit [object] Settings for api.rateLimit.
  rateLimit:
    ## @param api.rateLimit.enabled [boolean] Enforce shared Redis/Dragonfly composition request quotas on every logical shard
    enabled: true
    ## @param api.rateLimit.requestsPerMinute [integer] Combined submission and audit requests per minute per shard, shared by all replicas
    requestsPerMinute: 60
  ## @param api.gateway [object] Settings for api.gateway.
  gateway:
    ## @param api.gateway.enabled [boolean] Expose the composition Service through a Gateway API v1 HTTPRoute; requires api.enabled
    enabled: false
    ## @param api.gateway.create [boolean] Create a Gateway in this release namespace instead of attaching to an existing Gateway
    create: false
    ## @param api.gateway.name [string] Existing Gateway name when create is false; created Gateways use the release API name
    name: ''
    ## @param api.gateway.namespace [string] Existing Gateway namespace; empty uses the release namespace
    namespace: ''
    ## @param api.gateway.className [string] Installed GatewayClass used when create is true
    className: ''
    ## @param api.gateway.sectionName [string] Listener name to attach to or create
    sectionName: http
    ## @param api.gateway.hostnames [array] DNS hostnames matched by the HTTPRoute; empty matches all listener hostnames
    hostnames: []
    ## @param api.gateway.tlsSecret [string] Existing TLS certificate Secret in the release namespace for a created HTTPS listener on port 443; empty creates HTTP on port 80
    tlsSecret: ''

## @section Temporary connections
## @param connections [object] Settings for connections.
connections:
  ## @param connections.enabled [boolean] Serve service-account authenticated temporary connections on port 8093
  enabled: false
  ## @param connections.scope [string] Allowed caller and target namespaces: Cluster, OperatorNamespace or Namespace
  scope: Cluster
  ## @param connections.namespace [string] Allowed namespace when scope is Namespace; otherwise empty
  namespace: ''
  ## @param connections.maxTtlSeconds [integer] Maximum connection lifetime from receipt creation, capped at 86400 seconds
  maxTtlSeconds: 3600
  ## @param connections.retentionSeconds [integer] Retain terminal receipts for retry identity and audit before cleanup
  retentionSeconds: 3600
  ## @param connections.pulses [object] Settings for connections.pulses.
  pulses:
    ## @param connections.pulses.cooldownSeconds [number] HA-shared proposal and approval cooldown window (0-300 seconds); zero disables extra pacing, rejection and revocation bypass it
    cooldownSeconds: 0
    ## @param connections.pulses.burst [integer] New proposals per graph and positive responses per graph endpoint in a cooldown window (1-128); identical retries consume no new pulse
    burst: 1

## @section Event subscriptions
## @param events [object] Settings for events.
events:
  ## @param events.enabled [boolean] Serve namespace graph observations through a separate events Service on port 8091; SSE is always available when enabled
  enabled: false
  ## @param events.websockets [object] Optional WebSocket subscriptions on the same events Service and shared operator HTTP runtime
  websockets:
    ## @param events.websockets.enabled [boolean] Enable /v1/events/ws alongside SSE; both transports share authentication, replay cursors and subscriber limits; requires events.enabled
    enabled: false
  ## @param events.existingSecret [string] Existing Secret containing a token key for read-only event subscriptions
  existingSecret: polyad-events
  ## @param events.key [string] Inline subscriber token; creates a managed Secret and requires existingSecret to be empty
  key: ''
  ## @param events.retention [integer] Maximum observations retained in the shared replay stream
  retention: 10000
  ## @param events.maxConnections [integer] Maximum simultaneous event subscribers per operator replica
  maxConnections: 16
  ## @param events.maxEventBytes [integer] Maximum complete SSE record or WebSocket JSON frame in UTF-8 bytes (1024-16777216); oversized observations are rejected before replay/archive, and clients choose their own matching receive cap
  maxEventBytes: 1048576
  ## @param events.readBatchSize [integer] Maximum observations fetched per subscriber read (1-256); higher values catch up faster but increase memory and work per read
  readBatchSize: 64
  ## @param events.pollIntervalSeconds [number] Empty-stream polling delay in seconds (0.05-5); lower values reduce idle delivery latency at the cost of more cache reads
  pollIntervalSeconds: 1
  ## @param events.rebalance [object] Optional copulses move event subscriptions between operator replicas while retaining application replay checkpoints
  rebalance:
    ## @param events.rebalance.enabled [boolean] Enable authenticated endpoint discovery, rolling reconnect controls and preStop draining; clients opt in with subscribe(rebalance=True)
    enabled: false
    ## @param events.rebalance.routing [string] Service keeps the configured authority and delegates routing to Kubernetes or Istio; Direct lets reachable in-cluster clients round-robin discovered Pod IPs while retaining Host and TLS identity
    routing: Service
    ## @param events.rebalance.refreshSeconds [number] Refresh ready nonterminating event Pods every 1-60 seconds; discovery rejects membership older than three refresh intervals
    refreshSeconds: 5
    ## @param events.rebalance.automatic [boolean] Schedule a reconnect roll when the ready operator membership changes; manual Service annotation triggers remain available when false
    automatic: true
    ## @param events.rebalance.batchPercent [integer] Schedule at most this percentage of each replica's initial subscribers per batch (1-100, rounded up to one); this is a per-replica pacing limit
    batchPercent: 10
    ## @param events.rebalance.intervalSeconds [number] Separate ordinary batches by 0.1-30 seconds and jitter reconnections; termination compresses batches to fit drainSeconds
    intervalSeconds: 2
    ## @param events.rebalance.cooldownSeconds [number] Coalesce membership and manual triggers behind this per-replica cooldown (1-3600 seconds); termination drains take precedence
    cooldownSeconds: 60
    ## @param events.rebalance.drainSeconds [number] Keep the process alive for 5-300 seconds after preStop closes subscription admission; terminationGracePeriodSeconds must also allow 35 seconds for shutdown plus another drainSeconds when the native Istio sidecar is enabled
    drainSeconds: 20
    ## @param events.rebalance.maxConnectionSeconds [number] Optional connection age limit (0-86400 seconds); zero disables periodic rotation, otherwise use at least cooldownSeconds
    maxConnectionSeconds: 0
  ## @param events.istio [object] Optional mesh routing of new subscriptions; copulses remain responsible for moving established streams
  istio:
    ## @param events.istio.enabled [boolean] Render an events DestinationRule; requires mesh.operator.enabled, event rebalancing and Service routing
    enabled: false
    ## @param events.istio.loadBalancer [string] LEAST_REQUEST favors replicas with fewer outstanding requests; ROUND_ROBIN cycles through ready replicas when establishing new subscriptions
    loadBalancer: LEAST_REQUEST
    ## @param events.istio.warmupSeconds [number] Gradually introduce new ready endpoints over this many seconds (1-300); affects new requests, never moves an existing WebSocket
    warmupSeconds: 30

## @section Scheduler metrics
## @param metrics [object] Settings for metrics.
metrics:
  ## @param metrics.enabled [boolean] Serve cached queue, write, inventory, component, backend and root-worker metrics on internal port 8092; optional families follow their feature enablement
  enabled: false
