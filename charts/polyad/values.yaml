# yaml-language-server: $schema=values.schema.json
## @section Deployment profiles
## @param ha Boolean. Run at least two operator replicas and permit split components or remote workers; false runs one dense operator
ha: false

## @section Helm-installed downstream operator workers
worker:
  ## @param worker.enabled Install an execution replica connected to an existing root; disables root election and requires external root/cache credentials
  enabled: false
  ## @param worker.rootNamespace Namespace of the root's queues, leases and OperatorPool; independent of this Helm release namespace
  rootNamespace: ''
  ## @param worker.rootClusterName Root federation identity; global.multiCluster.clusterName identifies this worker's hosting cluster instead
  rootClusterName: ''
  ## @param worker.rootDeployment Name of the existing root Deployment, used to identify the attachment authority
  rootDeployment: ''
  ## @param worker.rootGraph Name of the root's reserved PolyGraph; normally ROOT_RELEASE-operators
  rootGraph: ''
  ## @param worker.poolName Name of the root-namespace OperatorPool that may attach this Deployment
  poolName: ''
  ## @param worker.scalingAuthority Root lets the matching OperatorPool/KEDA control replicas; Local keeps replicas and optional HPA under this Helm release
  scalingAuthority: Root

## @section OpenTelemetry traces and logs
tracing:
  ## @param tracing.enabled Export operator and observer traces over OTLP/HTTP; disabled creates no exporter
  enabled: false
  ## @param tracing.endpoint Full HTTP/protobuf trace URL, including /v1/traces; use a Collector reachable from every execution cluster
  endpoint: http://otel-collector:4318/v1/traces
  ## @param tracing.serviceName Service identity in the trace backend; resource attributes can identify cluster and environment
  serviceName: polyad-operator
  ## @param tracing.samplingRatio Fraction of new root traces to sample (number, 0-1); child spans honor their parent's sampling decision
  samplingRatio: 1
  ## @param tracing.timeoutSeconds Export request timeout in seconds; exports are batched off the reconciliation path
  timeoutSeconds: 10
  ## @param tracing.resourceAttributes Comma-separated OpenTelemetry resource attributes, for example deployment.environment.name=production
  resourceAttributes: ''
  ## @param tracing.headersSecret Existing Secret with a headers key containing OTLP exporter headers; empty for collectors without authentication
  headersSecret: ''
  logs:
    ## @param tracing.logs.enabled Export structured operator logs independently of trace enablement and sampling; console logging remains available
    enabled: false
    ## @param tracing.logs.endpoint Full HTTP/protobuf log URL, including /v1/logs; shares service identity, timeout, resource attributes and headersSecret with traces
    endpoint: http://otel-collector:4318/v1/logs

## @section Operator and shared queue parameters
operator:
  ## @param operator.logLevel Operator and observer Python logging verbosity; INFO for normal operation, DEBUG for reconciliation diagnostics (DEBUG, INFO, WARNING, ERROR or CRITICAL)
  logLevel: INFO
  ## @param operator.replicaCount [nullable] Operator replicas; null selects 1 for singular or 2 for ha, and must remain null for Root-scaled workers
  replicaCount: null
  ## @param operator.nodeSelector Node labels selecting the operator node group, independent of workload graph placement
  nodeSelector: {}
  ## @param operator.tolerations [array] Taints tolerated by the operator replicas
  tolerations: []
  autoscaling:
    ## @param operator.autoscaling.enabled Enable operator HPA using CPU and optional memory utilization
    enabled: false
    ## @param operator.autoscaling.minReplicas Minimum operator replicas
    minReplicas: 2
    ## @param operator.autoscaling.maxReplicas Maximum operator replicas, at least minReplicas and at most 32
    maxReplicas: 8
    ## @param operator.autoscaling.targetCPUUtilizationPercentage Target operator CPU utilization relative to requested CPU
    targetCPUUtilizationPercentage: 70
    ## @param operator.autoscaling.targetMemoryUtilizationPercentage [nullable] Optional target memory utilization relative to requested memory (1-100); null disables the memory metric
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        ## @param operator.autoscaling.behavior.scaleUp.stabilizationWindowSeconds Scale-up recommendation window in seconds (0-3600)
        stabilizationWindowSeconds: 0
        ## @param operator.autoscaling.behavior.scaleUp.selectPolicy Choose the largest or smallest permitted change, or disable scale-up (Max, Min, Disabled)
        selectPolicy: Max
        ## @param operator.autoscaling.behavior.scaleUp.policies [array] Rate limits (Pods or Percent); defaults to 100 percent or 4 Pods per 15 seconds; periodSeconds accepts 1-1800
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 4
            periodSeconds: 15
      scaleDown:
        ## @param operator.autoscaling.behavior.scaleDown.stabilizationWindowSeconds Scale-down recommendation window in seconds (0-3600)
        stabilizationWindowSeconds: 300
        ## @param operator.autoscaling.behavior.scaleDown.selectPolicy Choose the largest or smallest permitted change, or disable scale-down (Max, Min, Disabled)
        selectPolicy: Max
        ## @param operator.autoscaling.behavior.scaleDown.policies [array] Rate limits (Pods or Percent); defaults to 100 percent per 15 seconds; periodSeconds accepts 1-1800
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  tuning:
    ## @param operator.tuning.rescanIntervalSeconds Pause after local and root-managed remote inventory scans (1-15s); watch polyad_inventory_sample_age_seconds and polyad_cluster_inventory_sample_fresh; lower values add Kubernetes and optional state writes
    rescanIntervalSeconds: 5
    ## @param operator.tuning.consumeIntervalSeconds Pause after local and remote queue consumption passes (0.1-5s); watch polyad_inbound_updates and polyad_kubernetes_writes_queued before increasing dispatch pressure
    consumeIntervalSeconds: 1
    ## @param operator.tuning.metricsIntervalSeconds Pause after cached metrics publication and component/worker reporting (1-5s); also controls enabled PostgreSQL and Dragonfly connection sampling, not Prometheus scrape frequency or trace export
    metricsIntervalSeconds: 5
    ## @param operator.tuning.backlogIntervalSeconds Pause after local shared-queue samples (1-5s); watch polyad_inbound_sample_age_seconds; root-managed remote backlog is sampled by rescanIntervalSeconds
    backlogIntervalSeconds: 5
  image:
    ## @param operator.image.repository Operator image repository
    repository: ghcr.io/astrivant/polyad
    ## @param operator.image.tag Operator image tag
    tag: '0.0.1-alpha3'
    ## @param operator.image.pullPolicy Operator image pull policy
    pullPolicy: IfNotPresent
  resources:
    requests:
      ## @param operator.resources.requests.cpu Requested operator CPU, required for CPU autoscaling
      cpu: 100m
      ## @param operator.resources.requests.memory Requested operator memory, required when the HPA memory metric is enabled
      memory: 128Mi
    limits:
      ## @param operator.resources.limits.memory Operator memory limit
      memory: 512Mi
  ## @param operator.terminationGracePeriodSeconds Time allowed for operator shutdown and outstanding API calls
  terminationGracePeriodSeconds: 60

## @section Optional PostgreSQL state storage
postgresql:
  ## @param postgresql.enabled Persist graph state and tracked parameters in PostgreSQL
  enabled: false
  ## @param postgresql.managed Create a CloudNativePG Cluster; install its operator first
  managed: true
  ## @param postgresql.existingSecret External database Secret containing the connection DSN when managed is false
  existingSecret: ''
  ## @param postgresql.secretKey DSN key in the external database Secret
  secretKey: uri
  ## @param postgresql.database String. Application database for graph state and optional event history; set only when bootstrapping a new managed cluster
  database: polyad
  ## @param postgresql.username String. Dedicated application owner; PUBLIC database access is revoked and superuser access stays disabled
  username: polyad
  events:
    ## @param postgresql.events.enabled Boolean. Archive approved application events in PostgreSQL; bounded live replay still uses Dragonfly
    enabled: true
    ## @param postgresql.events.retentionDays Integer. Retain durable event history for this many days; graph snapshots retain current state independently
    retentionDays: 30
  ## @param postgresql.scope State identity within the database; empty uses the release namespace and name
  scope: ''
  ## @param postgresql.image PostgreSQL image for the managed cluster
  image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie
  ## @param postgresql.maxConnections Maximum connections per managed database instance, including administration
  maxConnections: 100
  storage:
    ## @param postgresql.storage.size Persistent storage per PostgreSQL instance
    size: 10Gi
    ## @param postgresql.storage.storageClass Storage class; empty uses the cluster default
    storageClass: ''
  ha:
    ## @param postgresql.ha.enabled Enable primary plus standby instances and synchronous replication
    enabled: false
    ## @param postgresql.ha.instances Total instances when HA is enabled and autoscaling is disabled
    instances: 3
    ## @param postgresql.ha.topologyKey Failure-domain label for required database pod anti-affinity
    topologyKey: kubernetes.io/hostname
  ## @param postgresql.resources [object] Resource requests and limits for each PostgreSQL instance
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
  autoscaling:
    ## @param postgresql.autoscaling.enabled Create a KEDA ScaledObject for the managed Cluster using operator connection counts
    enabled: false
    ## @param postgresql.autoscaling.minInstances Minimum instances; at least 3 with HA, never zero
    minInstances: 3
    ## @param postgresql.autoscaling.maxInstances Maximum database instances
    maxInstances: 6
    ## @param postgresql.autoscaling.connectionsPerInstance Operator connections per desired database instance; does not add primary write capacity
    connectionsPerInstance: 20

## @section Optional HA component deployment architecture
architecture:
  ## @param architecture.mode Dense combines responsibilities; Distributed manages gateway, executor and telemetry ReplicaGroups inside a Graph; requires ha
  mode: Dense
  ## @param architecture.cheegerMinimum Minimum edge expansion of the three-component Graph; the default chain has h=1
  cheegerMinimum: 1
  ## @param architecture.expandedNodes Maximum recursive vertices in the self-managed Graph
  expandedNodes: 27
  ## @param architecture.autoscaling Enable KEDA scaling of all component ReplicaGroup definitions
  autoscaling: false
  components:
    gateway:
      ## @param architecture.components.gateway.replicas Initial gateway copies
      replicas: 2
      ## @param architecture.components.gateway.minReplicas Minimum gateway copies
      minReplicas: 2
      ## @param architecture.components.gateway.maxReplicas Maximum gateway copies
      maxReplicas: 8
      ## @param architecture.components.gateway.requestsPerSecond Target total HTTP requests per second per copy
      requestsPerSecond: 50
      ## @param architecture.components.gateway.concurrentRequests Target open HTTP requests and event streams per copy
      concurrentRequests: 8
    executor:
      ## @param architecture.components.executor.replicas Initial execution copies
      replicas: 2
      ## @param architecture.components.executor.minReplicas Minimum execution copies
      minReplicas: 2
      ## @param architecture.components.executor.maxReplicas Maximum execution copies
      maxReplicas: 8
      ## @param architecture.components.executor.backlog Target outstanding graph hints per execution copy across all managed clusters
      backlog: 8
    telemetry:
      ## @param architecture.components.telemetry.replicas Initial metrics-serving copies
      replicas: 2
      ## @param architecture.components.telemetry.minReplicas Minimum metrics-serving copies
      minReplicas: 2
      ## @param architecture.components.telemetry.maxReplicas Maximum metrics-serving copies
      maxReplicas: 8
      ## @param architecture.components.telemetry.requestsPerSecond Target total metrics requests per second per copy
      requestsPerSecond: 50
      ## @param architecture.components.telemetry.concurrentRequests Target concurrent metrics requests per copy
      concurrentRequests: 2

dragonfly:
  ## @param dragonfly.enabled Deploy Dragonfly through the upstream operator Helm dependency
  enabled: true
  ## @param dragonfly.image Bundled Dragonfly image
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
  ha:
    ## @param dragonfly.ha.enabled Enable primary/replica replication and automatic failover
    enabled: false
    ## @param dragonfly.ha.replicas Initial Dragonfly instances in HA mode, including the primary; fixed when autoscaling is disabled
    replicas: 2
    ## @param dragonfly.ha.topologyKey Place HA instances on distinct values of this node label
    topologyKey: kubernetes.io/hostname
  autoscaling:
    ## @param dragonfly.autoscaling.enabled Use KEDA for bundled HA Dragonfly and enable Polyad metrics; inactive outside bundled HA
    enabled: true
    ## @param dragonfly.autoscaling.minReplicas Minimum total cache instances, including the primary; never below two
    minReplicas: 2
    ## @param dragonfly.autoscaling.maxReplicas Maximum total cache instances; requires sufficient eligible nodes and storage
    maxReplicas: 5
    ## @param dragonfly.autoscaling.connectionsPerReplica Primary connected clients per desired cache instance; scales failover copies, not write capacity
    connectionsPerReplica: 50
  ## @param dragonfly.externalUrl External Redis-compatible URL when bundled Dragonfly is disabled
  externalUrl: redis://dragonfly:6379/0
  ## @param dragonfly.existingSecret Existing Secret containing a url key for Dragonfly, taking precedence over other connection settings
  existingSecret: ''
  persistence:
    ## @param dragonfly.persistence.enabled Persist bundled Dragonfly snapshots on a PVC
    enabled: true
    ## @param dragonfly.persistence.size Snapshot volume capacity
    size: 1Gi
    ## @param dragonfly.persistence.storageClass Snapshot volume storage class; empty uses the cluster default
    storageClass: ''

## @section Upstream Dragonfly operator dependency
dragonflyOperator:
  ## @param dragonflyOperator.nameOverride Upstream controller resource name
  nameOverride: dragonfly-operator
  ## @param dragonflyOperator.replicaCount Leader-elected Dragonfly controller replicas
  replicaCount: 2
  crds:
    ## @param dragonflyOperator.crds.install Must remain false; Polyad installs the pinned upstream CRD from crds before rendering instances
    install: false
  manager:
    ## @param dragonflyOperator.manager.extraArgs [array] Additional Dragonfly controller command arguments
    extraArgs: []
  rbacProxy:
    ## @param dragonflyOperator.rbacProxy.extraArgs [array] Additional metrics proxy command arguments
    extraArgs: []

## @section Composition API
api:
  ## @param api.enabled Serve authenticated composition requests on port 8090 through a ClusterIP Service
  enabled: false
  ## @param api.existingSecret Existing Secret with a token key authorizing namespace-scoped composition submissions and audit reads
  existingSecret: polyad-api
  ## @param api.key Inline composition token; creates a managed Secret and requires existingSecret to be empty
  key: ''
  rateLimit:
    ## @param api.rateLimit.enabled Enforce shared Redis/Dragonfly composition request quotas on every logical shard
    enabled: true
    ## @param api.rateLimit.requestsPerMinute Combined submission and audit requests per minute per shard, shared by all replicas
    requestsPerMinute: 60
  gateway:
    ## @param api.gateway.enabled Expose the composition Service through a Gateway API v1 HTTPRoute; requires api.enabled
    enabled: false
    ## @param api.gateway.create Create a Gateway in this release namespace instead of attaching to an existing Gateway
    create: false
    ## @param api.gateway.name Existing Gateway name when create is false; created Gateways use the release API name
    name: ''
    ## @param api.gateway.namespace Existing Gateway namespace; empty uses the release namespace
    namespace: ''
    ## @param api.gateway.className Installed GatewayClass used when create is true
    className: ''
    ## @param api.gateway.sectionName Listener name to attach to or create
    sectionName: http
    ## @param api.gateway.hostnames [array] DNS hostnames matched by the HTTPRoute; empty matches all listener hostnames
    hostnames: []
    ## @param api.gateway.tlsSecret Existing TLS certificate Secret in the release namespace for a created HTTPS listener on port 443; empty creates HTTP on port 80
    tlsSecret: ''

## @section Temporary connections
connections:
  ## @param connections.enabled Serve service-account authenticated temporary connections on port 8093
  enabled: false
  ## @param connections.scope Allowed caller and target namespaces: Cluster, OperatorNamespace or Namespace
  scope: Cluster
  ## @param connections.namespace Allowed namespace when scope is Namespace; otherwise empty
  namespace: ''
  ## @param connections.maxTtlSeconds Maximum connection lifetime from receipt creation, capped at 86400 seconds
  maxTtlSeconds: 3600
  ## @param connections.retentionSeconds Retain terminal receipts for retry identity and audit before cleanup
  retentionSeconds: 3600

## @section Event subscriptions
events:
  ## @param events.enabled Serve namespace graph observations through a separate SSE Service on port 8091
  enabled: false
  ## @param events.existingSecret Existing Secret containing a token key for read-only event subscriptions
  existingSecret: polyad-events
  ## @param events.key Inline subscriber token; creates a managed Secret and requires existingSecret to be empty
  key: ''
  ## @param events.retention Maximum observations retained in the shared replay stream
  retention: 10000
  ## @param events.maxConnections Maximum simultaneous event subscribers per operator replica
  maxConnections: 16

## @section Scheduler metrics
metrics:
  ## @param metrics.enabled Serve cached queue, write, inventory, component, backend and root-worker metrics on internal port 8092; optional families follow their feature enablement
  enabled: false
  ## @param metrics.graphLabels Add per-object hierarchy, resources, shape and local/remote workload-signal Prometheus series; increases cardinality, does not gate JSON or KEDA scalar routes
  graphLabels: false

  authentication:
    ## @param metrics.authentication.enabled Require a dedicated bearer token on all metrics endpoints
    enabled: false
    ## @param metrics.authentication.existingSecret Existing or ESO-managed Secret containing the metrics token
    existingSecret: polyad-metrics
    ## @param metrics.authentication.secretKey Key containing the metrics bearer token
    secretKey: token
    ## @param metrics.authentication.key Inline metrics token; requires existingSecret to be empty
    key: ''

## @section Named operator API credentials
authentication:
  ## @param authentication.mode String. Required enforces endpoint credentials; Disabled opts into an unauthenticated demo without HTTP request quotas
  mode: Required
  ## @param authentication.backend String. Builtin uses Polyad's Flask hooks; FlaskHTTPAuth loads the adapter included in official operator images
  backend: Builtin
  storage:
    ## @param authentication.storage.enabled Boolean. Persist one-way key verifiers and policy records in PostgreSQL and enforce database revocation; raw tokens stay in Kubernetes Secrets
    enabled: false
    ## @param authentication.storage.separateDatabase Boolean. Use an isolated authentication database; false reuses the state database and its role, requiring postgresql.enabled
    separateDatabase: true
    ## @param authentication.storage.managed Boolean. Provision a separate CloudNativePG Cluster; false uses the DSN from existingSecret
    managed: true
    ## @param authentication.storage.existingSecret String. Externally managed authentication database connection Secret; used with separateDatabase=true and managed=false
    existingSecret: ''
    ## @param authentication.storage.secretKey String. DSN key in the external authentication database Secret
    secretKey: uri
    ## @param authentication.storage.database String. Database name for a new managed authentication cluster
    database: polyad-authentication
    ## @param authentication.storage.username String. Sole application login owning the managed authentication database; PostgreSQL administrators retain administrative access
    username: polyad_authentication
    ## @param authentication.storage.size String. Persistent storage per managed authentication database instance
    size: 1Gi
    ## @param authentication.storage.storageClass String. Authentication database storage class; empty uses the cluster default
    storageClass: ''
  ## @param authentication.services [array] Service API keys with direction, Secret reference, endpoint scopes, outbound baseUrl and individual rate/concurrency limits
  services: []
  ## @param authentication.operators [array] Peer operator API keys; Inbound, Outbound or Bidirectional, with HA-wide per-key lanes
  operators: []

## @section KEDA credential integration
keda:
  authentication:
    ## @param keda.authentication.enabled Create a namespaced TriggerAuthentication referencing the metrics token; requires authenticated metrics
    enabled: false
    ## @param keda.authentication.name TriggerAuthentication name; empty uses the release metrics name
    name: ''

## @section Optional External Secrets Operator resources
externalSecrets:
  ## @param externalSecrets.enabled Generate ExternalSecret resources; requires an installed ESO operator and SecretStore
  enabled: false
  ## @param externalSecrets.reloadOnChange Opt into Stakater Reloader annotations for ESO Secrets, operator and observer Deployments, and Daemons with spec.reloadOnSecretChange; requires externalSecrets.enabled and an installed Reloader
  reloadOnChange: false
  ## @param externalSecrets.refreshInterval ESO credential refresh interval
  refreshInterval: 1h
  secretStoreRef:
    ## @param externalSecrets.secretStoreRef.name Existing SecretStore or ClusterSecretStore name
    name: ''
    ## @param externalSecrets.secretStoreRef.kind Secret store reference kind
    kind: SecretStore
  ## @param externalSecrets.secrets [array] Secret mappings with name and data entries of secretKey and remoteRef; reference names via existingSecret settings
  secrets: []

## @section Operator endpoint and cache isolation
networkPolicy:
  ## @param networkPolicy.enabled Isolate operator pods; requires explicit Kubernetes API and cache egress rules
  enabled: false
  ## @param networkPolicy.apiServerCIDRs [array] Kubernetes API endpoint CIDRs reachable through this cluster's CNI
  apiServerCIDRs: []
  ## @param networkPolicy.apiServerPort Kubernetes API endpoint port after this cluster's service translation
  apiServerPort: 443
  ## @param networkPolicy.compositionPeers [array] NetworkPolicy peers allowed to connect to the composition API
  compositionPeers: []
  ## @param networkPolicy.eventPeers [array] NetworkPolicy peers allowed to subscribe to events
  eventPeers: []
  ## @param networkPolicy.metricsPeers [array] Monitoring peers allowed to scrape the metrics API on port 8092
  metricsPeers: []
  ## @param networkPolicy.healthPeers [array] Optional monitoring peers allowed to read port 8080 health metrics
  healthPeers: []
  ## @param networkPolicy.extraEgress [array] Additional NetworkPolicy egress rules, including any external cache or DNS configuration
  extraEgress: []

## @section Optional Istio integration
mesh:
  ## @param mesh.enabled Allow graph HTTP and service-identity authorization and generate Istio security resources
  enabled: false
  ## @param mesh.install Install the pinned upstream Istio base and istiod dependencies; requires mesh.enabled
  install: false
  multicluster:
    ## @param mesh.multicluster.enabled Enable the existing or bundled sidecar mesh's multicluster configuration
    enabled: false
    eastWest:
      ## @param mesh.multicluster.eastWest.enabled Install a dedicated east-west gateway for separate networks
      enabled: false
      ## @param mesh.multicluster.eastWest.portName Istio Gateway listener name; protocol TLS and AUTO_PASSTHROUGH mode are required by this integration
      portName: tls
      ## @param mesh.multicluster.eastWest.hosts [array] Service SNI suffixes exposed through AUTO_PASSTHROUGH
      hosts: ['*.local']
    ## @param mesh.multicluster.peers [array] Remote transport registrations; see docs/deployment/multicluster.md for same-network and gateway configurations
    peers: []
  operator:
    ## @param mesh.operator.enabled Inject the operator pods and authorize their API and event ports with Istio
    enabled: false
    ## @param mesh.operator.compositionPrincipals [array] Exact mTLS source identities allowed to use the composition endpoint
    compositionPrincipals: []
    ## @param mesh.operator.metricsPrincipals [array] Exact mTLS source identities allowed to read scheduler metrics
    metricsPrincipals: []
    ## @param mesh.operator.eventPrincipals [array] Exact mTLS source identities allowed to subscribe to events
    eventPrincipals: []
    ## @param mesh.operator.connectionPrincipals [array] Exact mTLS source identities allowed to request temporary connections
    connectionPrincipals: []
  ingress:
    ## @param mesh.ingress.enabled Install the optional upstream Istio gateway dependency
    enabled: false
    ## @param mesh.ingress.hosts [array] Hosts served by the Istio Gateway and VirtualService
    hosts: []
    ## @param mesh.ingress.tlsSecret TLS credential Secret in the gateway namespace, required when exposing the APIs
    tlsSecret: ''
## @param istioBase [object] Upstream Istio base chart overrides
istioBase: {}
## @param istiod [object] Upstream Istio control-plane chart overrides
istiod:
  env:
    ENABLE_NATIVE_SIDECARS: 'true'
  meshConfig:
    enableAutoMtls: true
    defaultConfig:
      holdApplicationUntilProxyStarts: true
## @param istioIngress [object] Upstream Istio gateway chart overrides
istioIngress:
  labels:
    istio: polyad-ingress
## @param istioEastWest [object] Upstream east-west gateway overrides; networkGateway must equal global.network and custom tunnel ports require a matching networking.istio.io/gatewayPort label
istioEastWest:
  name: polyad-eastwest
  labels:
    istio: polyad-eastwest
  networkGateway: ''
  networkGatewayPorts:
    status-port:
      port: 15021
      targetPort: 15021
    tls:
      # Gateway.port.number uses this Service port. For a custom port, also set
      # labels.networking.istio.io/gatewayPort to its string value for discovery.
      port: 15443
      # Istio translates the Gateway's Service port to this Pod listener port.
      targetPort: 15443

## @section Shared Istio namespace
global:
  ## @param global.istioNamespace Istio control-plane namespace; must equal the release namespace when mesh.install is enabled
  istioNamespace: istio-system
  ## @param global.meshID Shared mesh identity across participating clusters
  meshID: ''
  ## @param global.network Network containing this cluster; different networks use east-west gateways
  network: ''
  multiCluster:
    ## @param global.multiCluster.clusterName Unique, stable cluster identity used by Istio and Polyad
    clusterName: ''

## @section Cross-cluster PolyGraph management
federation:
  ## @param federation.enabled Allow PolyGraph nodes to deploy Graphs and nested PolyGraphs in registered clusters
  enabled: false
  ## @param federation.clusters [array] Cluster name, namespace and kubeconfigSecret registrations; credentials are mounted read-only
  clusters: []

## @section Optional shared graph observers
observer:
  ## @param observer.enabled Deploy shared read-only observers independently of execution operators
  enabled: false
  ## @param observer.replicaCount Number of stateless read replicas in this cluster and namespace
  replicaCount: 1
  ## @param observer.existingSecret Existing Secret containing a dedicated read credential under token
  existingSecret: ''
  ## @param observer.mesh Enable native sidecar injection, strict mTLS and source-identity authorization for observer Pods
  mesh: false
  ## @param observer.principals [array] Exact source principals allowed to read the observer when observer.mesh is enabled
  principals: []
  ## @param observer.peers [array] NetworkPolicy peers allowed to reach observer TCP 8094 when networkPolicy.enabled is set
  peers: []
  ## @param observer.resources [object] CPU and memory requests and limits for the read replicas
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi

## @section Advance graph capacity
capacity:
  ## @param capacity.enabled Allow graph capacity plans to create autoscaler requests and inert placeholder Pods
  enabled: false
  ## @param capacity.provisioningClassName Autoscaler class used when a graph does not select one
  provisioningClassName: best-effort-atomic-scale-up.autoscaling.x-k8s.io
  ## @param capacity.maxPods Maximum forecast Pods per graph boundary, also bounded by each graph's maxPods
  maxPods: 128
  ## @param capacity.placeholderImage Inert image used to expose advance scheduling demand
  placeholderImage: registry.k8s.io/pause:3.10
  priorityClass:
    ## @param capacity.priorityClass.create Install a release-scoped PriorityClass for placeholder Pods
    create: true
    ## @param capacity.priorityClass.name Existing PriorityClass name, or an override for the generated name
    name: ""
    ## @param capacity.priorityClass.value Placeholder priority; must meet the autoscaler's cutoff and be below workload priorities
    value: -5

## @section Root control plane
rootControlPlane:
  ## @param rootControlPlane.enabled Manage registered clusters and remote execution replicas through one root scheduler; requires ha
  enabled: false
  ## @param rootControlPlane.pools [array] Root-owned OperatorPools; set existingDeployment to attach a Helm-installed worker and scalingAuthority to Root or Local instead of provisioning it
  pools: []
  ## @param rootControlPlane.kubeconfigSecret Existing root-namespace Secret with embedded, verified root kubeconfig under config, reachable from worker clusters
  kubeconfigSecret: ''
  ## @param rootControlPlane.meshPeers [array] Complete workload-cluster mesh peer registry; the controller excludes its current execution cluster
  meshPeers: []
  endpoints:
    ## @param rootControlPlane.endpoints.api Externally reachable root composition API URL advertised to workloads
    api: ''
    ## @param rootControlPlane.endpoints.events Externally reachable root events URL advertised to workloads
    events: ''
    ## @param rootControlPlane.endpoints.metrics Externally reachable root metrics URL advertised to workloads
    metrics: ''
