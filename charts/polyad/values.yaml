    ## @param telemetry.operatorMetricsSecret.key [string] Secret key containing the metrics bearer token.
    key: token
  ## @param telemetry.storage [object] Metric WAL persistence for each collector replica.
  storage:
    ## @param telemetry.storage.enabled [boolean] Keep the metric WAL on a per-replica PVC; false uses disposable emptyDir storage.
    enabled: true
    ## @param telemetry.storage.size [string] WAL volume size.
    size: 2Gi
    ## @param telemetry.storage.storageClass [string] StorageClass name; empty uses the cluster default.
    storageClass: ''
  ## @param telemetry.resources [object] Settings for telemetry.resources.
  resources:
    ## @param telemetry.resources.requests [object] Settings for telemetry.resources.requests.
    requests:
      ## @param telemetry.resources.requests.cpu [string] Non-negative Kubernetes resource quantity as a string; quote whole cores such as "1". Examples: 250m, 0.5, 128Mi, 1Gi.
      cpu: 100m
      ## @param telemetry.resources.requests.memory [string] Non-negative Kubernetes resource quantity as a string; quote whole cores such as "1". Examples: 250m, 0.5, 128Mi, 1Gi.
      memory: 128Mi
    ## @param telemetry.resources.limits [object] Settings for telemetry.resources.limits.
    limits:
      ## @param telemetry.resources.limits.memory [string] Non-negative Kubernetes resource quantity as a string; quote whole cores such as "1". Examples: 250m, 0.5, 128Mi, 1Gi.
      memory: 512Mi
  ## @param telemetry.nodeSelector [object] Collector placement; empty inherits operator.nodeSelector.
  nodeSelector: {}
  ## @param telemetry.tolerations [array] Collector tolerations; empty inherits operator.tolerations.
  tolerations: []
  ## @param telemetry.extraTargets [array] Additional namespace-local exporters and log selectors, for separately installed components. Each namespace receives read-only discovery RBAC.
  extraTargets: []
  ## @param telemetry.traceNamespaces [array] Additional namespaces allowed to send traces when networkPolicy.enabled; the release namespace is always allowed.
  traceNamespaces: []
