## @section Operator and shared queue parameters
operator:
  ## @param operator.logLevel Polyad logging verbosity (DEBUG, INFO, WARNING, ERROR or CRITICAL)
  logLevel: INFO
  ## @param operator.replicaCount Operator replicas when autoscaling is disabled
  replicaCount: 2
  ## @param operator.nodeSelector Node labels selecting the operator node group, independent of workload graph placement
  nodeSelector: {}
  ## @param operator.tolerations [array] Taints tolerated by the operator replicas
  tolerations: []
  autoscaling:
    ## @param operator.autoscaling.enabled Enable CPU-based operator autoscaling
    enabled: false
    ## @param operator.autoscaling.minReplicas Minimum operator replicas
    minReplicas: 2
    ## @param operator.autoscaling.maxReplicas Maximum operator replicas, at least minReplicas and at most 32
    maxReplicas: 8
    ## @param operator.autoscaling.targetCPUUtilizationPercentage Target operator CPU utilization relative to requested CPU
    targetCPUUtilizationPercentage: 70
  image:
    ## @param operator.image.repository Operator image repository
    repository: ghcr.io/astrivant/polyad
    ## @param operator.image.tag Operator image tag
    tag: '0.0.1-alpha3'
    ## @param operator.image.pullPolicy Operator image pull policy
    pullPolicy: IfNotPresent
  resources:
    requests:
      ## @param operator.resources.requests.cpu Requested operator CPU, required for CPU autoscaling
      cpu: 100m
      ## @param operator.resources.requests.memory Requested operator memory
      memory: 128Mi
    limits:
      ## @param operator.resources.limits.memory Operator memory limit
      memory: 512Mi
  ## @param operator.terminationGracePeriodSeconds Time allowed for operator shutdown and outstanding API calls
  terminationGracePeriodSeconds: 60

dragonfly:
  ## @param dragonfly.enabled Deploy Dragonfly through the upstream operator Helm dependency
  enabled: true
  ## @param dragonfly.image Bundled Dragonfly image
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
  ha:
    ## @param dragonfly.ha.enabled Enable primary/replica replication and automatic failover
    enabled: false
    ## @param dragonfly.ha.replicas Total Dragonfly instances in HA mode, including the primary
    replicas: 2
    ## @param dragonfly.ha.topologyKey Place HA instances on distinct values of this node label
    topologyKey: kubernetes.io/hostname
  ## @param dragonfly.externalUrl External Redis-compatible URL when bundled Dragonfly is disabled
  externalUrl: redis://dragonfly:6379/0
  ## @param dragonfly.existingSecret Existing Secret containing a url key for Dragonfly, taking precedence over other connection settings
  existingSecret: ''
  persistence:
    ## @param dragonfly.persistence.enabled Persist bundled Dragonfly snapshots on a PVC
    enabled: true
    ## @param dragonfly.persistence.size Snapshot volume capacity
    size: 1Gi
    ## @param dragonfly.persistence.storageClass Snapshot volume storage class; empty uses the cluster default
    storageClass: ''

## @section Upstream Dragonfly operator dependency
dragonflyOperator:
  ## @param dragonflyOperator.nameOverride Upstream controller resource name
  nameOverride: dragonfly-operator
  ## @param dragonflyOperator.replicaCount Leader-elected Dragonfly controller replicas
  replicaCount: 2
  crds:
    ## @param dragonflyOperator.crds.install Must remain false; Polyad installs the pinned upstream CRD from crds before rendering instances
    install: false
  manager:
    ## @param dragonflyOperator.manager.extraArgs [array] Additional Dragonfly controller command arguments
    extraArgs: []
  rbacProxy:
    ## @param dragonflyOperator.rbacProxy.extraArgs [array] Additional metrics proxy command arguments
    extraArgs: []

## @section Composition API
api:
  ## @param api.enabled Serve authenticated composition requests on port 8090 through a ClusterIP Service
  enabled: false
  ## @param api.existingSecret Existing Secret with a token key authorizing namespace-scoped composition submissions and audit reads
  existingSecret: polyad-api
  ## @param api.key Inline composition token; creates a managed Secret and requires existingSecret to be empty
  key: ''
  rateLimit:
    ## @param api.rateLimit.enabled Enforce shared Redis/Dragonfly composition request quotas on every logical shard
    enabled: true
    ## @param api.rateLimit.requestsPerMinute Combined submission and audit requests per minute per shard, shared by all replicas
    requestsPerMinute: 60
  gateway:
    ## @param api.gateway.enabled Expose the composition Service through a Gateway API v1 HTTPRoute; requires api.enabled
    enabled: false
    ## @param api.gateway.create Create a Gateway in this release namespace instead of attaching to an existing Gateway
    create: false
    ## @param api.gateway.name Existing Gateway name when create is false; created Gateways use the release API name
    name: ''
    ## @param api.gateway.namespace Existing Gateway namespace; empty uses the release namespace
    namespace: ''
    ## @param api.gateway.className Installed GatewayClass used when create is true
    className: ''
    ## @param api.gateway.sectionName Listener name to attach to or create
    sectionName: http
    ## @param api.gateway.hostnames [array] DNS hostnames matched by the HTTPRoute; empty matches all listener hostnames
    hostnames: []
    ## @param api.gateway.tlsSecret Existing TLS certificate Secret in the release namespace for a created HTTPS listener on port 443; empty creates HTTP on port 80
    tlsSecret: ''

## @section Event subscriptions
events:
  ## @param events.enabled Serve namespace graph observations through a separate SSE Service on port 8091
  enabled: false
  ## @param events.existingSecret Existing Secret containing a token key for read-only event subscriptions
  existingSecret: polyad-events
  ## @param events.key Inline subscriber token; creates a managed Secret and requires existingSecret to be empty
  key: ''
  ## @param events.retention Maximum observations retained in the shared replay stream
  retention: 10000
  ## @param events.maxConnections Maximum simultaneous event subscribers per operator replica
  maxConnections: 16

## @section Scheduler metrics
metrics:
  ## @param metrics.enabled Serve cached Prometheus and JSON metrics on an internal Service at port 8092
  enabled: false
  ## @param metrics.graphLabels Include per-object hierarchy and direct-resource Prometheus series; increases cardinality
  graphLabels: false

## @section Operator endpoint and cache isolation
networkPolicy:
  ## @param networkPolicy.enabled Isolate operator pods; requires explicit Kubernetes API and cache egress rules
  enabled: false
  ## @param networkPolicy.apiServerCIDRs [array] Kubernetes API endpoint CIDRs reachable through this cluster's CNI
  apiServerCIDRs: []
  ## @param networkPolicy.apiServerPort Kubernetes API endpoint port after this cluster's service translation
  apiServerPort: 443
  ## @param networkPolicy.compositionPeers [array] NetworkPolicy peers allowed to connect to the composition API
  compositionPeers: []
  ## @param networkPolicy.eventPeers [array] NetworkPolicy peers allowed to subscribe to events
  eventPeers: []
  ## @param networkPolicy.metricsPeers [array] Monitoring peers allowed to scrape the metrics API on port 8092
  metricsPeers: []
  ## @param networkPolicy.healthPeers [array] Optional monitoring peers allowed to read port 8080 health metrics
  healthPeers: []
  ## @param networkPolicy.extraEgress [array] Additional NetworkPolicy egress rules, including any external cache or DNS configuration
  extraEgress: []

## @section Optional Istio integration
mesh:
  ## @param mesh.enabled Allow graph HTTP and service-identity authorization and generate Istio security resources
  enabled: false
  ## @param mesh.install Install the pinned upstream Istio base and istiod dependencies; requires mesh.enabled
  install: false
  operator:
    ## @param mesh.operator.enabled Inject the operator pods and authorize their API and event ports with Istio
    enabled: false
    ## @param mesh.operator.compositionPrincipals [array] Exact mTLS source identities allowed to use the composition endpoint
    compositionPrincipals: []
    ## @param mesh.operator.metricsPrincipals [array] Exact mTLS source identities allowed to read scheduler metrics
    metricsPrincipals: []
    ## @param mesh.operator.eventPrincipals [array] Exact mTLS source identities allowed to subscribe to events
    eventPrincipals: []
  ingress:
    ## @param mesh.ingress.enabled Install the optional upstream Istio gateway dependency
    enabled: false
    ## @param mesh.ingress.hosts [array] Hosts served by the Istio Gateway and VirtualService
    hosts: []
    ## @param mesh.ingress.tlsSecret TLS credential Secret in the gateway namespace, required when exposing the APIs
    tlsSecret: ''
## @param istioBase [object] Upstream Istio base chart overrides
istioBase: {}
## @param istiod [object] Upstream Istio control-plane chart overrides
istiod:
  env:
    ENABLE_NATIVE_SIDECARS: 'true'
  meshConfig:
    enableAutoMtls: true
    defaultConfig:
      holdApplicationUntilProxyStarts: true
## @param istioIngress [object] Upstream Istio gateway chart overrides
istioIngress:
  labels:
    istio: polyad-ingress

## @section Shared Istio namespace
global:
  ## @param global.istioNamespace Istio control-plane namespace; must equal the release namespace when mesh.install is enabled
  istioNamespace: istio-system

## @section Advance graph capacity
capacity:
  ## @param capacity.enabled Allow graph capacity plans to create autoscaler requests and inert placeholder Pods
  enabled: false
  ## @param capacity.provisioningClassName Autoscaler class used when a graph does not select one
  provisioningClassName: best-effort-atomic-scale-up.autoscaling.x-k8s.io
  ## @param capacity.maxPods Maximum forecast Pods per graph boundary, also bounded by each graph's maxPods
  maxPods: 128
  ## @param capacity.placeholderImage Inert image used to expose advance scheduling demand
  placeholderImage: registry.k8s.io/pause:3.10
  priorityClass:
    ## @param capacity.priorityClass.create Install a release-scoped PriorityClass for placeholder Pods
    create: true
    ## @param capacity.priorityClass.name Existing PriorityClass name, or an override for the generated name
    name: ""
    ## @param capacity.priorityClass.value Placeholder priority; must meet the autoscaler's cutoff and be below workload priorities
    value: -5
