# yaml-language-server: $schema=values.reference.schema.json
# Guide: ../../docs/operations/event-rebalancing.md
# Overlay on your event credentials, mesh principals and network permissions.
## @param operator [object] Keep termination long enough for both the application and native Istio sidecar to drain.
operator:
  ## @param operator.terminationGracePeriodSeconds [integer] Covers a 20-second preStop roll, normal shutdown and the sidecar's final drain.
  terminationGracePeriodSeconds: 90
## @param events [object] Event stream routing and controlled reconnects for both SSE and WebSocket clients.
events:
  ## @param events.enabled [boolean] Serve the authorized application streams from the event operator group.
  enabled: true
  ## @param events.websockets [object] Optional transport; SSE receives identical copulse controls.
  websockets:
    ## @param events.websockets.enabled [boolean] Enable WebSocket upgrades on the existing event listener.
    enabled: true
  ## @param events.rebalance [object] Rolling connection resets, separate from graph mutations and Cheeger checks.
  rebalance:
    ## @param events.rebalance.enabled [boolean] Advertise membership and send controlled reconnection instructions.
    enabled: true
    ## @param events.rebalance.routing [string] Use Service with Istio; choose Direct only for clients able to reach Pod IPs, and disable events.istio below.
    routing: Service
    ## @param events.rebalance.refreshSeconds [number] Poll Kubernetes ready membership every five seconds.
    refreshSeconds: 5
    ## @param events.rebalance.automatic [boolean] Roll on scale-out, scale-in or replacement; false retains manual annotation triggers.
    automatic: true
    ## @param events.rebalance.batchPercent [integer] Move up to ten percent of each replica's initial subscribers per batch, rounded up.
    batchPercent: 10
    ## @param events.rebalance.intervalSeconds [number] Spread ordinary batches by two seconds and jitter client reconnects.
    intervalSeconds: 2
    ## @param events.rebalance.cooldownSeconds [number] Coalesce repeated ordinary triggers for one minute on each replica.
    cooldownSeconds: 60
    ## @param events.rebalance.drainSeconds [number] Hold termination for twenty seconds while stopping admission and moving active subscriptions.
    drainSeconds: 20
    ## @param events.rebalance.maxConnectionSeconds [number] Zero disables periodic rotation; choose a value at least cooldownSeconds to bound ordinary connection age.
    maxConnectionSeconds: 0
  ## @param events.istio [object] Let mesh proxies select healthy replicas for fresh subscriptions.
  istio:
    ## @param events.istio.enabled [boolean] Install a DestinationRule for this event Service; requires mesh.operator.enabled and Service routing.
    enabled: true
    ## @param events.istio.loadBalancer [string] LEAST_REQUEST prefers fewer outstanding requests; ROUND_ROBIN is also available.
    loadBalancer: LEAST_REQUEST
    ## @param events.istio.warmupSeconds [number] Ramp traffic to newly ready replicas over thirty seconds.
    warmupSeconds: 30
## @param mesh [object] Existing mesh installation and operator API authorization.
mesh:
  ## @param mesh.enabled [boolean] Enable mesh support; install Istio separately or use mesh.install in your base values.
  enabled: true
  ## @param mesh.operator [object] Inject the operator and restrict incoming traffic to configured workload principals.
  operator:
    ## @param mesh.operator.enabled [boolean] Enable native sidecars and strict mTLS; provide eventPrincipals in your deployment values.
    enabled: true
