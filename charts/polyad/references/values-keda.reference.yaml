# yaml-language-server: $schema=../values.reference.schema.json
# Add to the root-control-plane reference to install KEDA in the management release.
# With ha: true, native HPAs scale the metrics server and webhooks independently.
# Guide: ../../../docs/deployment/local-services.md#autoscale-bundled-keda-in-ha-mode
## @param keda [object] Choose bundled KEDA or observe an existing installation; avoid installing a second KEDA over the same cluster resources.
keda:
  ## @param keda.install [boolean] True installs the pinned upstream dependency in the release namespace; false uses existing KEDA.
  install: true
  ## @param keda.autoscaling [object] Native resource-metric HPAs for bundled KEDA when ha and keda.install are true; requires the Kubernetes resource metrics API
  autoscaling:
    ## @param keda.autoscaling.enabled [boolean] Autoscale enabled KEDA metrics-server and webhook components in HA mode; false keeps their upstream replica counts fixed
    enabled: true
    ## @param keda.autoscaling.metricsServer [object] Scale external-metrics serving capacity; configure API-server aggregator routing to distribute requests across replicas
    metricsServer:
      ## @param keda.autoscaling.metricsServer.enabled [boolean] Create an HPA when the bundled metrics server is enabled
      enabled: true
      ## @param keda.autoscaling.metricsServer.minReplicas [integer] Minimum metrics-server Pods; at least two for availability
      minReplicas: 2
      ## @param keda.autoscaling.metricsServer.maxReplicas [integer] Maximum metrics-server Pods; at least minReplicas and at most 32
      maxReplicas: 5
      ## @param keda.autoscaling.metricsServer.targetCPUUtilizationPercentage [integer] Target CPU utilization of the KEDA container relative to its CPU request
      targetCPUUtilizationPercentage: 70
      ## @param keda.autoscaling.metricsServer.targetMemoryUtilizationPercentage [integer, nullable] Target memory utilization of the KEDA container relative to its memory request; null disables memory scaling
      targetMemoryUtilizationPercentage: 80
    ## @param keda.autoscaling.webhooks [object] Scale admission capacity independently of external-metrics serving
    webhooks:
      ## @param keda.autoscaling.webhooks.enabled [boolean] Create an HPA when bundled admission webhooks are enabled
      enabled: true
      ## @param keda.autoscaling.webhooks.minReplicas [integer] Minimum admission-webhook Pods; at least two for availability
      minReplicas: 2
      ## @param keda.autoscaling.webhooks.maxReplicas [integer] Maximum admission-webhook Pods; at least minReplicas and at most 32
      maxReplicas: 5
      ## @param keda.autoscaling.webhooks.targetCPUUtilizationPercentage [integer] Target CPU utilization of the KEDA container relative to its CPU request
      targetCPUUtilizationPercentage: 70
      ## @param keda.autoscaling.webhooks.targetMemoryUtilizationPercentage [integer, nullable] Target memory utilization of the KEDA container relative to its memory request; null disables memory scaling
      targetMemoryUtilizationPercentage: 80
    ## @param keda.autoscaling.behavior [object] HPA stabilization and optional directional rate policies shared by KEDA components
    behavior:
      ## @param keda.autoscaling.behavior.scaleUp [object] Scale-up stabilization and optional policies
      scaleUp:
        ## @param keda.autoscaling.behavior.scaleUp.stabilizationWindowSeconds [integer] Seconds of scale-up recommendations to retain; zero responds immediately
        stabilizationWindowSeconds: 0
      ## @param keda.autoscaling.behavior.scaleDown [object] Scale-down stabilization and optional policies
      scaleDown:
        ## @param keda.autoscaling.behavior.scaleDown.stabilizationWindowSeconds [integer] Seconds of scale-down recommendations to retain; 300 limits churn after a demand spike
        stabilizationWindowSeconds: 300
  ## @param keda.observation [object] Existing KEDA identities; bundled identities are derived from rendered templates instead.
  observation:
    ## @param keda.observation.enabled [boolean] Include existing KEDA in the reserved root Graph; disable for roots without KEDA. Bundled KEDA is always included.
    enabled: true
    ## @param keda.observation.namespace [string] Namespace containing existing KEDA; ignored when install is true.
    namespace: keda
    ## @param keda.observation.deployments [array] Existing Deployment names; adjust naming overrides and remove disabled components.
    deployments: [keda-operator, keda-operator-metrics-apiserver, keda-admission-webhooks]
    ## @param keda.observation.services [array] Existing Service names; these are read-only observations, not Services created by Polyad.
    services: [keda-operator, keda-operator-metrics-apiserver, keda-admission-webhooks]

## @param kedaOperator [object] Upstream KEDA settings used when install is true; extra replicas provide failover capacity.
kedaOperator:
  ## @param kedaOperator.operator [object] KEDA reconciler configuration; leader election still selects one active leader.
  operator:
    ## @param kedaOperator.operator.replicaCount [integer] Fixed operator Pods provide a leader and standby; at least two are required in HA mode.
    replicaCount: 2
  ## @param kedaOperator.metricsServer [object] External metrics API configuration used by HPA.
  metricsServer:
    ## @param kedaOperator.metricsServer.replicaCount [integer] Initial metrics-server Pods; in HA mode the HPA owns subsequent counts.
    replicaCount: 2
  ## @param kedaOperator.webhooks [object] Admission validation for KEDA resources.
  webhooks:
    ## @param kedaOperator.webhooks.enabled [boolean] Keep admission validation enabled; disabling it also removes its observation targets.
    enabled: true
    ## @param kedaOperator.webhooks.replicaCount [integer] Initial webhook Pods; in HA mode the HPA owns subsequent counts.
    replicaCount: 2
