# yaml-language-server: $schema=../values.reference.schema.json
# Temporary connections require consent from their participating services.
# Guide: ../../../docs/apis/temporary-connections.md#service-consent.
# Provision the event Secret and workload connect/approve Roles separately.
## @param connections [object] Settings for connections.
connections:
  ## @param connections.enabled [boolean] Serve service-account authenticated temporary connections on port 8093
  enabled: true
  # Cluster permits callers and graph targets in any namespace with an owning
  # operator. Use Namespace + namespace below, or OperatorNamespace, to narrow both.
  ## @param connections.scope [string] Allowed caller and target namespaces: Cluster, OperatorNamespace or Namespace
  scope: Cluster
  ## @param connections.namespace [string] Allowed namespace when scope is Namespace; otherwise empty
  namespace: ''
  # Includes time spent waiting for consent; approvals never renew this deadline.
  ## @param connections.maxTtlSeconds [integer] Maximum connection lifetime from receipt creation, capped at 86400 seconds
  maxTtlSeconds: 3600
  ## @param connections.retentionSeconds [integer] Retain terminal receipts for retry identity and audit before cleanup
  retentionSeconds: 3600
  ## @param connections.pulses [object] Settings for connections.pulses.
  pulses:
    # Number, 0-300 seconds. Zero (default) disables this additional budget.
    # A new proposal consumes a graph lane; positive responses use endpoint lanes.
    ## @param connections.pulses.cooldownSeconds [number] Shared cooldown window in seconds; zero disables additional pulse pacing. Refused work retries from fresh state.
    cooldownSeconds: 10
    # Integer, 1-128 new pulses per lane per fixed window, shared across HA replicas.
    # Replays, refusals and revocations do not consume new pulses.
    ## @param connections.pulses.burst [integer] Maximum new pulses admitted in one cooldown window; duplicate retries do not extend the window.
    burst: 2
## @param events [object] Settings for events.
events:
  ## @param events.enabled [boolean] Serve namespace graph observations through a separate SSE Service on port 8091
  enabled: true
  # Existing Secret with a token key. For per-graph visibility use named keys
  # instead, as shown in values-authentication.reference.yaml.
  ## @param events.existingSecret [string] Existing Secret containing a token key for read-only event subscriptions
  existingSecret: polyad-events
## @param operator [object] Settings for operator.
operator:
  # Namespace bearer tokens have no home graph; scoped modes require named keys.
  ## @param operator.serviceAccess [object] Administrator ceilings inherited down the operator tree. Every request must fit both participant policies and the receiving operator; children cannot widen parent scope.
  serviceAccess:
    ## @param operator.serviceAccess.discovery [string] Disabled denies access; SameGraph stays in the home boundary; GraphTree allows related graphs in its cluster; Cluster allows that cluster; Atlas allows registered clusters. Explicit graph grants and consent still apply.
    discovery: Cluster
  ## @param operator.writeQueue [object] Bound concrete Kubernetes writes separately from coalesced reconciliation hints.
  writeQueue:
    # Independent optional budget for queued reconciliation attempts per resource.
    # Does not throttle connection cleanup, write validation or lease renewal.
    ## @param operator.writeQueue.reconciliationCooldownSeconds [number] Shared cooldown window in seconds; zero disables additional pulse pacing. Refused work retries from fresh state.
    reconciliationCooldownSeconds: 1
    ## @param operator.writeQueue.reconciliationBurst [integer] Maximum new pulses admitted in one cooldown window; duplicate retries do not extend the window.
    reconciliationBurst: 2
