# yaml-language-server: $schema=../values.reference.schema.json
# Istio sidecar transport: east and west reside on separate networks.
# Apply an adapted copy in each participating cluster, alongside its profile.
# Guide and mesh prerequisites: ../../../docs/deployment/multicluster.md
# These are reference overrides; values.yaml contains all defaults.
## @param global [object] Settings for global; configure the fields below.
global:
  ## @param global.istioNamespace [string] Istio control-plane namespace; must equal the release namespace when mesh.install is enabled
  istioNamespace: istio-system
  ## @param global.meshID [string] Shared mesh identity across participating clusters Shared across participating clusters.
  meshID: application-mesh # Shared across participating clusters.
  ## @param global.network [string] Network containing this cluster; different networks use east-west gateways The local cluster's network.
  network: east-network # The local cluster's network.
  ## @param global.multiCluster [object] Settings for global.multiCluster; configure the fields below.
  multiCluster:
    ## @param global.multiCluster.clusterName [string] Unique, stable cluster identity used by Istio and Polyad Must agree with this operator's federation identity.
    clusterName: east # Must agree with this operator's federation identity.

## @param mesh [object] Settings for mesh; configure the fields below.
mesh:
  ## @param mesh.enabled [boolean] Allow graph HTTP and service-identity authorization and generate Istio security resources
  enabled: true
  # Uses an existing Istio installation. To install the bundled control plane,
  # set true AND set global.istioNamespace to the Helm release namespace.
  ## @param mesh.install [boolean] Install the pinned upstream Istio base and istiod dependencies; requires mesh.enabled
  install: false
  ## @param mesh.multicluster [object] Settings for mesh.multicluster; configure the fields below.
  multicluster:
    ## @param mesh.multicluster.enabled [boolean] Enable the existing or bundled sidecar mesh's multicluster configuration
    enabled: true
    ## @param mesh.multicluster.eastWest [object] Settings for mesh.multicluster.eastWest; configure the fields below.
    eastWest:
      ## @param mesh.multicluster.eastWest.enabled [boolean] Install a dedicated east-west gateway for separate networks Installs the bundled gateway, even with mesh.install=false.
      enabled: true # Installs the bundled gateway, even with mesh.install=false.
      ## @param mesh.multicluster.eastWest.portName [string] Istio Gateway listener name; protocol TLS and AUTO_PASSTHROUGH mode are required by this integration
      portName: tls
      ## @param mesh.multicluster.eastWest.hosts [array] Service SNI suffixes exposed through AUTO_PASSTHROUGH Service SNI suffixes exposed through the gateway.
      hosts: ['*.local'] # Service SNI suffixes exposed through the gateway.
    ## @param mesh.multicluster.peers [array] Remote transport registrations; see docs/deployment/multicluster.md for same-network and gateway configurations
    peers:
      ## @param mesh.multicluster.peers[].name [string] Stable identity within this configuration; choose a distinct name.
      - name: west
        ## @param mesh.multicluster.peers[].mode [string] Direct uses routable remote workload addresses; Gateway permits traffic through the remote east-west gateway. Choices: Direct, Gateway.
        mode: Gateway
        ## @param mesh.multicluster.peers[].cidrs [array] Entries for mesh.multicluster.peers[].cidrs; an empty list disables these entries. Replace with the remote gateway's reachable CIDRs.
        cidrs: [192.0.2.20/32] # Replace with the remote gateway's reachable CIDRs.
        ## @param mesh.multicluster.peers[].gatewayNamespace [string] Namespace hosting the remote east-west gateway; ignored for Direct peers. Namespace of the REMOTE east-west gateway.
        gatewayNamespace: polyad # Namespace of the REMOTE east-west gateway.

## @param istioEastWestGateway [object] Upstream east-west gateway overrides; networkGateway must equal global.network and custom tunnel ports require a matching networking.istio.io/gatewayPort label
istioEastWestGateway:
  ## @param istioEastWestGateway.name [string] Stable identity within this configuration; choose a distinct name.
  name: polyad-eastwest
  ## @param istioEastWestGateway.networkGateway [string, nullable] Null retains the pinned upstream Istio profile default. Must match global.network.
  networkGateway: east-network # Must match global.network.
  ## @param istioEastWestGateway.labels [object] Settings for istioEastWestGateway.labels; configure the fields below.
  labels:
    ## @param istioEastWestGateway.labels.istio [string] Istio selector identifying the east-west gateway Pods. Required selector for the generated Istio Gateway.
    istio: polyad-eastwest # Required selector for the generated Istio Gateway.
    ## @param istioEastWestGateway.labels.networking.istio.io/gatewayPort [string] Advertised gateway TLS Service port; update it together with the Service port. Must match the tls Service port.
    networking.istio.io/gatewayPort: '15443' # Must match the tls Service port.
  ## @param istioEastWestGateway.networkGatewayPorts [object, nullable] Null retains the pinned upstream Istio profile default.
  networkGatewayPorts:
    ## @param istioEastWestGateway.networkGatewayPorts.status-port [object] Settings for istioEastWestGateway.networkGatewayPorts.status-port; configure the fields below.
    status-port:
      ## @param istioEastWestGateway.networkGatewayPorts.status-port.port [integer] Service port exposed to callers; keep matching gateway labels and peer destination ports synchronized.
      port: 15021
      ## @param istioEastWestGateway.networkGatewayPorts.status-port.targetPort [integer] Pod listener port behind the Service.
      targetPort: 15021
    ## @param istioEastWestGateway.networkGatewayPorts.tls [object] Settings for istioEastWestGateway.networkGatewayPorts.tls; configure the fields below.
    tls:
      ## @param istioEastWestGateway.networkGatewayPorts.tls.port [integer] Service port exposed to callers; keep matching gateway labels and peer destination ports synchronized. Configurable; update the gatewayPort label at the same time. Minimum: 1. Maximum: 65535.
      port: 15443 # Configurable; update the gatewayPort label at the same time.
      ## @param istioEastWestGateway.networkGatewayPorts.tls.targetPort [integer] Pod listener port behind the Service. Pod listener port; may differ from the Service port. Minimum: 1. Maximum: 65535.
      targetPort: 15443 # Pod listener port; may differ from the Service port.

# TLS and AUTO_PASSTHROUGH are required by this integration. Configure shared
# mesh trust, remote endpoint discovery and gateway reachability as in the guide.
# For same-network peers, disable eastWest and use the guide's Direct peer shape.
# This file enables transport, not cross-cluster graph placement or root execution.
