# yaml-language-server: $schema=values.reference.schema.json
# Demonstration only: all enabled HTTP listeners accept calls without credentials.
# GraphRules, namespace scopes, TTLs, body size and physical server capacity still apply.
# Guide: ../../docs/operations/api-keys.md#demonstrations-without-authentication
## @param ha [boolean] Run at least two operator replicas and permit split components or remote workers; false runs one dense operator
ha: false
## @param authentication [object] Settings for authentication; configure the fields below.
authentication:
  ## @param authentication.mode [string] Required enforces endpoint credentials; Disabled opts into an unauthenticated demo without HTTP request quotas Choices: Required, Disabled.
  mode: Disabled
  ## @param authentication.backend [string] Builtin uses Polyad's Flask hooks; FlaskHTTPAuth loads the adapter included in official operator images Choices: Builtin, FlaskHTTPAuth.
  backend: Builtin
  ## @param authentication.services [array] Service API keys with direction, Secret reference, endpoint scopes, outbound baseUrl and individual rate/concurrency limits
  services: []
  ## @param authentication.operators [array] Peer operator API keys; Inbound, Outbound or Bidirectional, with HA-wide per-key lanes
  operators: []
  ## @param authentication.storage [object] Kubernetes storage quantity for each persistent volume.
  storage:
    ## @param authentication.storage.enabled [boolean] Persist one-way key verifiers and policy records in PostgreSQL and enforce database revocation; raw tokens stay in Kubernetes Secrets
    enabled: false
## @param api [object] Settings for api; configure the fields below.
api:
  ## @param api.enabled [boolean] Serve authenticated composition requests on port 8090 through a ClusterIP Service
  enabled: true
  ## @param api.existingSecret [string] Existing Secret with a token key authorizing namespace-scoped composition submissions and audit reads
  existingSecret: ''
  ## @param api.rateLimit [object] Settings for api.rateLimit; configure the fields below.
  rateLimit:
    ## @param api.rateLimit.enabled [boolean] Enforce shared Redis/Dragonfly composition request quotas on every logical shard
    enabled: false
## @param events [object] Settings for events; configure the fields below.
events:
  ## @param events.enabled [boolean] Serve namespace graph observations through a separate SSE Service on port 8091
  enabled: true
  ## @param events.existingSecret [string] Existing Secret containing a token key for read-only event subscriptions
  existingSecret: ''
## @param metrics [object] Settings for metrics; configure the fields below.
metrics:
  ## @param metrics.enabled [boolean] Serve cached queue, write, inventory, component, backend and root-worker metrics on internal port 8092; optional families follow their feature enablement
  enabled: true
  ## @param metrics.authentication [object] Settings for metrics.authentication; configure the fields below.
  authentication:
    ## @param metrics.authentication.enabled [boolean] Require a dedicated bearer token on all metrics endpoints
    enabled: false
## @param keda [object] Settings for keda; configure the fields below.
keda:
  ## @param keda.authentication [object] Settings for keda.authentication; configure the fields below.
  authentication:
    ## @param keda.authentication.enabled [boolean] Create a namespaced TriggerAuthentication referencing the metrics token; requires authenticated metrics
    enabled: false
## @param connections [object] Settings for connections; configure the fields below.
connections:
  ## @param connections.enabled [boolean] Serve service-account authenticated temporary connections on port 8093 Enable to also demo TTL-bound edges without TokenReview or RBAC checks.
  enabled: false # Enable to also demo TTL-bound edges without TokenReview or RBAC checks.
## @param postgresql [object] Settings for postgresql; configure the fields below.
postgresql:
  ## @param postgresql.enabled [boolean] Persist graph state and tracked parameters in PostgreSQL
  enabled: false
