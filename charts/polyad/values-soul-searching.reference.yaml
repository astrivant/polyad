# yaml-language-server: $schema=values.reference.schema.json
# Guide: ../../docs/graphs/load-profiles.md
# Overlay on an existing installation. Profiles live on Graph/PolyGraph spec.throughput.
# Existing KEDA/HPA replica scaling remains independent of profile selection.
## @param capacity [object] Enable preparation for the approved profiles without changing hard graph or workload limits.
capacity:
  ## @param capacity.enabled [boolean] Permit advance-capacity helpers; a node autoscaler must be configured separately.
  enabled: true
  ## @param capacity.maxPods [integer] Fixed per-boundary operator ceiling; each graph and its approved profiles may choose smaller budgets.
  maxPods: 32
