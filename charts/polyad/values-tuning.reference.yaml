# yaml-language-server: $schema=values.reference.schema.json
# Overlay for any architecture. Cadences pause AFTER a pass, not on a fixed clock.
# Guide and full metric inventory: ../../docs/operations/performance.md and ../../docs/operations/metrics.md.
# Work graph and a parallel configuration example: ../../docs/development/write-pipeline.md#configuration.
# Worker limits apply per process/adapter/plan; pulse budgets are shared across HA replicas.
# Root-provisioned pools inherit
# the root template; Helm-installed downstream operators use their own release values.
# Upgrade the owning Helm release to roll updated settings into operator Pods.
## @param operator [object] Settings for operator.
operator:
  ## @param operator.writeQueue [object] Bound concrete Kubernetes writes separately from coalesced reconciliation hints.
  writeQueue:
    # [integer: 1-32] Mutation callbacks per approved batch; callers may lower this
    # ceiling only. For parallel transport, raise maxInFlight too. Budget callbacks
    # for the maxInFlight + maxPending admission capacity of each adapter they use.
    ## @param operator.writeQueue.plannerParallelism [integer] Maximum mutation callbacks per approved planner batch. One keeps batches serial; callers may lower this ceiling only. Parallel transport also needs maxInFlight slots and sufficient maxInFlight + maxPending admission capacity per adapter. Dependency and shared-budget checks still apply.
    plannerParallelism: 1
    # [integer: 1-32] Raise to overlap independent approved mutations; unrelated
    # object names alone are insufficient, and ordinary writes remain ordered.
    ## @param operator.writeQueue.maxInFlight [integer] Concurrent writer slots per API adapter. One preserves serial transport; higher values admit only independent writes approved by the same refreshed mutation batch. Unknown effects remain ordered.
    maxInFlight: 1
    # [integer: 1-32] Concurrent authoritative dependency checks share this cap.
    ## @param operator.writeQueue.validationWorkers [integer] Concurrent candidate validations per API adapter, shared by the background producer and dispatchers. Increasing this consumes Kubernetes read capacity.
    validationWorkers: 1
    # [integer: 1-32] Reconcile separate families concurrently under their leases.
    # This prepares decisions in parallel without granting parallel write approval.
    ## @param operator.writeQueue.reconciliationWorkers [integer] Concurrent local reconciliation attempts and remote deliveries per cluster. Same-key follow-ups and graph-family leases remain serialized; separate families can prepare decisions together.
    reconciliationWorkers: 1
    # Number, 0-300 seconds. Optional per-resource/cluster pulse window shared by
    # HA replicas. Zero keeps reconciliation unrestricted; cleanup bypasses it.
    ## @param operator.writeQueue.reconciliationCooldownSeconds [number] Shared cooldown window in seconds; zero disables additional pulse pacing. Refused work retries from fresh state.
    reconciliationCooldownSeconds: 0
    # Integer, 1-128 reconciliation starts per resource during that window.
    # This limits churn independently of the number of workers.
    ## @param operator.writeQueue.reconciliationBurst [integer] Maximum new pulses admitted in one cooldown window; duplicate retries do not extend the window.
    reconciliationBurst: 1
    # Integer, 0-128 extra admissions per adapter beyond maxInFlight writer slots.
    # Default 1 bounds stale work; 0 adds no extra capacity. Overflow returns retryable 429.
    # Increase for short bursts only: every contracted write requires a current validation before dispatch.
    # Watches and shared queues retain desired-state hints, not rejected write payloads.
    ## @param operator.writeQueue.maxPending [integer] Extra admitted writes beyond maxInFlight per adapter. One favors fresh decisions; zero removes extra capacity. Unproven independence can still cause admitted items to wait. Overflow requires fresh reconciliation.
    maxPending: 1
    # Number, 0.01-60 seconds and no greater than the window below; events wake the producer sooner.
    ## @param operator.writeQueue.validationIntervalSeconds [number] Maximum pause between validation passes; watch notifications wake the producer sooner. Must not exceed validationWindowSeconds.
    validationIntervalSeconds: 1
    # Number, 0.01-60 seconds from validation START, including its reads.
    # A fresh receipt avoids duplicate dispatch-time reads. Smaller values reduce unobserved drift.
    # Known relevant writes or watch events always invalidate it immediately.
    ## @param operator.writeQueue.validationWindowSeconds [number] Maximum reusable validation age measured from its start. Shorter windows add reads; longer windows tolerate more unobserved external drift. Events and relevant writes invalidate receipts immediately.
    validationWindowSeconds: 5
    # Integer, 1-128 candidates per background pass; spends spare window time on third/fourth/later items.
    # Does not change mutation concurrency; maxInFlight sets that separate ceiling.
    ## @param operator.writeQueue.validationBurst [integer] Maximum candidates validated per background pass; spare window time advances through later queued items without adding mutation concurrency.
    validationBurst: 8
  ## @param operator.cheeger [object] Deployment-wide ceilings for each Cheeger calculation. Policies inherit these or choose smaller budgets; prioritized search never weakens hard bounds.
  cheeger:
    # Integer, 2-4096. Each Graph/PolyGraph/ReplicaGroup boundary is measured separately.
    # Raising this alone does not make an exponential search affordable.
    ## @param operator.cheeger.maxVertices [integer] Maximum vertices per boundary; defaults to 20. Larger connected boundaries also need increased cut and time budgets.
    maxVertices: 20
    # Integer, 1-2147483647. A connected n-vertex graph takes 2^(n-1)-1 cuts.
    # Hard rules fail closed if this or the time budget prevents completion.
    ## @param operator.cheeger.maxCuts [integer] Maximum distinct cuts per calculation; 524287 covers 20 vertices. Budget exhaustion blocks constrained actions.
    maxCuts: 524287
    # Number, 0.001-300 seconds, cooperative per calculation; excludes queue wait.
    # Rule/throughput cheegerComputation settings may only reduce these ceilings.
    ## @param operator.cheeger.timeoutSeconds [number] Cooperative runtime ceiling per calculation, checked between batches. Incomplete search is never an exact constant.
    timeoutSeconds: 5
  ## @param operator.tuning [object] Settings for operator.tuning.
  tuning:
    # Number, 1-15 seconds. Refreshes local/remote inventory and remote backlog.
    # Lower values add Kubernetes reads and optional PostgreSQL persistence work.
    # Watch polyad_inventory_sample_age_seconds and polyad_cluster_inventory_sample_fresh.
    ## @param operator.tuning.rescanIntervalSeconds [number] Pause after local and root-managed remote inventory scans (1-15s); watch polyad_inventory_sample_age_seconds and polyad_cluster_inventory_sample_fresh; lower values add Kubernetes and optional state writes
    rescanIntervalSeconds: 5
    # Number, 0.1-5 seconds. Deliver at most one notification per owned shard/pass.
    # Watch inbound backlog AND API write pressure; faster dispatch can overload Kubernetes.
    ## @param operator.tuning.consumeIntervalSeconds [number] Pause after local and remote queue consumption passes (0.1-5s); watch polyad_inbound_updates and polyad_kubernetes_writes_queued before increasing dispatch pressure
    consumeIntervalSeconds: 1
    # Number, 1-5 seconds. Publishes snapshots, samples enabled database/cache connections,
    # and reports component/worker demand. This is not the Prometheus scrape interval.
    ## @param operator.tuning.metricsIntervalSeconds [number] Pause after cached metrics publication and component/worker reporting (1-5s); also controls enabled PostgreSQL and Dragonfly connection sampling, not Prometheus scrape frequency or trace export
    metricsIntervalSeconds: 5
    # Number, 1-5 seconds. Samples local stream sizes; remote queues follow rescan above.
    # Watch polyad_inbound_sample_fresh and polyad_inbound_sample_age_seconds.
    ## @param operator.tuning.backlogIntervalSeconds [number] Pause after local shared-queue samples (1-5s); watch polyad_inbound_sample_age_seconds; root-managed remote backlog is sampled by rescanIntervalSeconds
    backlogIntervalSeconds: 5

## @param metrics [object] Settings for metrics.
metrics:
  # Boolean. Enables aggregate series, including polyad_operator_interval_seconds{loop=...}.
  # PostgreSQL, HA Dragonfly and root/remote series require their features enabled separately.
  ## @param metrics.enabled [boolean] Serve cached queue, write, inventory, component, backend and root-worker metrics on internal port 8092; optional families follow their feature enablement
  enabled: true
  # Boolean. Adds hierarchy/shape/resource/workload-signal labels, including object names.
  # Keep false for aggregate monitoring; scalar KEDA routes and JSON remain available.
  ## @param metrics.graphLabels [boolean] Add per-object hierarchy, resources, shape and local/remote workload-signal Prometheus series; increases cardinality, does not gate JSON or KEDA scalar routes
  graphLabels: false
  ## @param metrics.authentication [object] Settings for metrics.authentication.
  authentication:
    # Boolean. Provision this Secret separately and configure scraper credentials.
    ## @param metrics.authentication.enabled [boolean] Require a dedicated bearer token on all metrics endpoints
    enabled: true
    ## @param metrics.authentication.existingSecret [string] Existing or ESO-managed Secret containing the metrics token
    existingSecret: polyad-metrics
    ## @param metrics.authentication.secretKey [string] Key containing the metrics bearer token
    secretKey: token

# CPU/memory HPA targets use Metrics Server, not these Prometheus series.
# Throughput/Cheeger decisions use graph policy and application reports, not loop cadence.
# Traces have independent OTEL_BSP_* batching; see values-tracing.reference.yaml.
