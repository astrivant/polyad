# yaml-language-server: $schema=values.reference.schema.json
# One dense operator in the Helm release cluster and namespace.
# Usage: helm upgrade --install polyad charts/polyad -n polyad --create-namespace \
#          -f charts/polyad/values-singular.reference.yaml
# Guide: ../../docs/deployment/deployment-profiles.md#one-dense-operator
# These are reference overrides; values.yaml contains all defaults.
## @param ha [boolean] Run at least two operator replicas and permit split components or remote workers; false runs one dense operator
ha: false

## @param operator [object] Settings for operator; configure the fields below.
operator:
  ## @param operator.logLevel [string] INFO keeps normal operational logs; DEBUG traces Polyad reconciliation and API timings, including observers. Choices: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  logLevel: INFO
  ## @param operator.replicaCount [integer, nullable] Operator replicas; null selects 1 for singular or 2 for ha Minimum: 1. Maximum: 32.
  replicaCount: 1
  ## @param operator.autoscaling [object] Settings for operator.autoscaling; configure the fields below.
  autoscaling:
    ## @param operator.autoscaling.enabled [boolean] Enable operator HPA using CPU and optional memory utilization Singular requires exactly one operator replica.
    enabled: false # Singular requires exactly one operator replica.
  ## @param operator.nodeSelector [object] Node labels selecting the operator node group, independent of workload graph placement Operator placement; graph workloads have their own placement.
  nodeSelector: {} # Operator placement; graph workloads have their own placement.
  ## @param operator.tolerations [array] Taints tolerated by the operator replicas
  tolerations: []
  ## @param operator.resources [object] Settings for operator.resources; configure the fields below.
  resources:
    ## @param operator.resources.requests [object] Settings for operator.resources.requests; configure the fields below.
    requests:
      ## @param operator.resources.requests.cpu [string] Requested operator CPU, required for CPU autoscaling
      cpu: '1'
      ## @param operator.resources.requests.memory [string] Requested operator memory, required when the HPA memory metric is enabled
      memory: 1Gi
    ## @param operator.resources.limits [object] Settings for operator.resources.limits; configure the fields below.
    limits:
      ## @param operator.resources.limits.cpu [string] CPU limit; match the request to retain Guaranteed QoS
      cpu: '1'
      ## @param operator.resources.limits.memory [string] Operator memory limit
      memory: 1Gi

## @param architecture [object] Settings for architecture; configure the fields below.
architecture:
  ## @param architecture.mode [string] Dense combines responsibilities; Distributed manages gateway, executor and telemetry ReplicaGroups inside a Graph; requires ha Choices: Dense, Distributed.
  mode: Dense
  ## @param architecture.autoscaling [boolean] Enable KEDA scaling of all component ReplicaGroup definitions
  autoscaling: false

## @param rootControlPlane [object] Settings for rootControlPlane; configure the fields below.
rootControlPlane:
  ## @param rootControlPlane.enabled [boolean] Manage registered clusters and remote execution replicas through one root scheduler; requires ha Root-managed execution requires HA.
  enabled: false # Root-managed execution requires HA.
  ## @param rootControlPlane.pools [array] Root-owned OperatorPools: unique name and registered cluster, replicas, and optional resources, nodeSelector and tolerations; requires rootControlPlane.enabled
  pools: []

# Cache replication is independent of operator replication. This example uses
# one managed cache with persistent snapshots; a storage provisioner is required.
## @param dragonfly [object] Settings for dragonfly; configure the fields below.
dragonfly:
  ## @param dragonfly.enabled [boolean] Deploy Dragonfly through the upstream operator Helm dependency
  enabled: true
  ## @param dragonfly.ha [object] Settings for dragonfly.ha; configure the fields below.
  ha:
    ## @param dragonfly.ha.enabled [boolean] Enable primary/replica replication and automatic failover
    enabled: false
  ## @param dragonfly.persistence [object] Settings for dragonfly.persistence; configure the fields below.
  persistence:
    ## @param dragonfly.persistence.enabled [boolean] Persist bundled Dragonfly snapshots on a PVC
    enabled: true
    ## @param dragonfly.persistence.size [string] Snapshot volume capacity
    size: 1Gi
    ## @param dragonfly.persistence.storageClass [string] Snapshot volume storage class; empty uses the cluster default Empty uses the cluster default.
    storageClass: '' # Empty uses the cluster default.
