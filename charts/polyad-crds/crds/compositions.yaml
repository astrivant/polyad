apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: compositions.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: Composition
    plural: compositions
    singular: composition
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: Durable composition intent compiled into owned reusable definitions and one executable root graph. Status
          carries generated names and UIDs; finalization drains the root before deleting definitions.
        properties:
          apiVersion:
            type: string
            description: Polyad API group and version.
          kind:
            type: string
            description: 'Custom resource kind: Composition.'
          metadata:
            type: object
          spec:
            type: object
            description: Immutable request receipt. Use the Flask composition endpoint or Python receipt_spec helper to produce
              this document.
            properties:
              requestId:
                type: string
                description: Stable client-generated request identity.
                minLength: 1
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
              document:
                type: string
                description: Canonical JSON CompositionRequest with rootId and ID-addressed objects. Stored as a string so
                  CEL can enforce immutability even for arbitrary nested workload manifests.
                minLength: 2
                maxLength: 1048576
            required:
            - requestId
            - document
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: Composition intent is immutable; submit a new requestId for different work.
          status:
            type: object
            description: Operator observations and audited identities; refreshed asynchronously.
            x-kubernetes-preserve-unknown-fields: true
        required:
        - spec
