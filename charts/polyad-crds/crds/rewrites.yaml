                                          values:
                                            type: array
                                            items:
                                              type: string
                                              description: One entry in values.
                                            description: Comparison values for this requirement. In and NotIn use
                                              a nonempty set; Exists and DoesNotExist use no values; Gt and Lt use
                                              one integer encoded as a string.
                                        required:
                                        - key
                                        - operator
                                        description: One entry in matchFields.
                                      description: Node-field requirements combined with AND within this term.
                                  description: One entry in nodeSelectorTerms.
