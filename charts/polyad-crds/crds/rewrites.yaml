                      description: One entry in connections.
                    description: Declarative data-flow edges, including cycles and self-loops. These edges neither
                      block admission nor configure network transport.
                  mode:
                    type: string
                    enum:
                    - finite
                    - persistent
                    default: finite
                    description: Finite graphs report completion when finite work completes and resource nodes are
                      ready. Persistent graphs remain active until stopped or deleted. Graphs containing daemons
                      must be persistent.
                  slots:
                    type: integer
                    minimum: 1
                    default: 64
                    description: Total admission-slot capacity for this boundary. Node reservations govern admission;
                      Kubernetes independently schedules actual CPU, memory and device requests.
                  shutdownPolicy:
                    type: string
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    maxLength: 63
                    minLength: 1
                    description: Name of a ShutdownPolicy in the same namespace, specifying a runtime limit and
                      termination grace period.
                  suspend:
                    type: boolean
                    default: false
                    description: Stop admitting work and drain owned execution while true. Clearing suspension permits
                      fresh execution; this is not an application checkpoint request.
                  templateOnly:
                    type: boolean
                    default: false
                    description: Keep this boundary as an inert reusable definition. A parent graph creates an owned
                      executable copy with this flag cleared.
