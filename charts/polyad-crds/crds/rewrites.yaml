                        default: true
                        description: Keep these constraints in every descendant pod. False allows a more specific
                          workload or graph placement to replace these defaults; an enforced ancestor cannot be
                          relaxed.
                    description: Placement defaults or enforced constraints copied to descendant pod templates.
