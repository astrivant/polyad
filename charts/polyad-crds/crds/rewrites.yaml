apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rewrites.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: Rewrite
    plural: rewrites
    singular: rewrite
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: 'API group and version of this custom resource: polyad.astrivant.com/v1alpha1.'
          kind:
            type: string
            description: 'Custom resource kind: Rewrite.'
          metadata:
            type: object
            properties: {}
          spec:
            type: object
            properties:
              graph:
                type: string
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                maxLength: 63
                minLength: 1
                description: Name of the target graph in the same namespace.
              kind:
                type: string
                enum:
                - Graph
                - PolyGraph
                default: Graph
                description: Kind of the graph targeted by this rewrite.
              expectedGeneration:
                type: integer
                minimum: 1
                description: Required metadata.generation of the target graph before applying the rewrite. A mismatch
                  rejects the change unless this rewrite already has a committed receipt.
              topology:
                type: object
                properties:
                  traffic:
                    type: array
                    maxItems: 16
                    items:
                      type: object
                      description: Split mesh HTTP requests to one Service among downstream node subtrees.
                      properties:
                        name:
                          type: string
                          description: Unique route name within this graph.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        source:
                          type: string
                          description: Local caller node; selects its descendant mesh pods.
                        service:
                          type: string
                          description: Existing Service in the graph namespace covering all destination pods.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        port:
                          type: integer
                          description: Service port carrying HTTP, HTTP/2 or gRPC traffic.
                          minimum: 1
                          maximum: 65535
                        destinations:
                          type: array
                          items:
                            type: object
                            description: Select a downstream node subtree and bound its share of requests.
                            properties:
                              target:
                                type: string
                                description: Downstream node path, such as workers/replica-0/entrypoint, whose pods form
                                  a subset.
                                minLength: 1
                                maxLength: 2047
                                pattern: ^[a-z0-9-]+(/[a-z0-9-]+)*$
                              weight:
                                type: integer
                                description: Configured percentage of new HTTP requests.
                                minimum: 0
                                maximum: 100
                              minWeight:
                                type: integer
                                description: Smallest percentage allowed by automatic adjustment.
                                minimum: 0
                                maximum: 100
                              maxWeight:
                                type: integer
                                description: Largest percentage allowed by automatic adjustment.
                                minimum: 0
                                maximum: 100
                            required:
                            - target
                            - weight
                          description: Distinct downstream subsets whose percentages sum to 100.
                          minItems: 2
                          maxItems: 16
                        resilience:
                          type: object
                          description: Bound proxy-level failures without changing application traffic weights.
                          properties:
                            outlierDetection:
                              type: boolean
                              description: Eject endpoints that repeatedly return server errors.
                            consecutive5xxErrors:
                              type: integer
                              description: Consecutive server errors required before ejection.
                              minimum: 1
                              maximum: 100
                            intervalSeconds:
                              type: integer
                              description: Endpoint health analysis interval.
                              minimum: 1
                              maximum: 300
                            baseEjectionSeconds:
                              type: integer
                              description: Minimum endpoint ejection duration.
                              minimum: 1
                              maximum: 3600
                            maxEjectionPercent:
                              type: integer
                              description: Maximum percentage of endpoints that may be ejected.
                              minimum: 0
                              maximum: 100
                            maxConnections:
                              type: integer
                              description: TCP connection ceiling; zero leaves Istio's default.
                              minimum: 0
                              maximum: 1048576
                            maxPendingRequests:
                              type: integer
                              description: Pending HTTP request ceiling; zero leaves Istio's default.
                              minimum: 0
                              maximum: 1048576
                            maxRequests:
                              type: integer
                              description: Active HTTP request ceiling; zero leaves Istio's default.
                              minimum: 0
                              maximum: 1048576
                            retries:
                              type: integer
                              description: Retry attempts for failures selected by retryOn; zero disables retries.
                              minimum: 0
                              maximum: 10
                            perTryTimeoutSeconds:
                              type: integer
                              description: Optional timeout for an individual retry attempt.
                              minimum: 0
                              maximum: 300
                            timeoutSeconds:
                              type: integer
                              description: Optional total request timeout; zero preserves Istio's default.
                              minimum: 0
                              maximum: 3600
                            retryOn:
                              type: string
                              enum:
                              - connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes
                              description: Istio retry conditions used when retries are enabled.
                          nullable: true
                      required:
                      - name
                      - source
                      - service
                      - port
                      - destinations
                  throughput:
                    type: object
                    description: Observe or adapt topology using empirical throughput targets within hard structural rules.
                    properties:
                      unit:
                        type: string
                        description: Application work unit shared by offered and completed rates, such as records.
                        minLength: 1
                        maxLength: 64
                      tiers:
                        type: array
                        items:
                          type: object
                          description: Associate measured application demand with an independently calibrated expansion
                            target.
                          properties:
                            threshold:
                              type: number
                              description: Inclusive threshold in the selected demand signal's unit; defaults to offered
                                work per second.
                              minimum: 0
                            cheeger:
                              type: object
                              description: Bound exact edge expansion on the simple undirected projection. A cut's ratio
                                is its crossing-edge count divided by its smaller side's vertex count. The constant is the
                                minimum ratio over all cuts. Raising the minimum rejects severe structural bottlenecks;
                                lowering the maximum requires a sparse cut. Throughput policies can select these structural
                                targets using application-reported rates; the constant itself is edge expansion.
                              properties:
                                minimum:
                                  type: number
                                  nullable: true
                                  description: Inclusive nonnegative minimum; raise it to reject sparse bottlenecks, or
                                    omit for no lower bound.
                                  minimum: 0
                                maximum:
                                  type: number
                                  nullable: true
                                  description: Inclusive nonnegative maximum; lower it to require a sparse cut, or omit
                                    for no upper bound.
                                  minimum: 0
                              x-kubernetes-validations:
                              - rule: (has(self.minimum) && self.minimum != null) || (has(self.maximum) && self.maximum
                                  != null)
                                message: A throughput tier requires at least one Cheeger bound.
                              - rule: '!has(self.minimum) || self.minimum == null || !has(self.maximum) || self.maximum
                                  == null || self.minimum <= self.maximum'
                                message: Cheeger minimum must not exceed maximum.
                            trafficWeights:
                              type: array
                              items:
                                type: object
                                description: Approve a calibrated traffic distribution for one application demand tier.
                                properties:
                                  route:
                                    type: string
                                    description: Name of the configured traffic route.
                                  weights:
                                    type: object
                                    additionalProperties:
                                      type: integer
                                      minimum: 0
                                      maximum: 100
                                    description: Complete target-to-percentage mapping for that route.
                                    minProperties: 2
                                    maxProperties: 16
                                required:
                                - route
                                - weights
                              description: Optional calibrated request percentages for configured routes.
                              maxItems: 16
                            capacity:
                              type: object
                              description: Select forecast depth and reservation budget without changing workload resource
                                requests.
                              properties:
                                lookaheadStages:
                                  type: integer
                                  description: Missing dependency layers to prepare, bounded by the approved ceiling.
                                  minimum: 1
                                  maximum: 32
                                maxPods:
                                  type: integer
                                  description: Maximum outstanding forecast Pods, also bounded by operator configuration.
                                  minimum: 1
                                  maximum: 1024
                              required:
                              - lookaheadStages
                              - maxPods
                              nullable: true
                          required:
                          - threshold
                          - cheeger
                        description: Strictly increasing demand thresholds; highest matching tier wins.
                        minItems: 1
                        maxItems: 16
                      layouts:
                        type: array
                        items:
                          type: object
                          description: Approve one complete set of boundary-local data-flow connections.
                          properties:
                            name:
                              type: string
                              description: Stable administrator-selected layout name.
                              minLength: 1
                              maxLength: 63
                            connections:
                              type: array
                              items:
                                type: object
                                description: Declare a data-flow edge, which may cycle without blocking admission.
                                properties:
                                  source:
                                    type: string
                                    description: Node emitting data on this connection.
                                  target:
                                    type: string
                                    description: Node receiving data on this connection.
                                  ports:
                                    type: array
                                    items:
                                      type: object
                                      description: Select a transport port on the destination workload.
                                      properties:
                                        port:
                                          type: integer
                                          description: Destination transport port.
                                          minimum: 1
                                          maximum: 65535
                                        protocol:
                                          type: string
                                          enum:
                                          - TCP
                                          - UDP
                                          - SCTP
                                          description: Transport protocol.
                                      required:
                                      - port
                                    description: Optional transport grants when graph networking is enabled.
                                required:
                                - source
                                - target
                              description: Complete replacement connections; nodes and admission stay unchanged.
                              maxItems: 380
                          required:
                          - name
                          - connections
                        description: Approved alternatives, tried in declaration order.
                        maxItems: 8
                      mode:
                        type: string
                        enum:
                        - Observe
                        - Adapt
                        description: Observe reports recommendations; Adapt may apply approved parameters.
                      sampleMaxAgeSeconds:
                        type: integer
                        description: Maximum age and gap between usable samples.
                        minimum: 1
                        maximum: 3600
                      sustainedSeconds:
                        type: integer
                        description: Continuous trigger duration required before selecting a profile.
                        minimum: 1
                        maximum: 86400
                      minSamples:
                        type: integer
                        description: Distinct reports required during the sustained trigger.
                        minimum: 2
                        maximum: 1000
                      shortfallRatio:
                        type: number
                        description: Completed/offered ratio below which demanded throughput is unmet.
                        minimum: 0
                        exclusiveMinimum: true
                        maximum: 1
                      cooldownSeconds:
                        type: integer
                        description: Minimum time between successful profile adjustments.
                        minimum: 1
                        maximum: 86400
                      maxChangesPerHour:
                        type: integer
                        description: Maximum successful changes in a rolling hour.
                        minimum: 1
                        maximum: 60
                      cheegerComputation:
                        type: object
                        description: Budget exact search and optionally try certified quotient reductions first.
                        properties:
                          maxVertices:
                            type: integer
                            nullable: true
                            description: Boundary vertex cap; null inherits the operator ceiling, normally 20.
                            minimum: 2
                            maximum: 4096
                          maxCuts:
                            type: integer
                            nullable: true
                            description: Unique cut evaluation budget; null inherits the operator ceiling, normally 524287.
                            minimum: 1
                            maximum: 2147483647
                          timeoutSeconds:
                            type: number
                            nullable: true
                            description: Cooperative time budget; null inherits the operator ceiling, normally five seconds.
                            minimum: 0.001
                            maximum: 300
                          priorityCuts:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                                minLength: 1
                                maxLength: 253
                              minItems: 1
                              maxItems: 4096
                              uniqueItems: true
                            description: Ordered vertex subsets to examine before exhaustive search; complements are equivalent.
                            maxItems: 64
                          reduction:
                            type: object
                            description: Configure the opt-in, certificate-preserving Cheeger reduction tiers.
                            properties:
                              enabled:
                                type: boolean
                                description: Request reduced search before exact enumeration. The operator must also enable
                                  it.
                              maxVertices:
                                type: integer
                                description: Largest boundary admitted to dense spectral reduction.
                                minimum: 2
                                maximum: 4096
                              components:
                                type: integer
                                description: Nontrivial Laplacian eigenvectors retained by fresh spectral reduction.
                                minimum: 1
                                maximum: 64
                              supernodes:
                                type: integer
                                description: Maximum quotient vertices searched before exact enumeration.
                                minimum: 2
                                maximum: 64
                              cache:
                                type: boolean
                                description: Reevaluate a recently cached quotient partition on the current graph first.
                              cacheEntries:
                                type: integer
                                description: Maximum process-local partitions retained by the operator.
                                minimum: 1
                                maximum: 4096
                              maxEdgeChurn:
                                type: number
                                description: Largest changed-edge fraction eligible for cached partition reuse.
                                minimum: 0
                                maximum: 1
                              strategy:
                                type: string
                                enum:
                                - AdaptivePID
                                - CacheFirst
                                description: Preferred scheduler; either operator or policy can select legacy CacheFirst.
                              targetSeconds:
                                type: number
                                description: Soft mean computation-time goal; the operator value governs when administrator
                                  limits are supplied.
                                minimum: 1.0e-06
                                maximum: 300
                              feedback:
                                type: string
                                enum:
                                - CertificateGap
                                - ComputationTime
                                description: Adaptive PID objective; the administrator chooses the effective signal.
                              targetRelativeError:
                                type: number
                                description: Soft certified relative-error objective; 0.25 means 25 percent, not a hard
                                  accuracy guarantee.
                                minimum: 1.0e-06
                                maximum: 100
                      maxWeightStep:
                        type: integer
                        description: Maximum percentage-point change per destination in one automatic adjustment.
                        minimum: 1
                        maximum: 100
                      trafficMode:
                        type: string
                        enum:
                        - Tiers
                        - Headroom
                        description: Use calibrated tier percentages or measured per-destination sustainable capacity.
                      trigger:
                        type: string
                        enum:
                        - Shortfall
                        - Demand
                        description: React to sustained shortfall or prepare on sustained positive selected demand.
                      capacityCeiling:
                        type: object
                        description: Select forecast depth and reservation budget without changing workload resource requests.
                        properties:
                          lookaheadStages:
                            type: integer
                            description: Missing dependency layers to prepare, bounded by the approved ceiling.
                            minimum: 1
                            maximum: 32
                          maxPods:
                            type: integer
                            description: Maximum outstanding forecast Pods, also bounded by operator configuration.
                            minimum: 1
                            maximum: 1024
                        required:
                        - lookaheadStages
                        - maxPods
                        nullable: true
                      demand:
                        type: object
                        description: Identify an administrator-selected application signal for profile thresholds.
                        properties:
                          name:
                            type: string
                            description: Exact signal name the authorized reporter must supply.
                            minLength: 1
                            maxLength: 64
                          unit:
                            type: string
                            description: Exact measurement unit, such as jobs, sessions or bytes-per-second.
                            minLength: 1
                            maxLength: 64
                        required:
                        - name
                        - unit
                        nullable: true
                    required:
                    - unit
                    - tiers
                  capacity:
                    type: object
                    description: Forecast missing execution nodes before their admission dependencies finish.
                    properties:
                      backend:
                        type: string
                        enum:
                        - Auto
                        - ProvisioningRequest
                        - Placeholders
                        description: Preferred capacity mechanism.
                      lookaheadStages:
                        type: integer
                        description: Number of uncreated dependency layers to forecast at each boundary.
                        minimum: 1
                        maximum: 32
                      maxPods:
                        type: integer
                        description: Maximum forecast Pods held by this boundary at once.
                        minimum: 1
                        maximum: 1024
                      timeoutSeconds:
                        type: integer
                        description: Maximum time to hold an unconsumed request, including gate waits.
                        minimum: 10
                        maximum: 86400
                      provisioningClassName:
                        type: string
                        description: Autoscaler provisioning class; empty uses the operator default.
                      parameters:
                        type: object
                        additionalProperties:
                          type: string
                          maxLength: 255
                        description: Provider-specific ProvisioningRequest parameters.
                        maxProperties: 100
                      retryToken:
                        type: string
                        description: Change this value to retry a failed or expired plan.
                  network:
                    type: object
                    description: Isolate a graph subtree and intersect its exceptions with inherited constraints.
                    properties:
                      scope:
                        type: string
                        enum:
                        - Boundary
                        - Subtree
                        description: Apply to direct workloads or propagate to all descendant workloads.
                      ingress:
                        type: array
                        items:
                          type: object
                          description: Allow one peer on selected ports, with optional inbound mesh authorization.
                          properties:
                            peer:
                              type: object
                              description: Select peers in an explicit namespace, optionally by graph or pod labels.
                              properties:
                                namespace:
                                  type: string
                                  nullable: true
                                  description: Peer namespace; omitted means this graph's namespace.
                                graph:
                                  type: string
                                  nullable: true
                                  description: Named graph instance; omitted with node selects a node in this boundary.
                                kind:
                                  type: string
                                  enum:
                                  - Graph
                                  - PolyGraph
                                  - ReplicaGroup
                                  description: Kind of the referenced graph instance.
                                node:
                                  type: string
                                  nullable: true
                                  description: Node and its descendants inside the selected graph.
                                podLabels:
                                  type: object
                                  additionalProperties:
                                    type: string
                                  description: Additional exact pod-label matches, combined with graph selection.
                                cluster:
                                  type: string
                                  nullable: true
                                  description: Registered remote transport; cannot be combined with local pod or namespace
                                    selectors.
                                  maxLength: 63
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            ports:
                              type: array
                              items:
                                type: object
                                description: Select a transport port on the destination workload.
                                properties:
                                  port:
                                    type: integer
                                    description: Destination transport port.
                                    minimum: 1
                                    maximum: 65535
                                  protocol:
                                    type: string
                                    enum:
                                    - TCP
                                    - UDP
                                    - SCTP
                                    description: Transport protocol.
                                required:
                                - port
                              description: Destination ports; empty means every transport port.
                            node:
                              type: string
                              nullable: true
                              description: Local node subtree to which this rule applies; omitted selects every local node.
                            principals:
                              type: array
                              items:
                                type: string
                              description: Exact Istio source identities such as cluster.local/ns/team/sa/client.
                            methods:
                              type: array
                              items:
                                type: string
                              description: Allowed inbound HTTP methods; empty leaves methods unconstrained.
                            paths:
                              type: array
                              items:
                                type: string
                              description: Exact inbound HTTP paths; empty leaves paths unconstrained.
                          required:
                          - peer
                        description: Additional allowed inbound traffic.
                      egress:
                        type: array
                        items:
                          type: object
                          description: Allow one peer on selected ports, with optional inbound mesh authorization.
                          properties:
                            peer:
                              type: object
                              description: Select peers in an explicit namespace, optionally by graph or pod labels.
                              properties:
                                namespace:
                                  type: string
                                  nullable: true
                                  description: Peer namespace; omitted means this graph's namespace.
                                graph:
                                  type: string
                                  nullable: true
                                  description: Named graph instance; omitted with node selects a node in this boundary.
                                kind:
                                  type: string
                                  enum:
                                  - Graph
                                  - PolyGraph
                                  - ReplicaGroup
                                  description: Kind of the referenced graph instance.
                                node:
                                  type: string
                                  nullable: true
                                  description: Node and its descendants inside the selected graph.
                                podLabels:
                                  type: object
                                  additionalProperties:
                                    type: string
                                  description: Additional exact pod-label matches, combined with graph selection.
                                cluster:
                                  type: string
                                  nullable: true
                                  description: Registered remote transport; cannot be combined with local pod or namespace
                                    selectors.
                                  maxLength: 63
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            ports:
                              type: array
                              items:
                                type: object
                                description: Select a transport port on the destination workload.
                                properties:
                                  port:
                                    type: integer
                                    description: Destination transport port.
                                    minimum: 1
                                    maximum: 65535
                                  protocol:
                                    type: string
                                    enum:
                                    - TCP
                                    - UDP
                                    - SCTP
                                    description: Transport protocol.
                                required:
                                - port
                              description: Destination ports; empty means every transport port.
                            node:
                              type: string
                              nullable: true
                              description: Local node subtree to which this rule applies; omitted selects every local node.
                            principals:
                              type: array
                              items:
                                type: string
                              description: Exact Istio source identities such as cluster.local/ns/team/sa/client.
                            methods:
                              type: array
                              items:
                                type: string
                              description: Allowed inbound HTTP methods; empty leaves methods unconstrained.
                            paths:
                              type: array
                              items:
                                type: string
                              description: Exact inbound HTTP paths; empty leaves paths unconstrained.
                          required:
                          - peer
                        description: Additional allowed outbound traffic.
                      isolateIngress:
                        type: boolean
                        description: Restrict incoming connections.
                      isolateEgress:
                        type: boolean
                        description: Restrict outgoing connections.
                      allowWithin:
                        type: boolean
                        description: Allow traffic between all workloads inside this boundary.
                      allowDNS:
                        type: boolean
                        description: Allow TCP/UDP 53 to kube-system pods labeled k8s-app=kube-dns.
                      mesh:
                        type: boolean
                        description: Require Istio injection, strict mutual TLS and inbound authorization.
                  rules:
                    type: array
                    description: Additional GraphRule names in this namespace, inherited by descendants. Namespace-wide
                      rules always apply.
                    maxItems: 32
                    x-kubernetes-list-type: set
                    items:
                      type: string
                      description: GraphRule name.
                      maxLength: 253
                      minLength: 1
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster:
                          type: string
                          nullable: true
                          description: Registered destination cluster; omitted keeps the child in this cluster.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        id:
                          type: string
                          description: Optional request-local node identity retained on generated manifests for
                            auditing.
                          minLength: 1
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                        name:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Unique name of this node within its graph. Used by dependencies, connections
                            and lifecycle signals.
                        kind:
                          type: string
                          enum:
                          - Workload
                          - Daemon
                          - Resource
                          - Graph
                          - PolyGraph
                          - ReplicaGroup
                          description: Kind of the definition referenced by this node; determines whether execution
                            uses a Job, Deployment, StatefulSet, resource or nested graph boundary.
                        ref:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Name of the reusable definition in the same namespace. Nested Graph and PolyGraph definitions must set templateOnly to true.
                        requires:
                          type: array
                          items:
                            type: object
                            properties:
                              node:
                                type: string
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                maxLength: 63
                                minLength: 1
                                description: Name of the upstream node within this graph.
                              condition:
                                type: string
                                enum:
                                - started
                                - ready
                                - completed
                                default: completed
                                description: 'Observation required before admission: started means the execution
                                  resource exists; ready means it exposes readiness; completed means finite execution
                                  succeeded. Daemons and resources cannot satisfy completed. Readiness loss does
                                  not cancel already-admitted consumers.'
                            required:
                            - node
                            description: One entry in requires.
                          description: Lifecycle prerequisites that must all hold before initial admission. Admission
                            dependencies must be acyclic; use connections for cyclic data flow.
                        gate:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Name of a Gate definition in the same namespace. Admission requires its expression
                            to evaluate to true; false or unknown blocks admission.
                        slots:
                          type: integer
                          minimum: 1
                          default: 1
                          description: Admission slots reserved by this node until finite work completes or execution
                            is removed. Must fit the containing graph; this is not a CPU request.
                      required:
                      - name
                      - kind
                      - ref
                      description: One entry in nodes.
                    x-kubernetes-list-type: map
                    x-kubernetes-list-map-keys:
                    - name
                    description: Graph membership in deterministic admission order. Names are unique within this
                      boundary; definitions are resolved in the same namespace.
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        ports:
                          type: array
                          description: Destination transport grants; omitted connections remain data-flow declarations.
                          items:
                            type: object
                            description: Select a transport port on the destination workload.
                            properties:
                              port:
                                type: integer
                                description: Destination transport port.
                                minimum: 1
                                maximum: 65535
                              protocol:
                                type: string
                                enum:
                                - TCP
                                - UDP
                                - SCTP
                                description: Transport protocol.
                            required:
                            - port
                        source:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
                          description: Name of the source node for this data-flow connection.
                        target:
                          type: string
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          maxLength: 63
                          minLength: 1
