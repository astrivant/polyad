                          across graph, definition and pod scopes; preferences are combined.
                      tolerations:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Taint key to match. An empty key requires operator Exists and matches
                                all keys.
                            operator:
                              type: string
                              enum:
                              - Exists
                              - Equal
                              description: 'Taint comparison: Equal matches key and value; Exists matches the key
                                regardless of value. Kubernetes defaults an omitted operator to Equal.'
                            value:
                              type: string
                              description: Taint value to match when operator is Equal. Omit or leave empty when
                                operator is Exists.
                            effect:
                              type: string
                              enum:
                              - ''
                              - NoSchedule
                              - PreferNoSchedule
                              - NoExecute
                              description: 'Taint effect to match. An empty effect matches all effects: NoSchedule,
                                PreferNoSchedule and NoExecute.'
                            tolerationSeconds:
                              type: integer
                              format: int64
                              minimum: 0
                              description: Seconds a pod may remain bound after a matching NoExecute taint. Omission
                                tolerates that taint indefinitely; zero requests immediate eviction.
                          description: One entry in tolerations.
                        description: Kubernetes taints tolerated by descendant pods, deduplicated across scopes.
                          Tolerations allow placement on tainted nodes; they do not select or guarantee a node.
                      enforce:
