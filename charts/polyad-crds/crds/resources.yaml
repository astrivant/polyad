apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resources.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: Resource
    plural: resources
    singular: resource
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: 'API group and version of this custom resource: polyad.astrivant.com/v1alpha1.'
          kind:
            type: string
            description: 'Custom resource kind: Resource.'
          metadata:
            type: object
            properties: {}
          spec:
            type: object
            properties:
              manifest:
                type: object
                properties:
                  apiVersion:
                    type: string
                    enum:
                    - v1
                    - autoscaling.k8s.io/v1
                    description: API version of the owned resource. VPA manifests require the opt-in operator compatibility feature.
                  kind:
                    type: string
                    enum:
                    - Service
                    - ConfigMap
                    - PersistentVolumeClaim
                    - VerticalPodAutoscaler
                    description: 'Kind of namespaced resource to create: Service, ConfigMap, PersistentVolumeClaim or VerticalPodAutoscaler.'
                  spec:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    description: Native resource spec. VPA targetRef.name may reference ${nodes.NAME.name}; resourcePolicy containerPolicies
                      retain and validate minAllowed and maxAllowed CPU/memory quantities before creation.
                  data:
                    type: object
                    additionalProperties:
                      type: string
                      description: Value for an individual key in data.
                    description: UTF-8 string data for a ConfigMap. Keys are preserved in the graph-owned resource.
                  binaryData:
                    type: object
                    additionalProperties:
                      type: string
                      description: Value for an individual key in binaryData.
                    description: Base64-encoded binary values for a ConfigMap.
                  immutable:
                    type: boolean
                    description: Make ConfigMap data immutable when true. Intended for ConfigMap manifests.
                required:
                - apiVersion
                - kind
                description: Native manifest for an owned core resource or, when enabled, autoscaling.k8s.io/v1 VerticalPodAutoscaler.
                  The operator supplies identity and ownership. String values may reference generated names with ${nodes.NAME.name}.
            required:
            - manifest
            description: Desired configuration for a graph-owned namespaced resource. Optional VPA compatibility validates
              bounds and projects them into the target application's environment; the external VPA controller remains responsible for resizing.
          status:
            type: object
            default: {}
            x-kubernetes-preserve-unknown-fields: true
            description: Reserved operator observation subresource. This reusable definition does not execute independently
              or currently publish lifecycle status.
        required:
        - spec
        description: Define a reusable namespaced core resource or optional VerticalPodAutoscaler owned by a graph.
          The operator generates its name and ownership metadata and waits for deletion during graph cleanup.
