apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remotescales.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: RemoteScale
    plural: remotescales
    singular: remotescale
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
        labelSelectorPath: .status.labelSelector
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - cluster
            - replicas
            - target
            properties:
              cluster:
                type: string
                minLength: 1
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: cluster is immutable
              replicas:
                type: integer
                minimum: 0
                maximum: 256
                default: 1
              target:
                type: object
                required:
                - name
                - uid
                - generation
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 63
                  uid:
                    type: string
                    minLength: 1
                  generation:
                    type: integer
                    minimum: 1
                    description: Locally approved target spec generation; local edits invalidate the request.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: target identity and approved generation are immutable
          status:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 0
              readyReplicas:
                type: integer
                minimum: 0
              labelSelector:
                type: string
              observedGeneration:
                type: integer
              phase:
                type: string
              message:
                type: string
              observedAt:
                type: string
                format: date-time
