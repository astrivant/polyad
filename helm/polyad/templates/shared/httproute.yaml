{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if .Values.api.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-polyad-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      {{- if .Values.api.gateway.create }}
      name: {{ .Release.Name }}-polyad-api
      {{- else }}
      name: {{ .Values.api.gateway.name | quote }}
      {{- with .Values.api.gateway.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- end }}
      sectionName: {{ .Values.api.gateway.sectionName | quote }}
  {{- with .Values.api.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/compositions
        - path:
            type: PathPrefix
            value: /v1/activations
        - path:
            type: Exact
            value: /v1/throughput
        - path:
            type: Exact
            value: /openapi.json
      backendRefs:
        - name: {{ .Release.Name }}-polyad-api
          port: 8090
{{- end }}
{{- end -}}
