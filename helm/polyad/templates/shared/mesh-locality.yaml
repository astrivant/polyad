{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if .Values.mesh.multicluster.routing.enabled }}
{{- if not (and .Values.mesh.operator.enabled .Values.mesh.multicluster.enabled) }}{{ fail "multicluster routing requires mesh.operator and mesh.multicluster" }}{{ end }}
{{- if and (eq .Values.mesh.multicluster.routing.mode "Failover") (not .Values.mesh.multicluster.routing.failover) }}{{ fail "Failover routing requires at least one region mapping" }}{{ end }}
{{- if and (eq .Values.mesh.multicluster.routing.mode "Distributed") (not .Values.mesh.multicluster.routing.distribute) }}{{ fail "Distributed routing requires at least one locality mapping" }}{{ end }}
{{- $services := list -}}
{{- if .Values.api.enabled }}{{ $services = append $services (printf "%s-polyad-api" .Release.Name) }}{{ end -}}
{{- if and .Values.events.enabled (not .Values.events.istio.enabled) }}{{ $services = append $services (printf "%s-polyad-events" .Release.Name) }}{{ end -}}
{{- if .Values.metrics.enabled }}{{ $services = append $services (printf "%s-polyad-metrics" .Release.Name) }}{{ end -}}
{{- if .Values.connections.enabled }}{{ $services = append $services (printf "%s-polyad-connections" .Release.Name) }}{{ end -}}
{{- range $service := $services }}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $service }}-locality
spec:
  host: {{ printf "%s.%s.svc.cluster.local" $service $.Release.Namespace | quote }}
  exportTo: ['.']
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: {{ $.Values.mesh.multicluster.routing.consecutive5xxErrors }}
      interval: {{ printf "%vs" $.Values.mesh.multicluster.routing.intervalSeconds | quote }}
      baseEjectionTime: {{ printf "%vs" $.Values.mesh.multicluster.routing.baseEjectionSeconds | quote }}
      maxEjectionPercent: {{ $.Values.mesh.multicluster.routing.maxEjectionPercent }}
    loadBalancer:
      localityLbSetting:
        enabled: true
        {{- if eq $.Values.mesh.multicluster.routing.mode "Failover" }}
        failover:
          {{- toYaml $.Values.mesh.multicluster.routing.failover | nindent 10 }}
        {{- else if eq $.Values.mesh.multicluster.routing.mode "Distributed" }}
        distribute:
          {{- toYaml $.Values.mesh.multicluster.routing.distribute | nindent 10 }}
        {{- end }}
---
{{- end }}
{{- end }}
{{- end -}}
