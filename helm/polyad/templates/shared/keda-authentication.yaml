{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if .Values.keda.authentication.enabled }}
{{- if not (and .Values.metrics.enabled .Values.metrics.authentication.enabled) }}{{ fail "KEDA authentication requires metrics.enabled and metrics.authentication.enabled" }}{{ end }}
{{- if hasKey .Values._authEndpoints "metrics" }}
{{- $secret := default (printf "%s-polyad-metrics" .Release.Name) .Values.metrics.authentication.existingSecret }}
{{- $matched := false }}
{{- range $group, $keys := pick .Values.authentication "services" "operators" }}
{{- range $keys }}
{{- if and (has "metrics" (default (list) .endpoints)) (eq .existingSecret $secret) (eq (default "token" .secretKey) $.Values.metrics.authentication.secretKey) }}
{{- $matched = true }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $matched }}{{ fail "KEDA's metrics Secret must reference a configured inbound key with the metrics scope" }}{{ end }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ default (printf "%s-polyad-metrics" .Release.Name) .Values.keda.authentication.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  secretTargetRef:
    - parameter: token
      name: {{ default (printf "%s-polyad-metrics" .Release.Name) .Values.metrics.authentication.existingSecret | quote }}
      key: {{ .Values.metrics.authentication.secretKey | quote }}
{{- end }}
{{- end -}}
