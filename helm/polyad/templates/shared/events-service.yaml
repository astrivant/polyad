{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if .Values.events.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-polyad-events
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: polyad
    polyad.astrivant.com/component: {{ ternary "gateway" "dense" (eq .Values.architecture.mode "Distributed") }}
  ports:
    - name: http-events
      appProtocol: http
      port: 8091
      targetPort: events
{{- end }}
{{- end -}}
