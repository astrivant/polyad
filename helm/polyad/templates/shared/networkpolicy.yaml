{{- $ := merge (dict "Values" (include "polyad.profileValues" . | fromJson)) (omit . "Values") -}}
{{- with $ -}}
{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.apiServerCIDRs }}{{ fail "networkPolicy.apiServerCIDRs must identify the cluster API endpoint" }}{{ end }}
{{- if and (or (not .Values.dragonfly.enabled) .Values.dragonfly.existingSecret) (not .Values.networkPolicy.extraEgress) }}
{{- fail "an external cache requires networkPolicy.extraEgress" }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.managed) (not .Values.networkPolicy.extraEgress) }}
{{- fail "an external PostgreSQL database requires networkPolicy.extraEgress" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-polyad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: polyad
  policyTypes: [Ingress, Egress]
  ingress:{{ if not (or .Values.networkPolicy.compositionPeers .Values.networkPolicy.eventPeers .Values.networkPolicy.healthPeers .Values.networkPolicy.metricsPeers .Values.mesh.ingress.enabled .Values.mesh.ingress.gatewayAPI.enabled .Values.connections.enabled) }} []{{ end }}
    {{- if .Values.connections.enabled }}
    - from:
        - namespaceSelector:
            {{- if eq .Values.connections.scope "Cluster" }}
            {}
            {{- else }}
            matchLabels:
              kubernetes.io/metadata.name: {{ ternary .Release.Namespace .Values.connections.namespace (eq .Values.connections.scope "OperatorNamespace") | quote }}
            {{- end }}
      ports:
        - protocol: TCP
          port: 8093
    {{- end }}
    {{- with .Values.networkPolicy.compositionPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8090
    {{- end }}
    {{- with .Values.networkPolicy.eventPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8091
    {{- end }}
    {{- with .Values.networkPolicy.metricsPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8092
    {{- end }}
    {{- with .Values.networkPolicy.healthPeers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if or .Values.mesh.ingress.enabled .Values.mesh.ingress.gatewayAPI.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- if .Values.mesh.ingress.gatewayAPI.enabled }}
              gateway.networking.k8s.io/gateway-name: {{ .Release.Name }}-polyad
              {{- else }}
              istio: polyad-ingress
              {{- end }}
      ports:
        - {protocol: TCP, port: 8090}
        - {protocol: TCP, port: 8091}
    {{- end }}
  egress:
    {{- if and .Values.telemetry.enabled .Values.telemetry.traces.enabled .Values.telemetry.traces.routeOperator }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: polyad-telemetry
      ports:
        - {protocol: TCP, port: 4318}
    {{- end }}
    {{- if and .Values.authentication.storage.enabled .Values.authentication.storage.separateDatabase .Values.authentication.storage.managed }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}-authentication
      ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
    {{- if and .Values.postgresql.enabled .Values.postgresql.managed }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}-state
      ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
    - to:
        {{- range .Values.networkPolicy.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.apiServerPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 53}
    {{- if .Values.dragonfly.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-queue
      ports:
        - {protocol: TCP, port: 6379}
    {{- end }}
    {{- if .Values.mesh.operator.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.istioNamespace | quote }}
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - {protocol: TCP, port: 15012}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.dragonfly.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-queue
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-queue
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: polyad
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: {{ .Values.dragonflyOperator.nameOverride }}
        {{- if and .Values.observer.enabled (hasKey .Values._authEndpoints "observations") }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: polyad-observer
        {{- end }}
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-queue
      ports:
        - {protocol: TCP, port: 6379}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-queue
      ports:
        - {protocol: TCP, port: 6379}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 53}
{{- end }}
{{- end -}}
