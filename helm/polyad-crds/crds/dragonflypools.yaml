apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dragonflypools.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    plural: dragonflypools
    singular: dragonflypool
    kind: DragonflyPool
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
          labelSelectorPath: .status.labelSelector
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [replicas, minReplicas, maxReplicas]
              x-kubernetes-validations:
                - rule: self.minReplicas <= self.maxReplicas
                  message: minReplicas must not exceed maxReplicas
                - rule: self.replicas >= self.minReplicas && self.replicas <= self.maxReplicas
                  message: replicas must stay within the configured bounds
              properties:
                replicas: {type: integer, minimum: 2, maximum: 9}
                minReplicas: {type: integer, minimum: 2, maximum: 9}
                maxReplicas: {type: integer, minimum: 2, maximum: 9}
            status:
              type: object
              default: {}
              properties:
                replicas: {type: integer, minimum: 0}
                readyReplicas: {type: integer, minimum: 0}
                labelSelector: {type: string}
                observedGeneration: {type: integer}
                phase: {type: string}
      additionalPrinterColumns:
        - {name: Desired, type: integer, jsonPath: .spec.replicas}
        - {name: Current, type: integer, jsonPath: .status.replicas}
        - {name: Ready, type: integer, jsonPath: .status.readyReplicas}
        - {name: Phase, type: string, jsonPath: .status.phase}
