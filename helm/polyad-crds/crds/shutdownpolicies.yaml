apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shutdownpolicies.polyad.astrivant.com
spec:
  group: polyad.astrivant.com
  scope: Namespaced
  names:
    kind: ShutdownPolicy
    plural: shutdownpolicies
    singular: shutdownpolicy
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: 'API group and version of this custom resource: polyad.astrivant.com/v1alpha1.'
          kind:
            type: string
            description: 'Custom resource kind: ShutdownPolicy.'
          metadata:
            type: object
            properties: {}
          spec:
            type: object
            properties:
              graceSeconds:
                type: integer
                minimum: 0
                default: 30
                description: Pod termination grace period in seconds. Applications should drain or checkpoint during
                  SIGTERM or preStop handling before Kubernetes ends this period.
              afterSeconds:
                type: integer
                minimum: 0
                description: Graph lifetime limit in seconds from the Graph CR creation timestamp, including operator
                  downtime. Reaching the limit stops admission and drains owned execution; omission disables the
                  limit.
            description: Desired configuration for this ShutdownPolicy resource. Define a reusable graph runtime
              limit and pod termination grace period. Containers handle termination and durable cleanup; this policy
              does not execute Python shutdown callbacks.
          status:
            type: object
            default: {}
            x-kubernetes-preserve-unknown-fields: true
            description: Reserved operator observation subresource. This reusable definition does not execute independently
              or currently publish lifecycle status.
        required:
        - spec
        description: Define a reusable graph runtime limit and pod termination grace period. Containers handle termination
          and durable cleanup; this policy does not execute Python shutdown callbacks.
