# yaml-language-server: $schema=values.schema.json
## @param revision [string] Public Polyad Git revision; main follows updates, a commit SHA freezes an experiment.
revision: main
## @param valueFiles [array] Values paths relative to charts/polyad in that Git revision, merged in order.
valueFiles:
  - ../../terraform/polyad-values.yaml
## @param values [string] Final YAML mapping of experiment overrides; stored visibly in the Application, so exclude secrets.
values: '{}'
## @param automatedSync [boolean] Enable automatic sync, self-healing and pruning; false leaves sync under administrator control.
automatedSync: true
## @param benchmarks [object] Optional benchmark Application; it shares the operator's Git revision and never activates runners during sync.
benchmarks:
  ## @param benchmarks.enabled [boolean] Register the fixture and monitoring chart in the same Argo CD UI.
  enabled: true
  ## @param benchmarks.valueFiles [array] Profile and placement overlays relative to charts/polyad-benchmarks; order matters.
  valueFiles:
    - values-smoke.yaml
    - ../../studies/load/fixtures/gke-values.yaml
  ## @param benchmarks.values [string] Final YAML mapping; set published image tags and exclude secrets.
  values: '{}'
  ## @param benchmarks.automatedSync [boolean] False requires manual sync after images and monitoring CRDs are ready; sync never starts traffic.
  automatedSync: false
