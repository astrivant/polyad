{{- if eq .Values.controller "flux" }}
{{- if and (eq .Values.flux.revisionType "commit") (not (regexMatch "^[a-fA-F0-9]{40}$" .Values.revision)) }}
{{- fail "Flux commit references require a full 40-character Git SHA" }}
{{- end }}
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: polyad
  namespace: {{ .Release.Namespace }}
spec:
  interval: {{ .Values.flux.interval | quote }}
  url: https://github.com/astrivant/polyad.git
  ref:
    {{ .Values.flux.revisionType }}: {{ .Values.revision | quote }}
{{- $releases := list (dict "name" "polyad" "releaseName" "polyad" "chart" "charts/polyad" "settings" .Values) }}
{{- if .Values.benchmarks.enabled }}
{{- $releases = append $releases (dict "name" "polyad-benchmarks" "releaseName" "benchmarks" "chart" "charts/polyad-benchmarks" "settings" .Values.benchmarks) }}
{{- end }}
{{- range $release := $releases }}
{{- $benchmark := eq $release.name "polyad-benchmarks" }}
{{- $settings := $release.settings }}
{{- $overrides := fromYaml $settings.values }}
{{- if or (not (kindIs "map" $overrides)) (hasKey $overrides "Error") }}
{{- fail "Release values must contain a YAML mapping" }}
{{- end }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $release.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  releaseName: {{ $release.releaseName }}
  targetNamespace: polyad
  storageNamespace: polyad
  interval: {{ $.Values.flux.interval | quote }}
  timeout: 15m
  # Unlike Argo's manual sync, suspension also prevents the initial install.
  suspend: {{ not $settings.automatedSync }}
  {{- if $benchmark }}
  dependsOn:
    - name: polyad
  {{- end }}
  chart:
    spec:
      chart: {{ $release.chart }}
      sourceRef:
        kind: GitRepository
        name: polyad
      # Rebuild for Git changes even when Chart.yaml's version is unchanged.
      reconcileStrategy: Revision
      interval: {{ $.Values.flux.interval | quote }}
      ignoreMissingValuesFiles: false
      valuesFiles:
        # Flux replaces chart defaults with this list, so retain defaults first.
        - {{ printf "%s/values.yaml" $release.chart | quote }}
        {{- range $settings.valueFiles }}
        {{- $path := clean (printf "%s/%s" $release.chart .) }}
        {{- if or (isAbs .) (eq $path "..") (hasPrefix "../" $path) }}
        {{- fail "Flux values files must resolve inside the Git repository" }}
        {{- end }}
        # Argo paths are chart-relative; Flux paths are source-root-relative.
        - {{ $path | quote }}
        {{- end }}
  values: {{ $overrides | toJson }}
  install:
    createNamespace: true
    crds: {{ ternary "Skip" "CreateReplace" $benchmark }}
    # Keep Helm's three-way patches: SSA would reclaim autoscaler-owned counts.
    serverSideApply: false
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    crds: {{ ternary "Skip" "CreateReplace" $benchmark }}
    serverSideApply: disabled
    # Retry in place, rather than uninstalling stateful Polyad boundaries on failure.
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  test:
    enable: false
  waitStrategy:
    name: poller
  # Generated by scripts/gitops/flux-health.py --write-bootstrap; parity is tested.
  # CEL is evaluated during Helm actions, not continuously between adaptations.
  healthCheckExprs:
    {{- ($.Files.Get "files/flux-health.json" | fromJson).spec.healthCheckExprs | toYaml | nindent 4 }}
  driftDetection:
    mode: enabled
    {{- if not $benchmark }}
    # Match the Argo exclusions, scoped to known autoscaling targets only.
    ignore:
      {{- range $target := list
        (dict "group" "polyad.astrivant.com" "kind" "ReplicaGroup" "name" "polyad-gateway")
        (dict "group" "polyad.astrivant.com" "kind" "ReplicaGroup" "name" "polyad-executor")
        (dict "group" "polyad.astrivant.com" "kind" "ReplicaGroup" "name" "polyad-telemetry")
        (dict "group" "polyad.astrivant.com" "kind" "DragonflyPool" "name" "polyad-queue")
        (dict "group" "dragonflydb.io" "kind" "Dragonfly" "name" "polyad-queue")
        (dict "group" "apps" "kind" "Deployment" "name" "polyad-polyad")
        (dict "group" "apps" "kind" "Deployment" "name" "keda-operator-metrics-apiserver")
        (dict "group" "apps" "kind" "Deployment" "name" "keda-admission-webhooks") }}
      - paths: [/spec/replicas]
        target:
          group: {{ $target.group | replace "." "\\." | printf "^%s$" | quote }}
          kind: {{ $target.kind | printf "^%s$" | quote }}
          name: {{ $target.name | printf "^%s$" | quote }}
          namespace: "^polyad$"
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
