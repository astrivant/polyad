[tool.poetry]
name = "polyad-client"
version = "0.0.1a3"
description = "Small typed Python client for Polyad operator APIs"
authors = ["Emma Doyle"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/astrivant/polyad"
packages = [{include = "polyad_client"}]

[tool.poetry.dependencies]
python = ">=3.11,<4"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
