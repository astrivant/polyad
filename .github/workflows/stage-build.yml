name: Build stage

# Called only by ci.yml, so these groups stay inside its single pipeline run.
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
      release-tag:
        description: Explicit release tag, or empty for ordinary validation
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  container:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [development, production]
        platform:
          - {runner: ubuntu-latest, name: linux/amd64, arch: amd64}
          - {runner: ubuntu-24.04-arm, name: linux/arm64, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      # File-local steps also support older release checkouts without new local actions.
      - &release-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: inputs.release-tag != ''
        with:
          python-version-file: .python-version
      - &release-metadata
        name: Stamp release metadata
        if: inputs.release-tag != ''
        env:
          RELEASE_REF: ${{ inputs.release-tag }}
        run: python .github/prepare-release.py --tag "$RELEASE_REF"
      - &release-locks
        name: Refresh lockfiles after release version changes
        if: inputs.release-tag != ''
        env:
          POETRY_VIRTUALENVS_CREATE: 'false'
        run: |
          python -m pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
          poetry lock
          poetry check --lock
          poetry -C pkg/polyad-benchmarks lock
          poetry -C pkg/polyad-benchmarks check --lock
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Read image metadata
        id: image
        run: |
          {
            echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and load container profile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: services/operator/Dockerfile
          target: ${{ matrix.profile }}
          platforms: ${{ matrix.platform.name }}
          load: true
          push: false
          tags: polyad:container-test
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
          cache-from: type=gha,scope=container-${{ matrix.profile }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.profile }}-${{ matrix.platform.arch }}
      - name: Check non-root container profile
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint /usr/bin/tini -i polyad:container-test -- python - "${{ matrix.profile }}" < scripts/testing/check-container.py
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges polyad:container-test --help
      - name: Check development tests
        if: matrix.profile == 'development'
        run: docker run --rm --entrypoint /usr/bin/tini polyad:container-test -- python -m pytest -n 2 tests/features/test_scheduling_gates.py

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/tooling/install-helm-tools.sh helm
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh helm/polyad
      - name: Helm to Docker Compose
        id: compose
        uses: astrivant/composer@4ee8ce8507e10b6cbbac607d7bda01e22740cd37
        with:
          watch-directory: '.'
          chart: helm/polyad
          commit: 'false'
          release: polyad
          namespace: polyad
          output: dist/compose/compose.yaml
          report: dist/compose/report.json
      - name: Upload generated Compose
        if: steps.compose.outputs.skipped != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: polyad-compose
          path: dist/compose/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  chart:
    # Public-repository standard Linux runners provide 4 CPUs / 16 GB without fees.
    # Larger runner labels are billed even for public repositories.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Preserve six property-test jobs while upgrading the action independently.
        chart: [polyad, polyad-crds]
        shard: [1, 2, 3]
        include:
          - {chart: polyad-benchmarks, shard: 1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - *release-python
      - *release-metadata
      - *release-locks
      - run: bash scripts/tooling/install-helm-tools.sh helm kubeconform
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh
      - name: Prepare monitoring CRD schemas from the locked chart
        if: matrix.chart == 'polyad-benchmarks'
        run: |
          python -m venv "$RUNNER_TEMP/polyad-schema-tools"
          "$RUNNER_TEMP/polyad-schema-tools/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/polyad-schema-tools/bin/python" scripts/validation/benchmark-schemas.py
      - name: Validate chart with hypothesis-helm
        # Keep the existing benchmark-chart fallback during this dependency upgrade.
        # Its default and full monitoring profiles have strict render/schema checks below.
        if: matrix.chart != 'polyad-benchmarks'
        # v1.3.7: file-backed schema policies avoid OS argument-size limits.
        uses: astrivant/hypothesis-helm@7ad5b937dd554a82889fe06665feaf4bf76691cc
        with:
          chart: helm/${{ matrix.chart }}
          artifact-name: hypothesis-helm-${{ matrix.chart }}
          artifact-dir: reports/hypothesis-helm/${{ matrix.chart }}
          shard: ${{ matrix.shard }}/3
          jobs: '4'
          # Preserve per-path coverage and the previous example budget across the upgrade.
          paths: 'true'
          # Test root charts without traversing dependency charts.
          max-depth: '0'
          max-examples: '100'
          schema-validation: 'true'
          schema-version: '1.35.0'
          config: ${{ matrix.chart == 'polyad-crds' && 'helm/polyad-crds/.hypothesis-helm.yaml' || '' }}
          # Native validation needs explicit custom-resource contracts in strict mode.
          # Inline paths resolve from the workspace, independent of the policy file above.
          config-inline: |
            strict: true
            resource_schemas:
              dragonflydb.io/v1alpha1/Dragonfly: helm/polyad/schemas/dragonfly-dragonflydb-v1alpha1.json
              external-secrets.io/v1/ExternalSecret: helm/polyad/schemas/externalsecret-external-secrets-v1.json
              gateway.networking.k8s.io/v1/Gateway: helm/polyad/schemas/gateway-gateway-v1.json
              gateway.networking.k8s.io/v1/HTTPRoute: helm/polyad/schemas/httproute-gateway-v1.json
              keda.sh/v1alpha1/TriggerAuthentication: helm/polyad/schemas/triggerauthentication-keda-v1alpha1.json
              networking.istio.io/v1/DestinationRule: helm/polyad/schemas/destinationrule-networking-v1.json
              networking.istio.io/v1/Gateway: helm/polyad/schemas/gateway-networking-v1.json
              networking.istio.io/v1/ServiceEntry: helm/polyad/schemas/serviceentry-networking-v1.json
              networking.istio.io/v1/Sidecar: helm/polyad/schemas/sidecar-networking-v1.json
              networking.istio.io/v1/VirtualService: helm/polyad/schemas/virtualservice-networking-v1.json
              polyad.astrivant.com/v1alpha1/Activation: helm/polyad/schemas/activation-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Composition: helm/polyad/schemas/composition-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Daemon: helm/polyad/schemas/daemon-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/DragonflyPool: helm/polyad/schemas/dragonflypool-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Gate: helm/polyad/schemas/gate-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Graph: helm/polyad/schemas/graph-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/GraphPolicy: helm/polyad/schemas/graphpolicy-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/OperatorPool: helm/polyad/schemas/operatorpool-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/PolyGraph: helm/polyad/schemas/polygraph-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/RemoteScale: helm/polyad/schemas/remotescale-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/ReplicaGroup: helm/polyad/schemas/replicagroup-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Resource: helm/polyad/schemas/resource-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Rewrite: helm/polyad/schemas/rewrite-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/ShutdownPolicy: helm/polyad/schemas/shutdownpolicy-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/TemporaryConnection: helm/polyad/schemas/temporaryconnection-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Workload: helm/polyad/schemas/workload-polyad-v1alpha1.json
              security.istio.io/v1/AuthorizationPolicy: helm/polyad/schemas/authorizationpolicy-security-v1.json
              security.istio.io/v1/PeerAuthentication: helm/polyad/schemas/peerauthentication-security-v1.json
              security.istio.io/v1/RequestAuthentication: helm/polyad/schemas/requestauthentication-security-v1.json
              telemetry.istio.io/v1/Telemetry: helm/polyad/schemas/telemetry-telemetry-v1.json
      - name: Validate benchmark profiles against locked CRD schemas
        if: matrix.chart == 'polyad-benchmarks'
        run: |
          helm lint helm/polyad-benchmarks
          helm template study helm/polyad-benchmarks > "$RUNNER_TEMP/benchmark-default.yaml"
          for profile in smoke steady burst; do
            helm lint helm/polyad-benchmarks -f "helm/polyad-benchmarks/values-$profile.yaml"
            helm template study helm/polyad-benchmarks -f "helm/polyad-benchmarks/values-$profile.yaml" > "$RUNNER_TEMP/benchmark-$profile.yaml"
          done
          helm template study helm/polyad-benchmarks -n polyad -f studies/load/fixtures/gke-values.yaml > "$RUNNER_TEMP/benchmark-monitoring.yaml"
          bash scripts/validation/kubeconform.sh -strict -summary -kubernetes-version 1.35.0 "$RUNNER_TEMP"/benchmark-*.yaml

  chart-package:
    needs: chart
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - *release-python
      - *release-metadata
      - *release-locks
      - run: bash scripts/tooling/install-helm-tools.sh helm
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh
      - name: Package validated chart
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag="${RELEASE_TAG#refs/tags/}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          helm package helm/polyad --destination dist/chart
          helm package helm/polyad-crds --destination dist/chart
          helm package helm/polyad-benchmarks --destination dist/chart
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload tagged Helm chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: helm-chart-${{ steps.package.outputs.tag }}
          path: dist/chart/*.tgz
          if-no-files-found: error
          retention-days: 30

  benchmark-images:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service: [runner, fixture]
        platform:
          - {runner: ubuntu-latest, name: linux/amd64, arch: amd64}
          - {runner: ubuntu-24.04-arm, name: linux/arm64, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform.name }}
          load: true
          push: false
          tags: polyad-benchmarks:check
          cache-from: type=gha,scope=benchmarks-${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=benchmarks-${{ matrix.service }}-${{ matrix.platform.arch }}
      - run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges polyad-benchmarks:check --help

  build-complete:
    name: Require complete build stage
    if: always()
    needs: [container, compose, chart, chart-package, benchmark-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python3 - <<'PY'
          import json
          import os

          optional = set()
          if not os.environ['RELEASE_TAG']:
              optional.add('chart-package')
          failures = {
              name: result['result']
              for name, result in json.loads(os.environ['RESULTS_JSON']).items()
              if result['result'] != 'success' and not (name in optional and result['result'] == 'skipped')
          }
          if failures:
              raise SystemExit(f'Pipeline checks did not pass: {failures}')
          print('Every required stage check passed.')
          PY
