name: Deploy stage

# Called only by ci.yml, so these groups stay inside its single pipeline run.
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true
      release-tag:
        description: Explicit release tag, or empty for ordinary validation
        type: string
        default: ''
    secrets:
      PYPI_API_TOKEN:
        description: PyPI credential, optionally supplied by the protected pypi environment
        required: false

      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish verified release
    if: inputs.release-tag != ''
    concurrency:
      group: pypi-${{ inputs.release-tag }}
      cancel-in-progress: false
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: inputs.release-tag != ''
        with:
          python-version-file: .python-version
      - name: Stamp release metadata
        if: inputs.release-tag != ''
        env:
          RELEASE_REF: ${{ inputs.release-tag }}
        run: python .github/prepare-release.py --tag "$RELEASE_REF"
      # Verified distributions need no dependency resolution or rebuild here.
      - name: Install Poetry
        run: pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/release-version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/
      - name: Download verified Helm charts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: helm-chart-${{ inputs.release-tag }}
          path: dist/chart/
      - name: Read signing tool pin
        id: tools
        run: echo "cosign=v$(bash scripts/tooling/tool-version.sh cosign)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ steps.tools.outputs.cosign }}
      - name: Prepare release notes from the verified signed tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.sha }}
          RELEASE_OPERATION: prepare
        with:
          script: |
            const operation = require('./scripts/release/feedback.cjs');
            await operation({github, context, core});
      - name: Publish signed artifacts and Python packages
        env:
          GH_TOKEN: ${{ github.token }}
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.sha }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY_SHA256: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 }}
        run: bash scripts/release/publish.sh
      - name: Retain contributor inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-feedback-${{ inputs.release-tag }}
          path: |-
            ${{ runner.temp }}/release-prs.json
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
    permissions:
      contents: write
      pull-requests: read
  release-acceptance:
    name: Verify published release
    needs: publish
    if: "!cancelled() && inputs.release-tag != ''"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Read signing tool pin
        id: tools
        run: echo "cosign=v$(bash scripts/tooling/tool-version.sh cosign)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ steps.tools.outputs.cosign }}
      - name: Require complete published attachments
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.sha }}
          COSIGN_PUBLIC_KEY_SHA256: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 }}
        run: bash scripts/release/verify-published.sh
  release-feedback:
    name: Close the contributor release loop
    needs:
      - publish
      - release-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-feedback-${{ inputs.release-tag }}
          path: ${{ runner.temp }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ inputs.sha }}
          RELEASE_OPERATION: notify
        with:
          script: |
            const operation = require('./scripts/release/feedback.cjs');
            await operation({github, context, core});
