name: Validate and build Helm chart

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to validate and build
        type: string
        default: ''
      release-tag:
        description: Version tag (optionally refs/tags-prefixed); empty skips packaging
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve immutable chart source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  chart:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [polyad, polyad-crds]
        shard: [1, 2, 3]
        include:
          - {chart: polyad-benchmarks, shard: 1}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-release
        with:
          ref: ${{ inputs.release-tag }}
      - run: bash scripts/tooling/install-helm-tools.sh helm kubeconform
      - name: Build chart dependencies
        run: |
          helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
          helm dependency build charts/polyad
          helm dependency build charts/polyad-benchmarks
      - name: Prepare monitoring CRD schemas from the locked chart
        if: matrix.chart == 'polyad-benchmarks'
        run: |
          python -m venv "$RUNNER_TEMP/polyad-schema-tools"
          "$RUNNER_TEMP/polyad-schema-tools/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/polyad-schema-tools/bin/python" scripts/validation/benchmark-schemas.py
      - name: Permit the resource chart's intentionally empty instance defaults
        if: matrix.chart == 'polyad-crds'
        run: cp charts/polyad-crds/.hypothesis-helm.yaml .hypothesis-helm.yaml
      - name: Validate chart with hypothesis-helm
        # The benchmark dependency merge currently trips the upstream YAML round-trip parser.
        # Its default and full monitoring profiles have strict render/schema checks below.
        if: matrix.chart != 'polyad-benchmarks'
        uses: astrivant/hypothesis-helm@main
        with:
          chart: charts/${{ matrix.chart }}
          artifact-name: hypothesis-helm-${{ matrix.chart }}
          artifact-dir: reports/hypothesis-helm/${{ matrix.chart }}
          shard: ${{ matrix.shard }}/3
          jobs: '2'
          kubeconform: 'true'
          kubeconform-binary: scripts/validation/kubeconform.sh
          schema-version: '1.35.0'
      - name: Validate benchmark profiles against locked CRD schemas
        if: matrix.chart == 'polyad-benchmarks'
        run: |
          helm lint charts/polyad-benchmarks
          helm template study charts/polyad-benchmarks > "$RUNNER_TEMP/benchmark-default.yaml"
          for profile in smoke steady burst; do
            helm lint charts/polyad-benchmarks -f "charts/polyad-benchmarks/values-$profile.yaml"
            helm template study charts/polyad-benchmarks -f "charts/polyad-benchmarks/values-$profile.yaml" > "$RUNNER_TEMP/benchmark-$profile.yaml"
          done
          helm template study charts/polyad-benchmarks -n polyad -f studies/load/gke-values.yaml > "$RUNNER_TEMP/benchmark-monitoring.yaml"
          bash scripts/validation/kubeconform.sh -strict -summary -kubernetes-version 1.35.0 "$RUNNER_TEMP"/benchmark-*.yaml
  package:
    needs: [source, chart]
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-release
        with:
          ref: ${{ inputs.release-tag }}
      - run: bash scripts/tooling/install-helm-tools.sh helm
      - name: Build chart dependencies
        run: |
          helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
          helm dependency build charts/polyad
          helm dependency build charts/polyad-benchmarks
      - name: Package validated chart
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag="${RELEASE_TAG#refs/tags/}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          helm package charts/polyad --destination dist/chart
          helm package charts/polyad-crds --destination dist/chart
          helm package charts/polyad-benchmarks --destination dist/chart
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload tagged Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ steps.package.outputs.tag }}
          path: dist/chart/*.tgz
          if-no-files-found: error
          retention-days: 30
