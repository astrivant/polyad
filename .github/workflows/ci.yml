name: Polyad pipeline
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish; leave empty for validation only
        type: string
        default: ''
      refresh:
        description: Refresh local study measurements and graphs for an open PR
        type: boolean
        default: false
      pull-request:
        description: Open PR number for refresh; select its current head branch as the workflow ref
        type: string
        default: ''
      full-refresh:
        description: Also run installed cloud fixtures for the requested PR refresh (requires refresh)
        type: boolean
        default: false
      context:
        description: Explicit kubeconfig context on the administrator-provided benchmark runner
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: polyad-${{ github.event_name }}-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  # Only superseded PR checks may be cancelled, never an in-flight release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  # Resolve one immutable commit for every validation and release job below.
  source:
    name: Resolve pipeline source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      release-tag: ${{ steps.source.outputs.release-tag }}
      refresh: ${{ steps.request.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin every branch of the pipeline to one commit
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" && "$GITHUB_REF" =~ ^refs/tags/v[0-9] ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -n "$tag" ]]; then
            git check-ref-format "refs/tags/$tag"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            printf 'release-tag=%s\n' "$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Validate an explicitly requested PR refresh
        id: request
        if: github.event_name == 'workflow_dispatch' && (inputs.refresh || inputs.full-refresh)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request }}
          REFRESH: ${{ inputs.refresh }}
          FULL_REFRESH: ${{ inputs.full-refresh }}
          BENCHMARK_CONTEXT: ${{ inputs.context }}
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REFRESH" != true || -n "$RELEASE_TAG" || ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Refresh requires refresh=true, an open PR number and its head branch, without a release tag.'
            exit 1
          fi
          if [[ "$FULL_REFRESH" == true && -z "$BENCHMARK_CONTEXT" ]]; then
            echo '::error::Cloud refresh requires an explicit Kubernetes context.'
            exit 1
          fi

          # Resolve the PR before any benchmark runs; never load a fork onto the cloud runner.
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
            --arg ref "$GITHUB_REF" --arg base "$DEFAULT_BRANCH" '
            .state == "open" and .draft == false and
            .head.repo.full_name == $repository and .base.repo.full_name == $repository and
            .base.ref == $base and .head.ref != $base and
            .head.sha == $sha and ("refs/heads/" + .head.ref) == $ref
            ' <<< "$metadata" > /dev/null || {
              echo '::error::Select the current head branch of an open, ready PR in this repository.'
              exit 1
            }
          echo 'refresh=true' >> "$GITHUB_OUTPUT"

  terraform:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform -chdir=terraform fmt -check -recursive
      # Commit platform content hashes with `providers lock` (see terraform/README.md).
      # Read-only initialization keeps missing Linux checksums from being masked in CI.
      - run: terraform -chdir=terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - name: Test with mocked providers (no cloud credentials or resources)
        run: terraform -chdir=terraform test

  python:
    needs: source
    runs-on: ubuntu-latest
    env:
      # Pytest config adjusts only its own interpreter, not child-process imports.
      PYTHONPATH: pkg/polyad-benchmarks:.
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: polyad-test
          POSTGRES_DB: polyad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d polyad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      # Reuse these release steps below without a separate composite action.
      - &release-python
        uses: actions/setup-python@v5
        if: needs.source.outputs.release-tag != ''
        with:
          python-version-file: .python-version
      - &release-metadata
        name: Stamp release metadata
        if: needs.source.outputs.release-tag != ''
        env:
          RELEASE_REF: ${{ needs.source.outputs.release-tag }}
        run: python .github/prepare-release.py --tag "$RELEASE_REF"
      - &release-locks
        name: Refresh lockfiles after release version changes
        if: needs.source.outputs.release-tag != ''
        env:
          POETRY_VIRTUALENVS_CREATE: 'false'
        run: |
          python -m pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
          poetry lock
          poetry check --lock
          poetry -C pkg/polyad-benchmarks lock
          poetry -C pkg/polyad-benchmarks check --lock
      - name: Read shared tool versions
        id: tools
        run: |
          echo "nodejs=$(bash scripts/tooling/tool-version.sh nodejs)" >> "$GITHUB_OUTPUT"
          echo "poetry=$(bash scripts/tooling/tool-version.sh poetry)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: pkg/tests/flux/go.mod
          cache-dependency-path: pkg/tests/flux/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.nodejs }}
          cache: npm
          cache-dependency-path: scripts/validation/mermaid/package-lock.json
      - name: Install Mermaid test dependencies
        run: npm ci --prefix scripts/validation/mermaid --ignore-scripts --no-audit --no-fund
      - run: pip install "poetry==${{ steps.tools.outputs.poetry }}"
      - name: Validate distribution version
        id: version
        env:
          BUILD_REF: ${{ needs.source.outputs.release-tag && format('refs/tags/{0}', needs.source.outputs.release-tag) || needs.source.outputs.sha }}
        run: |
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            python .github/release-version.py --tag "${BUILD_REF#refs/tags/}" --output "$GITHUB_OUTPUT"
          else
            python .github/release-version.py --output "$GITHUB_OUTPUT"
          fi
      - run: poetry lock && poetry install --all-extras
      - name: Install opt-in SDK clients for protocol tests
        run: poetry run python -m pip install -e './pkg/polyad-sdk[protocols]'
      - run: bash scripts/tooling/install-helm-tools.sh helm shellcheck shfmt argocd
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh
      - run: poetry run pre-commit run --all-files
        if: matrix.python == '3.13'
      - name: Validate CRD admission and Flux health expressions
        env:
          POLYAD_FLUX_CHECKS: ${{ runner.temp }}/polyad-flux-checks.json
        run: |
          poetry run python scripts/gitops/flux-health.py --json > "$POLYAD_FLUX_CHECKS"
          test -z "$(gofmt -l pkg/tests/flux/*.go)"
          go -C pkg/tests/flux test -mod=readonly -parallel 8 ./...
      - run: npm test --prefix scripts/validation/mermaid
      - run: docker run -d --name dragonfly -p 6379:6379 docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0 --proactor_threads=1 --maxmemory=256mb
      - run: |
          for _attempt in $(seq 1 30); do
            if poetry run python -c "import redis; redis.Redis().ping()"; then break; fi
            sleep 1
          done
          poetry run python -c "import redis; redis.Redis().ping()"
      - name: Run Python tests in parallel
        run: |
          mkdir -p .cache/tests
          poetry run pytest --junitxml=.cache/tests/pytest.xml --cov --cov-config=pyproject.toml --cov-report=
        env:
          COVERAGE_FILE: .cache/tests/.coverage.${{ matrix.python }}
          POLYAD_TEST_DRAGONFLY_URL: redis://localhost:6379/0
          POLYAD_TEST_POSTGRES_DSN: postgresql://postgres:polyad-test@localhost:5432/polyad
      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.python }}
          path: .cache/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Check installed wheel typing
        run: |
          poetry build
          poetry -C pkg/polyad-types build --output ../../dist
          poetry -C pkg/polyad-schemas build --output ../../dist
          poetry -C pkg/polyad-sdk build --output ../../dist
          poetry -C pkg/polyad-benchmarks build --output ../../dist
          poetry run python -m venv /tmp/polyad-typing
          /tmp/polyad-typing/bin/python -m pip install dist/*.whl
          POLYAD_TYPING_PYTHON=/tmp/polyad-typing/bin/python poetry run pytest pkg/tests/test_typing.py
      - name: Upload verified distributions
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: Python coverage (${{ matrix.package }})
    needs: [source, python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: all, files: 'pkg/*'}
          - {package: polyad, files: 'pkg/polyad/*'}
          - {package: polyad-sdk, files: 'pkg/polyad-sdk/polyad_sdk/*'}
          - {package: polyad-types, files: 'pkg/polyad-types/polyad_types/*'}
          - {package: polyad-schemas, files: 'pkg/polyad-schemas/polyad_schemas/*'}
          - {package: polyad-benchmarks, files: 'pkg/polyad-benchmarks/polyad_benchmarks/*'}
    env:
      COVERAGE_PACKAGE: ${{ matrix.package }}
      COVERAGE_INCLUDE: ${{ matrix.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked coverage tools
        run: |
          pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
          poetry install --only coverage --no-root --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: python-test-results-*
          path: .cache/coverage-shards/
      - name: Combine both Python versions and export coverage
        run: |
          # Require every matrix member so a partial upload cannot inflate the badge.
          for version in 3.13 3.14; do
            test -s ".cache/coverage-shards/python-test-results-${version}/.coverage.${version}"
          done
          poetry run coverage combine .cache/coverage-shards/python-test-results-*/.coverage.*

          # Slice the combined data, rather than executing the test suite again per package.
          poetry run coverage json -o coverage.json --include "$COVERAGE_INCLUDE"
          poetry run coverage html -d .cache/coverage-html --include "$COVERAGE_INCLUDE"
          printf '### %s coverage\n\n' "$COVERAGE_PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage report --include "$COVERAGE_INCLUDE" --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.package }}
          path: |
            coverage.json
            .cache/coverage-html/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  coverage-badge:
    name: Publish coverage badge
    needs: [source, coverage]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      # The badge action embeds checkout@v3; both checkouts must use direct-header credentials.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: python-coverage-all
      - name: Check whether the badge percentage changed
        id: badge
        run: |
          previous="$RUNNER_TEMP/previous-coverage.svg"
          if [[ -n "$(git ls-remote --heads origin refs/heads/gh-pages)" ]]; then
            git fetch origin gh-pages
            git show FETCH_HEAD:badges/coverage.svg > "$previous" || truncate -s 0 "$previous"
          else
            touch "$previous"
          fi
          python - "$previous" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          from xml.etree import ElementTree

          percent = str(json.loads(Path('coverage.json').read_text())['totals']['percent_covered_display'])
          previous = Path(sys.argv[1]).read_text()
          labels = set(ElementTree.fromstring(previous).itertext()) if previous else set()
          print(f"changed={str(f'{percent}%' not in labels).lower()}")
          PY
      # Match hypothesis-helm's Python-capable revision, not the older marketplace tag.
      - uses: we-cli/coverage-badge-action@8a0b6ee05f6dd0f294089cbe7a848452a2b43eef
        if: steps.badge.outputs.changed == 'true'

  lightweight-packages:
    needs: [source, python]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ needs.python.outputs.version }}
          path: dist/
      - name: Check standalone schemas, types and SDK wheels
        run: |
          python -m venv /tmp/polyad-schemas
          /tmp/polyad-schemas/bin/python -m pip install --no-deps dist/polyad_schemas-*.whl
          /tmp/polyad-schemas/bin/python -I scripts/testing/check-schemas-package.py
          /tmp/polyad-schemas/bin/python -m pip check
          python -m venv /tmp/polyad-sdk
          /tmp/polyad-sdk/bin/python -m pip install dist/polyad_types-*.whl
          /tmp/polyad-sdk/bin/python -I scripts/testing/check-types-package.py
          /tmp/polyad-sdk/bin/python -m pip install --find-links dist dist/polyad_sdk-*.whl
          /tmp/polyad-sdk/bin/python -I scripts/testing/check-sdk-package.py
          /tmp/polyad-sdk/bin/python -m pip check

  container:
    needs: source
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [development, production]
        platform:
          - {runner: ubuntu-latest, name: linux/amd64, arch: amd64}
          - {runner: ubuntu-24.04-arm, name: linux/arm64, arch: arm64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - *release-python
      - *release-metadata
      - *release-locks
      - uses: docker/setup-buildx-action@v4
      - name: Read image metadata
        id: image
        run: |
          {
            echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and load container profile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/operator/Dockerfile
          target: ${{ matrix.profile }}
          platforms: ${{ matrix.platform.name }}
          load: true
          push: false
          tags: polyad:container-test
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
          cache-from: type=gha,scope=container-${{ matrix.profile }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.profile }}-${{ matrix.platform.arch }}
      - name: Check non-root container profile
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint /usr/bin/tini -i polyad:container-test -- python - "${{ matrix.profile }}" < scripts/testing/check-container.py
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges polyad:container-test --help
      - name: Check development tests
        if: matrix.profile == 'development'
        run: docker run --rm --entrypoint /usr/bin/tini polyad:container-test -- python -m pytest -n 2 pkg/tests/test_scheduling_gates.py

  compose:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/tooling/install-helm-tools.sh helm
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh charts/polyad
      - name: Helm to Docker Compose
        id: compose
        uses: astrivant/composer@v0.3.0
        with:
          watch-directory: '.'
          chart: charts/polyad
          commit: 'false'
          release: polyad
          namespace: polyad
          output: dist/compose/compose.yaml
          report: dist/compose/report.json
      - name: Upload generated Compose
        if: steps.compose.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: polyad-compose
          path: dist/compose/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Validate Helm charts in parallel, then package only explicit releases.
  chart:
    needs: source
    # Public-repository standard Linux runners provide 4 CPUs / 16 GB without fees.
    # Larger runner labels are billed even for public repositories.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Preserve six property-test jobs while upgrading the action independently.
        chart: [polyad, polyad-crds]
        shard: [1, 2, 3]
        include:
          - {chart: polyad-benchmarks, shard: 1}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - *release-python
      - *release-metadata
      - *release-locks
      - run: bash scripts/tooling/install-helm-tools.sh helm kubeconform
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh
      - name: Prepare monitoring CRD schemas from the locked chart
        if: matrix.chart == 'polyad-benchmarks'
        run: |
          python -m venv "$RUNNER_TEMP/polyad-schema-tools"
          "$RUNNER_TEMP/polyad-schema-tools/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/polyad-schema-tools/bin/python" scripts/validation/benchmark-schemas.py
      - name: Validate chart with hypothesis-helm
        # Keep the existing benchmark-chart fallback during this dependency upgrade.
        # Its default and full monitoring profiles have strict render/schema checks below.
        if: matrix.chart != 'polyad-benchmarks'
        # v1.3.5: pin the release commit, including its native schema validator.
        uses: astrivant/hypothesis-helm@dbc07922420fa38ddeead026f7c857eeaae66910
        with:
          chart: charts/${{ matrix.chart }}
          artifact-name: hypothesis-helm-${{ matrix.chart }}
          artifact-dir: reports/hypothesis-helm/${{ matrix.chart }}
          shard: ${{ matrix.shard }}/3
          jobs: '4'
          # Preserve per-path coverage and the previous example budget across the upgrade.
          paths: 'true'
          max-examples: '100'
          schema-validation: 'true'
          schema-version: '1.35.0'
          config: ${{ matrix.chart == 'polyad-crds' && 'charts/polyad-crds/.hypothesis-helm.yaml' || '' }}
          # Native validation needs explicit custom-resource contracts in strict mode.
          # Inline paths resolve from the workspace, independent of the policy file above.
          config-inline: |
            strict: true
            resource_schemas:
              dragonflydb.io/v1alpha1/Dragonfly: charts/polyad/schemas/dragonfly-dragonflydb-v1alpha1.json
              external-secrets.io/v1/ExternalSecret: charts/polyad/schemas/externalsecret-external-secrets-v1.json
              gateway.networking.k8s.io/v1/Gateway: charts/polyad/schemas/gateway-gateway-v1.json
              gateway.networking.k8s.io/v1/HTTPRoute: charts/polyad/schemas/httproute-gateway-v1.json
              keda.sh/v1alpha1/TriggerAuthentication: charts/polyad/schemas/triggerauthentication-keda-v1alpha1.json
              networking.istio.io/v1/DestinationRule: charts/polyad/schemas/destinationrule-networking-v1.json
              networking.istio.io/v1/Gateway: charts/polyad/schemas/gateway-networking-v1.json
              networking.istio.io/v1/ServiceEntry: charts/polyad/schemas/serviceentry-networking-v1.json
              networking.istio.io/v1/Sidecar: charts/polyad/schemas/sidecar-networking-v1.json
              networking.istio.io/v1/VirtualService: charts/polyad/schemas/virtualservice-networking-v1.json
              polyad.astrivant.com/v1alpha1/Activation: charts/polyad/schemas/activation-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Composition: charts/polyad/schemas/composition-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Daemon: charts/polyad/schemas/daemon-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/DragonflyPool: charts/polyad/schemas/dragonflypool-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Gate: charts/polyad/schemas/gate-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Graph: charts/polyad/schemas/graph-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/GraphPolicy: charts/polyad/schemas/graphpolicy-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/OperatorPool: charts/polyad/schemas/operatorpool-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/PolyGraph: charts/polyad/schemas/polygraph-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/RemoteScale: charts/polyad/schemas/remotescale-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/ReplicaGroup: charts/polyad/schemas/replicagroup-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Resource: charts/polyad/schemas/resource-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Rewrite: charts/polyad/schemas/rewrite-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/ShutdownPolicy: charts/polyad/schemas/shutdownpolicy-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/TemporaryConnection: charts/polyad/schemas/temporaryconnection-polyad-v1alpha1.json
              polyad.astrivant.com/v1alpha1/Workload: charts/polyad/schemas/workload-polyad-v1alpha1.json
              security.istio.io/v1/AuthorizationPolicy: charts/polyad/schemas/authorizationpolicy-security-v1.json
              security.istio.io/v1/PeerAuthentication: charts/polyad/schemas/peerauthentication-security-v1.json
              security.istio.io/v1/RequestAuthentication: charts/polyad/schemas/requestauthentication-security-v1.json
              telemetry.istio.io/v1/Telemetry: charts/polyad/schemas/telemetry-telemetry-v1.json
      - name: Validate benchmark profiles against locked CRD schemas
        if: matrix.chart == 'polyad-benchmarks'
        run: |
          helm lint charts/polyad-benchmarks
          helm template study charts/polyad-benchmarks > "$RUNNER_TEMP/benchmark-default.yaml"
          for profile in smoke steady burst; do
            helm lint charts/polyad-benchmarks -f "charts/polyad-benchmarks/values-$profile.yaml"
            helm template study charts/polyad-benchmarks -f "charts/polyad-benchmarks/values-$profile.yaml" > "$RUNNER_TEMP/benchmark-$profile.yaml"
          done
          helm template study charts/polyad-benchmarks -n polyad -f studies/load/fixtures/gke-values.yaml > "$RUNNER_TEMP/benchmark-monitoring.yaml"
          bash scripts/validation/kubeconform.sh -strict -summary -kubernetes-version 1.35.0 "$RUNNER_TEMP"/benchmark-*.yaml

  chart-package:
    needs: [source, chart]
    if: needs.source.outputs.release-tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - *release-python
      - *release-metadata
      - *release-locks
      - run: bash scripts/tooling/install-helm-tools.sh helm
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh
      - name: Package validated chart
        id: package
        env:
          RELEASE_TAG: ${{ needs.source.outputs.release-tag }}
        run: |
          tag="${RELEASE_TAG#refs/tags/}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          helm package charts/polyad --destination dist/chart
          helm package charts/polyad-crds --destination dist/chart
          helm package charts/polyad-benchmarks --destination dist/chart
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upload tagged Helm chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ steps.package.outputs.tag }}
          path: dist/chart/*.tgz
          if-no-files-found: error
          retention-days: 30

  # Generate measurements only for manually selected PRs; preparation and verification are steps,
  # not separate columns in the Actions graph. Ordinary tests still run on every ref.
  studies:
    name: Studies (${{ matrix.suite }})
    if: needs.source.outputs.refresh == 'true'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cheeger
            project: .
            extras: ''
            published: |
              studies/cheeger-strategies/results.json
              studies/cheeger-strategies/figures/
          - suite: reachability
            project: pkg/polyad-benchmarks
            extras: reachability
            published: |
              studies/symbiosis/results.json
              studies/symbiosis/figures/
              studies/reachability-state/results.json
              studies/reachability-state/figures/
              studies/reachability-routing/results.json
              studies/reachability-routing/figures/
          - suite: process
            project: pkg/polyad-benchmarks
            extras: process-studies
            published: |
              studies/soul/results.json
              studies/soul/figures/
              studies/nature/results.json
              studies/nature/figures/
    env:
      STUDY_SUITE: ${{ matrix.suite }}
      STUDY_PROJECT: ${{ matrix.project }}
      STUDY_EXTRAS: ${{ matrix.extras }}
      STUDY_ROOT: .cache/benchmarks/${{ matrix.suite }}
      PYTHONPATH: pkg/polyad-benchmarks:.
      MPLCONFIGDIR: .cache/matplotlib
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
      - name: Install the selected study backend
        run: |
          if [[ "$STUDY_SUITE" == cheeger ]]; then
            poetry sync
          else
            poetry -C "$STUDY_PROJECT" sync --only main --extras "$STUDY_EXTRAS"
          fi
      - name: Prepare the complete suite inventory
        id: prepare
        run: poetry --project "$STUDY_PROJECT" run python -m polyad_benchmarks.refresh --ci-phase prepare --suite "$STUDY_SUITE" --root "$STUDY_ROOT"
      - &run-prepared-studies
        name: Run every prepared study and retain individual failures
        run: |
          poetry --project "$STUDY_PROJECT" run python - <<'PY'
          import os
          import sys
          import traceback
          from pathlib import Path

          from polyad_benchmarks.refresh import selected_studies, study_phase

          root = Path(os.environ['STUDY_ROOT'])
          failures = []

          # Use the prepared inventory so newly registered studies cannot be omitted.
          # One failure must not suppress the other studies' measurements or diagnostics.
          for study in selected_studies(root):
              try:
                  study_phase(Path.cwd(), root, study, os.environ.get('BENCHMARK_CONTEXT', ''))
              except Exception:
                  traceback.print_exc(file=sys.stderr)
                  failures.append(study)
          if failures:
              raise SystemExit(f'Studies failed: {failures}')
          PY
      - &finish-studies
        name: Verify the whole suite before publishing its results
        if: "!cancelled() && steps.prepare.outcome == 'success'"
        run: poetry --project "$STUDY_PROJECT" run python -m polyad_benchmarks.refresh --ci-phase finish --root "$STUDY_ROOT" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studies-${{ matrix.suite }}
          path: |
            .cache/benchmarks/${{ matrix.suite }}/
            ${{ matrix.published }}
          include-hidden-files: true
          retention-days: 30

  # Benchmark harness, rendering regressions and image checks remain ordinary tests.
  benchmark-smoke:
    needs: source
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: pkg/polyad-benchmarks:.
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
      # Plot regression tests also exercise Polyad's production Cheeger solver.
      - run: poetry sync --all-extras
      - run: bash scripts/tooling/install-helm-tools.sh helm
      - run: bash scripts/tooling/build-chart-dependencies.sh charts/polyad-benchmarks
      - run: poetry run python scripts/validation/benchmark-schemas.py
      - name: Exercise harness and refresh barriers offline
        run: |
          mkdir -p .cache/benchmarks/smoke
          poetry run python -m pytest -c pyproject.toml -o addopts='' pkg/tests/test_benchmarks.py pkg/tests/test_study_plotting.py --junitxml=.cache/benchmarks/smoke/pytest.xml
          helm lint charts/polyad-benchmarks
          helm template study charts/polyad-benchmarks -f studies/load/fixtures/gke-values.yaml > .cache/benchmarks/smoke/fixture.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-${{ matrix.python }}
          path: .cache/benchmarks/smoke/
          include-hidden-files: true
          retention-days: 30

  benchmark-images:
    needs: source
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service: [runner, fixture]
        platform:
          - {runner: ubuntu-latest, name: linux/amd64, arch: amd64}
          - {runner: ubuntu-24.04-arm, name: linux/arm64, arch: arm64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform.name }}
          load: true
          push: false
          tags: polyad-benchmarks:check
          cache-from: type=gha,scope=benchmarks-${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=benchmarks-${{ matrix.service }}-${{ matrix.platform.arch }}
      - run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges polyad-benchmarks:check --help

  # Installed cloud fixtures remain opt-in and use the protected benchmark environment.
  benchmark-refresh:
    name: Cloud benchmark refresh
    if: needs.source.outputs.refresh == 'true' && inputs.full-refresh
    needs: [source, benchmark-smoke, benchmark-images]
    environment: benchmarks
    runs-on: ${{ vars.POLYAD_BENCHMARK_RUNNER || 'polyad-benchmarks' }}
    timeout-minutes: 30
    env:
      BENCHMARK_CONTEXT: ${{ inputs.context }}
      STUDY_PROJECT: pkg/polyad-benchmarks
      STUDY_ROOT: .cache/benchmarks/refresh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
      - run: poetry -C pkg/polyad-benchmarks sync --only main --extras plots
      - name: Prepare installed cloud fixtures
        id: prepare
        run: poetry --project "$STUDY_PROJECT" run python -m polyad_benchmarks.refresh --ci-phase prepare --suite cluster --root "$STUDY_ROOT"
      - *run-prepared-studies
      - *finish-studies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-refresh
          path: |
            .cache/benchmarks/refresh-${{ github.run_id }}-${{ github.run_attempt }}/
            studies/load/results.json
            studies/load/figures/
          include-hidden-files: true
          retention-days: 30

  # Compatibility checks run on every ref, independently of optional measurements.
  reachability-sdk:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./pkg/polyad-types './pkg/polyad-sdk[reachability]' 'pytest>=9,<10'
      - run: python -m pytest -o addopts='' pkg/tests/test_reachability.py --junitxml=reachability-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reachability-tests-${{ matrix.python }}
          path: reachability-tests.xml

  # Local process studies exercise soul/nature without provisioning cloud resources.
  process-tests:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./pkg/polyad-types ./pkg/polyad-sdk ./pkg/polyad-benchmarks 'pytest>=9,<10'
      - run: python -m pytest -o addopts='' pkg/tests/test_process_studies.py --junitxml=process-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-tests-${{ matrix.python }}
          path: process-tests.xml

  # Exercise the operator on a disposable Kubernetes cluster with both cache modes.
  operator:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dragonfly-ha: [false, true]
    env:
      POLYAD_TEST_DRAGONFLY_HA: ${{ matrix.dragonfly-ha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - *release-python
      - *release-metadata
      - *release-locks
      - uses: helm/kind-action@v1
        with:
          cluster_name: polyad-test
          config: pkg/tests/kind.yaml
      - name: Read Helm version
        id: tools
        run: echo "helm=v$(bash scripts/tooling/tool-version.sh helm)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ steps.tools.outputs.helm }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and load Kind image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/operator/Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: polyad:test
          cache-from: |
            type=gha,scope=operator-${{ matrix.dragonfly-ha }}-amd64
            type=gha,scope=container-production-amd64
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.dragonfly-ha }}-amd64
      - run: kind load docker-image polyad:test --name polyad-test
      - name: Build chart dependencies
        run: bash scripts/tooling/build-chart-dependencies.sh charts/polyad
      - name: Install KEDA for HA cache scaling
        if: matrix.dragonfly-ha
        run: helm upgrade --install keda kedacore/keda --version 2.20.2 --namespace keda --create-namespace --wait --timeout=300s
      - run: helm upgrade --install polyad charts/polyad --namespace polyad --create-namespace --set operator.image.repository=polyad --set operator.image.tag=test --set dragonfly.ha.enabled=${{ matrix.dragonfly-ha }} --wait --timeout=300s
      - name: Verify HA cache scaling bridge
        if: matrix.dragonfly-ha
        run: |
          kubectl -n polyad wait dragonflypool/polyad-queue --for=jsonpath='{.status.phase}'=Ready --timeout=300s
          kubectl -n polyad wait scaledobject/polyad-queue --for=condition=Ready --timeout=300s
      - run: bash scripts/testing/test-operator.sh
      - run: kubectl -n polyad delete graphs,polygraphs,replicagroups --all --wait=true --timeout=120s
      - run: bash scripts/testing/test-replacement.sh
      - run: bash scripts/testing/test-coordination.sh
      - name: Collect operator failure diagnostics
        if: failure()
        continue-on-error: true
        run: bash scripts/testing/collect-operator-diagnostics.sh

  # Join every branch before the environment-protected release stage.
  verified:
    name: All checks passed
    if: always()
    needs:
      - source
      - terraform
      - python
      - coverage
      - lightweight-packages
      - container
      - compose
      - chart
      - chart-package
      - studies
      - benchmark-smoke
      - benchmark-images
      - benchmark-refresh
      - reachability-sdk
      - process-tests
      - operator
    runs-on: ubuntu-latest
    steps:
      - name: Require every pipeline branch to succeed
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.source.outputs.release-tag }}
          REFRESH: ${{ needs.source.outputs.refresh }}
          FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.full-refresh }}
        run: |
          python3 - <<'PY'
          import json
          import os

          # Skip only jobs whose feature was not selected for this run.
          optional = set()
          if not os.environ['RELEASE_TAG']:
              optional.add('chart-package')
          if os.environ['REFRESH'] != 'true':
              optional.add('studies')
          if os.environ['FULL_REFRESH'] != 'true':
              optional.add('benchmark-refresh')
          failures = {
              name: result['result']
              for name, result in json.loads(os.environ['RESULTS_JSON']).items()
              if result['result'] != 'success' and not (name in optional and result['result'] == 'skipped')
          }
          if failures:
              raise SystemExit(f'Pipeline checks did not pass: {failures}')
          print('Every required pipeline branch passed.')
          PY

  publish:
    name: Publish verified release
    needs: [source, verified, python]
    # Explicit success permits intentionally skipped optional jobs, but never failed checks.
    if: "!cancelled() && needs.verified.result == 'success' && needs.source.outputs.release-tag != ''"
    concurrency:
      group: pypi-${{ needs.source.outputs.release-tag }}
      cancel-in-progress: false
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - *release-python
      - *release-metadata
      # Verified distributions need no dependency resolution or rebuild here.
      - name: Install Poetry
        run: pip install "poetry==$(bash scripts/tooling/tool-version.sh poetry)"
      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ needs.source.outputs.release-tag }}
        run: python .github/release-version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/
      - name: Publish wheel and source distribution
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$POETRY_PYPI_TOKEN_PYPI" ]]; then
            echo '::error::PYPI_API_TOKEN is unavailable. Grant this repository access to the organization secret, or set a repository/environment secret.'
            exit 1
          fi

          # Check the complete release before uploading its first package.
          for package in polyad_types polyad_schemas polyad_sdk polyad_benchmarks polyad; do
            test -s "dist/${package}-${PACKAGE_VERSION}-py3-none-any.whl"
            test -s "dist/${package}-${PACKAGE_VERSION}.tar.gz"
          done
          echo "Publishing all five Polyad distributions at $PACKAGE_VERSION to PyPI"
          poetry -C pkg/polyad-types publish --dist-dir ../../dist --no-interaction
          poetry -C pkg/polyad-schemas publish --dist-dir ../../dist --no-interaction
          poetry -C pkg/polyad-sdk publish --dist-dir ../../dist --no-interaction
          poetry -C pkg/polyad-benchmarks publish --dist-dir ../../dist --no-interaction
          poetry publish --no-interaction
