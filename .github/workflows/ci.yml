name: Polyad pipeline
on:
  push:
    branches: ['**', '!pr-assets']
    tags: ['**']
  pull_request:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish; leave empty for validation only
        type: string
        default: ''
      refresh:
        description: Refresh local study measurements and graphs for an open PR
        type: boolean
        default: false
      pull-request:
        description: Open PR number for refresh; select its current head branch as the workflow ref
        type: string
        default: ''
      full-refresh:
        description: Also run installed cloud fixtures for the requested PR refresh (requires refresh)
        type: boolean
        default: false
      context:
        description: Explicit kubeconfig context on the administrator-provided benchmark runner
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: polyad-${{ github.event_name }}-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  # Only superseded PR checks may be cancelled, never an in-flight release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  # Pin all stage checkouts to one commit and validate manual PR requests up front.
  source:
    if: github.event_name != 'pull_request_target' && github.event_name != 'schedule'
    name: Resolve pipeline source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      release-tag: ${{ steps.source.outputs.release-tag }}
      refresh: ${{ steps.request.outputs.refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin every branch of the pipeline to one commit
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" && "$GITHUB_REF" =~ ^refs/tags/v[0-9] ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -n "$tag" ]]; then
            git check-ref-format "refs/tags/$tag"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            printf 'release-tag=%s\n' "$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Validate an explicitly requested PR refresh
        id: request
        if: github.event_name == 'workflow_dispatch' && (inputs.refresh || inputs.full-refresh)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request }}
          REFRESH: ${{ inputs.refresh }}
          FULL_REFRESH: ${{ inputs.full-refresh }}
          BENCHMARK_CONTEXT: ${{ inputs.context }}
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REFRESH" != true || -n "$RELEASE_TAG" || ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Refresh requires refresh=true, an open PR number and its head branch, without a release tag.'
            exit 1
          fi
          if [[ "$FULL_REFRESH" == true && -z "$BENCHMARK_CONTEXT" ]]; then
            echo '::error::Cloud refresh requires an explicit Kubernetes context.'
            exit 1
          fi

          # Resolve the PR before any benchmark runs; never load a fork onto the cloud runner.
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
            --arg ref "$GITHUB_REF" --arg base "$DEFAULT_BRANCH" '
            .state == "open" and .draft == false and
            .head.repo.full_name == $repository and .base.repo.full_name == $repository and
            .base.ref == $base and .head.ref != $base and
            .head.sha == $sha and ("refs/heads/" + .head.ref) == $ref
            ' <<< "$metadata" > /dev/null || {
              echo '::error::Select the current head branch of an open, ready PR in this repository.'
              exit 1
            }
          echo 'refresh=true' >> "$GITHUB_OUTPUT"

  # Independent validation groups start together; decomposition adds no build/test barrier.
  test-stage:
    name: Test
    needs: source
    uses: ./.github/workflows/stage-test.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      release-tag: ${{ needs.source.outputs.release-tag }}

  build-stage:
    name: Build
    needs: source
    uses: ./.github/workflows/stage-build.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      release-tag: ${{ needs.source.outputs.release-tag }}

  verified:
    name: CI verification
    if: always() && github.event_name != 'pull_request_target' && github.event_name != 'schedule'
    needs: [source, test-stage, build-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          optional = set()
          failures = {
              name: result['result']
              for name, result in json.loads(os.environ['RESULTS_JSON']).items()
              if result['result'] != 'success' and not (name in optional and result['result'] == 'skipped')
          }
          if failures:
              raise SystemExit(f'Pipeline checks did not pass: {failures}')
          print('Every required stage check passed.')
          PY

  # Measurements run only for validated, manually requested PRs after ordinary checks.
  measure-stage:
    name: Benchmark / refresh
    needs: [source, verified]
    if: "!cancelled() && needs.verified.result == 'success' && needs.source.outputs.refresh == 'true'"
    uses: ./.github/workflows/stage-measure.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      full-refresh: ${{ inputs.full-refresh || false }}
      context: ${{ inputs.context || '' }}

  deploy-stage:
    name: Deploy
    needs: [source, verified]
    if: "!cancelled() && needs.verified.result == 'success' && needs.source.outputs.release-tag != ''"
    uses: ./.github/workflows/stage-deploy.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      release-tag: ${{ needs.source.outputs.release-tag }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    permissions:
      contents: write
      pull-requests: write
  # Reporting remains a leaf, outside the required validation and release stages.
  coverage-badge:
    name: Publish coverage badge
    needs: [source, test-stage]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      # Publication uses a verified API commit on the artifact branch, without persisted checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-coverage-all
      - name: Read Node pin
        id: tools
        run: echo "nodejs=$(bash scripts/tooling/tool-version.sh nodejs)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.tools.outputs.nodejs }}
      - name: Bind measured coverage to the source commit
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: node scripts/coverage/coverage-badge.mjs coverage.json .cache/coverage/badges "$SOURCE_SHA"
      - name: Publish verified coverage API commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |-
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/coverage/publish-coverage.mjs`);
            await main({github, context, core});
  release-complete:
    name: Release verification
    needs:
      - source
      - verified
      - deploy-stage
    if: "!cancelled() && needs.source.outputs.release-tag != ''"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject absent or skipped publication
        env:
          VALIDATION_RESULT: ${{ needs.verified.result }}
          DEPLOY_RESULT: ${{ needs.deploy-stage.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$DEPLOY_RESULT" = success

  generated-repair:
    name: Repair generated conflicts
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch)
      || github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/stage-repair.yml
    permissions:
      contents: write
      pull-requests: read
