name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-release
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Read shared tool versions
        id: tools
        run: |
          echo "nodejs=$(bash scripts/tool-version.sh nodejs)" >> "$GITHUB_OUTPUT"
          echo "poetry=$(bash scripts/tool-version.sh poetry)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-go@v6
        with:
          go-version-file: tests/flux/go.mod
          cache-dependency-path: tests/flux/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.nodejs }}
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json
      - run: pip install "poetry==${{ steps.tools.outputs.poetry }}"
      - name: Validate distribution version
        id: version
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            python .github/release-version.py --tag "${BUILD_REF#refs/tags/}" --output "$GITHUB_OUTPUT"
          else
            python .github/release-version.py --output "$GITHUB_OUTPUT"
          fi
      - run: poetry install
      - run: bash scripts/ci/install-helm-tools.sh helm shellcheck shfmt argocd
      - name: Build chart dependencies
        run: |
          helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
          helm dependency build charts/polyad
      - run: poetry run pre-commit run --all-files
      - name: Validate Flux health expressions
        env:
          POLYAD_FLUX_CHECKS: ${{ runner.temp }}/polyad-flux-checks.json
        run: |
          poetry run python scripts/flux-health.py --json > "$POLYAD_FLUX_CHECKS"
          test -z "$(gofmt -l tests/flux/*.go)"
          go -C tests/flux test -mod=readonly -parallel 8 ./...
      - run: npm test --prefix scripts/mermaid
      - run: docker run -d --name dragonfly -p 6379:6379 docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0 --proactor_threads=1 --maxmemory=256mb
      - run: |
          for _attempt in $(seq 1 30); do
            if poetry run python -c "import redis; redis.Redis().ping()"; then break; fi
            sleep 1
          done
          poetry run python -c "import redis; redis.Redis().ping()"
      - name: Run Python tests in parallel
        run: poetry run pytest
        env:
          POLYAD_TEST_DRAGONFLY_URL: redis://localhost:6379/0
      - name: Check installed wheel typing
        run: |
          poetry build
          poetry run python -m venv /tmp/polyad-typing
          /tmp/polyad-typing/bin/python -m pip install dist/*.whl
          POLYAD_TYPING_PYTHON=/tmp/polyad-typing/bin/python poetry run pytest tests/test_typing.py
      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [development, production]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-release
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build container profile
        run: |
          docker build --target "${{ matrix.profile }}" \
            --build-arg VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')" \
            --build-arg VCS_REF="$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t polyad:container-test .
      - name: Check non-root container profile
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint python -i polyad:container-test - "${{ matrix.profile }}" < scripts/check-container.py
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges polyad:container-test --help
      - name: Check development tests
        if: matrix.profile == 'development'
        run: docker run --rm --entrypoint python polyad:container-test -m pytest -n 2 tests/test_balance_gates.py
  compose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci/install-helm-tools.sh helm
      - name: Build chart dependencies
        run: |
          helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
          helm dependency build charts/polyad
      - name: Helm to Docker Compose
        id: compose
        uses: astrivant/composer@v0.3.0
        with:
          watch-directory: '.'
          chart: charts/polyad
          commit: 'false'
          release: polyad
          namespace: polyad
          output: dist/compose/compose.yaml
          report: dist/compose/report.json
      - name: Upload generated Compose
        if: steps.compose.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: polyad-compose
          path: dist/compose/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  chart:
    uses: ./.github/workflows/chart.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      release-tag: ${{ startsWith(inputs.ref || github.ref, 'refs/tags/') && (inputs.ref || github.ref_name) || '' }}
  operator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dragonfly-ha: [false, true]
    env:
      POLYAD_TEST_DRAGONFLY_HA: ${{ matrix.dragonfly-ha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-release
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: polyad-test
          config: tests/kind.yaml
      - name: Read Helm version
        id: tools
        run: echo "helm=v$(bash scripts/tool-version.sh helm)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ steps.tools.outputs.helm }}
      - run: docker build --target production -t polyad:test .
      - run: kind load docker-image polyad:test --name polyad-test
      - name: Build chart dependencies
        run: |
          helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
          helm dependency build charts/polyad
      - run: helm upgrade --install polyad charts/polyad --namespace polyad --create-namespace --set operator.image.repository=polyad --set operator.image.tag=test --set dragonfly.ha.enabled=${{ matrix.dragonfly-ha }} --wait --timeout=300s
      - run: bash scripts/test-operator.sh
      - run: kubectl -n polyad delete graphs,polygraphs,ephemeralgraphs,feedbacks --all --wait=true --timeout=120s
      - run: bash scripts/test-replacement.sh
      - run: bash scripts/test-coordination.sh
      - if: failure()
        run: |
          kubectl -n polyad get pods,leases,dragonflies,graphs,polygraphs,ephemeralgraphs,feedbacks -o yaml
          kubectl -n polyad logs deployment/polyad-polyad --tail=200
