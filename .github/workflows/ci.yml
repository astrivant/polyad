name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Read shared tool versions
        id: tools
        run: |
          echo "nodejs=$(bash scripts/tool-version.sh nodejs)" >> "$GITHUB_OUTPUT"
          echo "poetry=$(bash scripts/tool-version.sh poetry)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.nodejs }}
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json
      - run: pip install "poetry==${{ steps.tools.outputs.poetry }}"
      - name: Validate distribution version
        id: version
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            python .github/release-version.py --tag "${BUILD_REF#refs/tags/}" --output "$GITHUB_OUTPUT"
          else
            python .github/release-version.py --output "$GITHUB_OUTPUT"
          fi
      - run: poetry install
      - run: bash scripts/ci/install-helm-tools.sh helm shellcheck shfmt
      - run: helm dependency build charts/polyad
      - run: poetry run pre-commit run --all-files
      - run: npm test --prefix scripts/mermaid
      - run: docker run -d --name dragonfly -p 6379:6379 docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0 --proactor_threads=1 --maxmemory=256mb
      - run: |
          for attempt in $(seq 1 30); do
            if poetry run python -c "import redis; redis.Redis().ping()"; then break; fi
            sleep 1
          done
          poetry run python -c "import redis; redis.Redis().ping()"
      - name: Run Python tests in parallel
        run: poetry run pytest
        env:
          POLYAD_TEST_DRAGONFLY_URL: redis://localhost:6379/0
      - name: Check installed wheel typing
        run: |
          poetry build
          poetry run python -m venv /tmp/polyad-typing
          /tmp/polyad-typing/bin/python -m pip install dist/*.whl
          POLYAD_TYPING_PYTHON=/tmp/polyad-typing/bin/python poetry run pytest tests/test_typing.py
      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: bash scripts/ci/install-helm-tools.sh helm kubeconform
      - run: helm dependency build charts/polyad
      - uses: astrivant/hypothesis-helm@main
        with:
          chart: charts/polyad
          max-examples: '10'
          # Test the public chart interface, including exposed dependency options.
          match: '(not dragonflyOperator or replicaCount or (nameOverride and not fullnameOverride) or crds or extraArgs) and not (istioBase or istiod or istioIngress or global) and (not mesh or mesh_enabled or mesh_operator or mesh_ingress_enabled or mesh_ingress_hosts or mesh_ingress_tlsSecret)'
          kubeconform: 'true'
          kubeconform-binary: scripts/kubeconform.sh
          schema-version: '1.35.0'
  operator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dragonfly-ha: [false, true]
    env:
      POLYAD_TEST_DRAGONFLY_HA: ${{ matrix.dragonfly-ha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: polyad-test
          config: tests/kind.yaml
      - name: Read Helm version
        id: tools
        run: echo "helm=v$(bash scripts/tool-version.sh helm)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ steps.tools.outputs.helm }}
      - run: docker build -t polyad:test .
      - run: kind load docker-image polyad:test --name polyad-test
      - run: helm dependency build charts/polyad
      - run: helm upgrade --install polyad charts/polyad --namespace polyad --create-namespace --set image.repository=polyad --set image.tag=test --set dragonfly.ha.enabled=${{ matrix.dragonfly-ha }} --wait --timeout=300s
      - run: bash scripts/test-operator.sh
      - run: kubectl -n polyad delete graphs,polygraphs,ephemeralgraphs,feedbacks --all --wait=true --timeout=120s
      - run: bash scripts/test-replacement.sh
      - run: bash scripts/test-coordination.sh
      - if: failure()
        run: |
          kubectl -n polyad get pods,leases,dragonflies,graphs,polygraphs,ephemeralgraphs,feedbacks -o yaml
          kubectl -n polyad logs deployment/polyad-polyad --tail=200
