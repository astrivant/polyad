name: Repair declared generated conflicts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: generated-conflict-repair
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      # No PR checkout, local action, dependency install or candidate generator runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/repair/repair.mjs`);
            await main({github, context, core});
