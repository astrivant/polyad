[project]
name = "polyad"
version = "0.0.1a3"
description = "Kubernetes operator for scheduling workloads through graphs"
authors = [{name = "Emma Doyle"}]
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4.0"
keywords = ["polyad", "kubernetes", "operator", "graphs", "topology", "scheduling", "autoscaling"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "kopf>=1.37,<2",
    "kubernetes>=32,<36",
    "PyYAML>=6,<7",
    "attrs>=24,<27",
    "cattrs>=24,<27",
    "redis>=5.2,<7",
    "psycopg[binary,pool]>=3.3,<4",
    "networkx>=3.6,<4",
    "flask>=3.1,<4",
    "apispec>=6.10,<7",
    "numpy>=2.2,<3",
    "waitress>=3,<4",
    "websockets>=17.1,<18",
    "hypercorn>=0.18,<0.19",
    "flask-limiter[redis]>=4.1,<5",
    "prometheus-client>=0.22,<1",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "polyad-types==0.0.1a3",
]

[project.urls]
Homepage = "https://github.com/astrivant/polyad"
Documentation = "https://github.com/astrivant/polyad/blob/main/docs/README.md"
Repository = "https://github.com/astrivant/polyad"
Issues = "https://github.com/astrivant/polyad/issues"
Changelog = "https://github.com/astrivant/polyad/releases"

[project.optional-dependencies]
flask-auth = ["flask-httpauth>=4.8,<5"]

[project.scripts]
polyad-operator = "polyad.operator.runtime:main"

[tool.poetry]
packages = [{include = "polyad", from = "pkg"}]
include = [
    {path = "pkg/polyad/sql/**/*.sql", format = ["sdist", "wheel"]},
    {path = "pkg/polyad/lua/**/*.lua", format = ["sdist", "wheel"]},
]

[tool.poetry.dependencies]
polyad-types = {path = "pkg/polyad-types"}

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10"
deepdiff = ">=9.1,<10"
ruff = "^0.15"
mypy = "^1.15"
matplotlib = ">=3.10,<4"
pre-commit = "4.6.0"
pydocstyle = "6.3.0"
pydoclint = "0.6.6"
types-networkx = "^3.6.1.20260911"
types-waitress = ">=3,<4"
jsonschema = ">=4.26,<5"
openapi-spec-validator = ">=0.7,<0.9"
pytest-xdist = ">=3.8,<4"

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["pkg/tests"]
pythonpath = ["pkg", "pkg/client", "pkg/polyad-types"]
addopts = "-n auto --maxprocesses=8 --dist=worksteal"

[tool.ruff]
src = [".", "pkg", "pkg/client", "pkg/polyad-types"]
line-length = 140
target-version = "py313"

[tool.ruff.per-file-target-version]
"pkg/polyad-types/**/*.py" = "py311"
"pkg/client/**/*.py" = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "TC"]
ignore = ["D200", "D212"]
extend-select = ["D213"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = []
runtime-evaluated-decorators = ["attrs.define", "attrs.frozen"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["pkg", "examples"]
exclude = ["^pkg/tests/"]

[[tool.mypy.overrides]]
module = ["kubernetes.*", "flask_httpauth"]
ignore_missing_imports = true

[tool.pydocstyle]
convention = "google"
add-ignore = ["D200", "D212"]
add-select = ["D213"]
match = ".*\\.py"

[tool.pydoclint]
style = "google"
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-arg-order = true
allow-init-docstring = true
require-return-section-when-returning-nothing = true
# Pydoclint only sees local raise statements and rejects documented propagated errors.
skip-checking-raises = true
