# yaml-language-server: $schema=../../charts/polyad/values.reference.schema.json
## @param metrics [object] Settings for metrics.
metrics:
  ## @param metrics.enabled [boolean] Serve cached queue, write, inventory, component, backend and root-worker metrics on internal port 8092; optional families follow their feature enablement
  enabled: true
  ## @param metrics.graphLabels [boolean] Expose per-graph topology, policy, Cheeger, spectrum, throughput and workload-signal series; increases cardinality, does not gate JSON or KEDA scalar routes
  graphLabels: true
  ## @param metrics.graphSpectra [boolean] Retain already-calculated eigenvalues for graph diagnostics; adds per-rule storage and time series when graphLabels is enabled.
  graphSpectra: true
## @param tracing [object] Opt-in OTLP/HTTP traces and independently enabled logs for operators and observers.
tracing:
  ## @param tracing.enabled [boolean] Create a batched trace exporter only when enabled.
  enabled: true
  ## @param tracing.endpoint [string] Full HTTP/protobuf trace endpoint including its trace path, usually /v1/traces.
  endpoint: http://benchmarks-otel.polyad.svc:4318/v1/traces
  ## @param tracing.samplingRatio [number] Fraction of new root traces sampled; parent sampling decisions are honored.
  samplingRatio: 1
  ## @param tracing.resourceAttributes [string] Comma-separated key=value resource attributes describing the deployment.
  resourceAttributes: deployment.environment.name=benchmark
