# yaml-language-server: $schema=operator-values.schema.json
# Install this separate infrastructure release before enabling the Polyad database.
# helm repo add cnpg https://cloudnative-pg.github.io/charts
# helm upgrade --install cnpg cnpg/cloudnative-pg --version 0.29.0 \
#   --namespace cnpg-system --create-namespace --values examples/postgresql/operator-values.yaml --wait
## @param replicaCount [integer] Settings for replicaCount.
replicaCount: 2
## @param crds [object] Settings for crds.
crds:
  ## @param crds.create [boolean] Settings for crds.create.
  create: true
